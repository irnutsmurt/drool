# Quick start:
#   docker compose up -d
#   docker compose logs drool     # shows the URL and one-time setup code
services:
  drool:
    build: .
    image: drool:local
    restart: unless-stopped
    ports:
      - "8080:8080"   # web UI and API
      - "9443:9443"   # agent endpoint (agents connect to it)
    # Agents need an address they can reach; inside a container DROOL can't
    # know it. Set it to this machine's name or IP (port 9443):
    # environment:
    #   DROOL_AGENT_ADVERTISE: drool.example.net:9443
    volumes:
      - drool-data:/data
    # Optional: provide your own setup code for automated deployments
    # instead of reading the generated one from the logs.
    # environment:
    #   DROOL_SETUP_SECRET_FILE: /run/secrets/drool_setup
    # secrets:
    #   - drool_setup

volumes:
  drool-data:

# secrets:
#   drool_setup:
#     file: ./setup-secret.txt
