# Quick start:
#   docker compose up -d
#   docker compose logs drool     # shows the URL and one-time setup code
services:
  drool:
    build: .
    image: drool:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - drool-data:/data
    # Optional: provide your own setup code for automated deployments
    # instead of reading the generated one from the logs.
    # environment:
    #   DROOL_SETUP_SECRET_FILE: /run/secrets/drool_setup
    # secrets:
    #   - drool_setup

volumes:
  drool-data:

# secrets:
#   drool_setup:
#     file: ./setup-secret.txt
