# DROOL with Docker Compose.
#
#   docker compose pull         # download the image named below
#   docker compose up -d
#   docker compose logs drool   # the URL and the one-time setup code
#
# The image: as published in DROOL's repository, this file runs DROOL's
# development image from GitHub Container Registry, ghcr.io/irnutsmurt/drool:main,
# rebuilt from the newest code that passed DROOL's tests (`docker compose pull`
# gets the newest). A release ships this file with its own version filled in,
# next to its image file: `docker load -i drool_<version>_image.oci.tar`
# instead of the pull. DROOL_IMAGE runs another image, for example
# DROOL_IMAGE=drool:local after `make image` in a source checkout.
services:
  drool:
    image: ${DROOL_IMAGE:-ghcr.io/irnutsmurt/drool:main}
    restart: unless-stopped
    ports:
      - "8080:8080"   # web UI and API
      - "9443:9443"   # Shepherd endpoint (Shepherds connect to it)
    # Shepherds need an address they can reach; inside a container DROOL can't
    # know it. Set it to this machine's name or IP (port 9443):
    # environment:
    #   DROOL_AGENT_ADVERTISE: drool.example.net:9443
    volumes:
      - drool-data:/data
    # DROOL needs no privileges, capabilities or host access: it listens on
    # unprivileged ports, writes only to /data (and /tmp for backup verify),
    # and manages hosts' firewalls over SSH or the Shepherd, never this
    # machine's.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/drool", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Optional: provide your own setup code for automated deployments
    # instead of reading the generated one from the logs.
    # environment:
    #   DROOL_SETUP_SECRET_FILE: /run/secrets/drool_setup
    # secrets:
    #   - drool_setup

volumes:
  drool-data:

