openapi: 3.1.0
info:
  title: DROOL API
  version: 0.1.0
  description: |
    Public REST API. The web UI uses this same API.

    Authentication: a browser session cookie (`drool_session`) or `Authorization: Bearer drool_tok_...`.
    State-changing requests made with a session cookie must send the `X-DROOL-CSRF` header,
    using the value of `csrf_token` from `/auth/me` or the login response.

    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /api/v1
security:
  - session: []
  - bearer: []

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      description: Whether the controller still needs its first administrator.
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
  /setup/claim:
    post:
      operationId: claimSetup
      tags: [setup]
      security: []
      description: |
        Create the first administrator using the one-time setup code shown in the controller's
        console output (or an operator-provided setup secret). Succeeds at most once; on success
        the new administrator is logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupClaimRequest' }
      responses:
        '201':
          description: Administrator created and logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >-
            Logged in (sets the session cookie), or, for a user with two-factor authentication, the password was
            accepted and the sign-in continues at /auth/login/mfa with the returned challenge (no cookie yet).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Me' }
                  - { $ref: '#/components/schemas/MfaChallenge' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/login/mfa:
    post:
      operationId: loginMfa
      tags: [auth]
      security: []
      description: Second step of signing in with two-factor authentication. Give either a code from the authenticator or a recovery code (single use). The challenge expires after 5 minutes or 5 wrong codes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginMfaRequest' }
      responses:
        '200':
          description: Logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      description: >-
        Confirm who you are again (password, plus a two-factor code when enrolled) so high-impact actions are allowed for
        the re-authentication window. Those actions answer 403 `reauth_required` otherwise. Sessions only; failures count
        toward the sign-in rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthRequest' }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/mfa:
    get:
      operationId: getMfa
      tags: [auth]
      description: The current user's two-factor authentication.
      responses:
        '200':
          description: Two-factor state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
    delete:
      operationId: disableMfa
      tags: [auth]
      description: Turn two-factor authentication off. Needs recent re-authentication; ends the user's other sessions.
      responses:
        '204': { description: Turned off. }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/mfa/enroll:
    post:
      operationId: enrollMfa
      tags: [auth]
      description: >-
        Start setting up an authenticator: returns its secret once (for a QR code or typing in). It counts only after
        /auth/mfa/confirm. Needs recent re-authentication. Refused while two-factor is on.
      responses:
        '200':
          description: The new authenticator's secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      tags: [auth]
      description: Turn two-factor on with a code from the new authenticator. Returns recovery codes once; ends the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string }
      responses:
        '200':
          description: Two-factor is on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [auth]
      description: New recovery codes (shown once); the previous ones stop working. Needs recent re-authentication.
      responses:
        '200':
          description: New codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      description: Change the current user's password. Requires an interactive session. Revokes the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      description: 'Requires `users.manage`.'
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      tags: [users]
      description: Disabling a user or setting their password revokes their sessions. The last enabled administrator cannot be demoted or disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      tags: [users]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /users/{id}/mfa/reset:
    post:
      operationId: resetUserMfa
      tags: [users]
      description: 'Turn off another user''s two-factor authentication (lost authenticator and recovery codes). Ends their sessions. Requires `users.manage` and recent re-authentication.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Reset. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      description: The current user's API tokens.
      responses:
        '200':
          description: Tokens (secrets are never returned).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/APIToken' } }
    post:
      operationId: createToken
      tags: [tokens]
      description: Requires an interactive session, so a leaked token cannot mint more tokens. The token secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIToken' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteToken
      tags: [tokens]
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      description: 'Requires `audit.read`. Newest first; cursor pagination.'
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: actor, in: query, description: Actor id, schema: { type: string } }
        - { name: action, in: query, description: Action prefix, e.g. "auth.", schema: { type: string } }
        - { name: target, in: query, description: Target id, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next_cursor: { type: string }
        '403': { $ref: '#/components/responses/Problem' }

  /audit/integrity:
    get:
      operationId: getAuditIntegrity
      tags: [audit]
      description: 'The audit hash chain: its head, the latest verifications and any acknowledged break. Requires `audit.read`.'
      responses:
        '200':
          description: Integrity state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrity' }
        '403': { $ref: '#/components/responses/Problem' }
  /audit/integrity/verify:
    post:
      operationId: verifyAudit
      tags: [audit]
      description: 'Recompute the whole chain in the background. Requires `audit.read`. 409 while a check runs.'
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /audit/integrity/acknowledge:
    post:
      operationId: acknowledgeAuditBreak
      tags: [audit]
      description: >-
        Record that an administrator investigated the problems the newest failed verification found. The chain is not
        changed and later verifications still report the problems; only exactly these are then shown as known. Requires
        `settings.write` and recent re-authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Integrity state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrity' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit/sink:
    get:
      operationId: getAuditSink
      tags: [audit]
      description: 'The remote copy of the audit history: settings (never the header value) and delivery state. Requires `settings.read`.'
      responses:
        '200':
          description: Sink state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditSink' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putAuditSink
      tags: [audit]
      description: 'Configure the remote copy. Requires `settings.write` and recent re-authentication.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditSinkRequest' }
      responses:
        '200':
          description: Sink state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditSink' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit/sink/test:
    post:
      operationId: testAuditSink
      tags: [audit]
      description: 'Send an empty export (test: true) with the given settings, or the stored ones without a body. Requires `settings.write`.'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditSinkRequest' }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      description: 'Configuration values and their sources are included only with `settings.read`.'
      responses:
        '200':
          description: System information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
  /system/restore:
    get:
      operationId: getRestoreStatus
      tags: [system]
      description: 'The latest restore of this controller (`restore` is null when it was never restored), what the restore set aside, and every host''s reconciliation with the new controller epoch (ARCHITECTURE-ALPHA §33.1). Requires `settings.read`.'
      responses:
        '200':
          description: Restore reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreStatus' }
        '403': { $ref: '#/components/responses/Problem' }
  /system/restore/finish:
    post:
      operationId: finishRestore
      tags: [system]
      description: 'Close the restore''s reconciliation. Hosts not reconciled yet keep refusing this controller''s commands until they are; their Shepherds are still compared whenever they connect. Requires `settings.write` and recent re-authentication.'
      responses:
        '200':
          description: Restore reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/reconciliation:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    get:
      operationId: getHostReconciliation
      tags: [hosts]
      description: 'The host''s reconciliation after the latest restore (404 when the controller was never restored or the host wasn''t part of it). Requires `hosts.read`.'
      responses:
        '200':
          description: Reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReconciliation' }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/reconciliation/accept:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    post:
      operationId: acceptHostState
      tags: [hosts]
      description: 'Accept the host''s state as it is (state changed after the backup, state that disagrees with the restored controller''s, or a Shepherd identity now presented by another machine) and compare it again: it is moved to the new epoch without anything on the host changing, and DROOL''s own configuration then shows where it differs. Refused (409) for hosts blocked for other reasons. Requires `settings.write` and recent re-authentication.'
      responses:
        '200':
          description: Reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReconciliation' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/reconciliation/retry:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    post:
      operationId: retryHostReconciliation
      tags: [hosts]
      description: 'Compare the host again now. Requires `settings.write`.'
      responses:
        '200':
          description: Reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReconciliation' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /secrets:
    get:
      operationId: listSecrets
      tags: [credentials]
      description: 'Credential metadata (values are never returned). Requires `credentials.use`.'
      responses:
        '200':
          description: Credentials.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Credential' } }
    post:
      operationId: createSecret
      tags: [credentials]
      description: |
        Requires `credentials.manage`. For `ssh_private_key`, either paste a key in `value`
        (with `passphrase` if it is encrypted; the passphrase is not stored) or set `generate`
        to create a new ed25519 key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /secrets/controller-ssh-key:
    get:
      operationId: getControllerKey
      tags: [credentials]
      description: The controller's default SSH public key and a command to install it on a host.
      responses:
        '200':
          description: Controller key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControllerKey' }
  /secrets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSecret
      tags: [credentials]
      responses:
        '200':
          description: Credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSecret
      tags: [credentials]
      description: 'Rename or describe a credential, or replace its value. Replacing the value of a credential hosts use switches them all at once: refused (409 `credential_in_use`, naming the hosts) unless `replace_in_use` acknowledges it, and then it needs recent re-authentication. Safer: add the new value as a separate credential, test it, switch the hosts, delete the old one.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCredentialRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSecret
      tags: [credentials]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      parameters:
        - { name: q, in: query, description: Substring of name, address or description, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: group, in: query, description: Group id, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HostStatus' } }
      responses:
        '200':
          description: Hosts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Host' } }
    post:
      operationId: createHost
      tags: [hosts]
      description: |
        New hosts start in `pending_hostkey`. Scan and approve the host key, then run a
        connection test. `credential_id` defaults to the controller key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHost
      tags: [hosts]
      responses:
        '200':
          description: Host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateHost
      tags: [hosts]
      description: Changing the address or port retires the pinned host key; it must be approved again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteHost
      tags: [hosts]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/ssh-auth:
    get:
      operationId: getHostSSHAuth
      tags: [hosts]
      description: 'How DROOL signs in to the host over SSH, and what it knows about the host''s trust in each SSH certificate authority. Requires `hosts.read`.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sign-in method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSSHAuth' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setHostSSHAuth
      tags: [hosts]
      description: >-
        Switch to certificates only after a brand-new connection that offered nothing but a certificate from the active
        authority (with the given principal) worked just now (409 certificate_refused otherwise; nothing changes). Back to
        the credential only when one is assigned. Requires `credentials.manage` and recent re-authentication.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode: { type: string, enum: [certificate, credential] }
                principal: { type: string, description: 'The principal certificates name (AuthorizedPrincipalsFile setups); empty means the SSH user.' }
      responses:
        '200':
          description: Sign-in method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSSHAuth' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /ssh-ca:
    get:
      operationId: getSSHCA
      tags: [credentials]
      description: 'DROOL''s SSH user certificate authorities (never their private keys). Requires `credentials.use`.'
      responses:
        '200':
          description: Authorities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHCAState' }
    post:
      operationId: createSSHCA
      tags: [credentials]
      description: 'Create the first authority (it becomes active). 409 if one exists: rotate instead. Requires `credentials.manage` and recent re-authentication.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSHCANameRequest' }
      responses:
        '200':
          description: Authorities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHCAState' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /ssh-ca/rotate:
    post:
      operationId: rotateSSHCA
      tags: [credentials]
      description: 'Introduce a new authority (state next): hosts are made to trust it with the trust step while the current one keeps issuing. Requires `credentials.manage` and recent re-authentication.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSHCANameRequest' }
      responses:
        '200':
          description: Authorities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHCAState' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /ssh-ca/{id}/activate:
    post:
      operationId: activateSSHCA
      tags: [credentials]
      description: 'Switch issuance to the introduced authority. Refused (409) until every host in certificate mode accepted it on a fresh connection. The old one stays trusted (previous) until retired. Requires `credentials.manage` and recent re-authentication.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHCAState' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /ssh-ca/{id}/retire:
    post:
      operationId: retireSSHCA
      tags: [credentials]
      description: 'Destroy an authority''s private key (previous, or an abandoned next). The active authority is never retired. Requires `credentials.manage` and recent re-authentication.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHCAState' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/hostkeys:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listHostKeys
      tags: [hosts]
      responses:
        '200':
          description: Pinned, offered and retired keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HostKey' } }
  /hosts/{id}/hostkeys/scan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: scanHostKeys
      tags: [hosts]
      description: Connects without authenticating and records the offered host keys for review.
      responses:
        '200':
          description: All keys for the host after the scan.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HostKey' } }
        '502': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/hostkeys/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveHostKey
      tags: [hosts]
      description: 'Pin an offered key by id, or by an expected fingerprint obtained out of band. Requires `hostkeys.approve`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key_id: { type: string }
                fingerprint: { type: string, example: 'SHA256:...' }
      responses:
        '200':
          description: Pinned key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostKey' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/probe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: probeHost
      tags: [hosts]
      description: |
        Connection test over a fresh connection: reachability, host key, authentication,
        privilege escalation, Linux and systemd. Changes nothing on the host; updates the
        host's status. Requires `jobs.execute`.
      responses:
        '200':
          description: Probe result (also returned when checks fail).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /hosts/{id}/facts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHostFacts
      tags: [hosts]
      description: Full discovered facts and known addresses. `facts` is null before the first discovery.
      responses:
        '200':
          description: Facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostFacts' }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: refreshHost
      tags: [hosts]
      description: |
        Run discovery, a status check and an update check now (from the package cache; no metadata
        refresh). Returns 409 if a job holds the host. Requires `jobs.execute`.
      responses:
        '200':
          description: Updated host and discovery warnings.
          content:
            application/json:
              schema:
                type: object
                required: [host, warnings]
                properties:
                  host: { $ref: '#/components/schemas/Host' }
                  warnings: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
    post:
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGroup
      tags: [groups]
      responses:
        '200':
          description: Group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateGroup
      tags: [groups]
      description: '`host_ids`, when present, replaces the members.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteGroup
      tags: [groups]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }

  /jobs/preview:
    post:
      operationId: previewJob
      tags: [jobs]
      description: Resolve targets without running anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { $ref: '#/components/schemas/TargetSpec' }
                steps:
                  type: array
                  description: Optional; hosts on which no step would run are marked `skip` with a reason.
                  items: { $ref: '#/components/schemas/Operation' }
                strategy: { $ref: '#/components/schemas/Strategy' }
      responses:
        '200':
          description: Resolved hosts (and, with a strategy, the rollout's waves).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPreview' }
        '422': { $ref: '#/components/responses/Problem' }
  /workflows:
    get:
      operationId: listWorkflows
      tags: [automation]
      parameters: [{ name: archived, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: Workflows (at most 500)., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workflow' } } } } } } }
    post:
      operationId: createWorkflow
      tags: [automation]
      description: A reusable, ordered list of typed steps with a default rollout (revision 1). Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /workflows/templates:
    get:
      operationId: workflowTemplates
      tags: [automation]
      description: Recommended starting points (ordinary, editable workflows once saved).
      responses:
        '200': { description: Templates., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkflowTemplate' } } } } } } }
  /workflows/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflow
      tags: [automation]
      responses:
        '200': { description: The workflow, its latest revision and its revisions., content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateWorkflow
      tags: [automation]
      description: Stores a new revision (nothing when nothing changed). Schedules keep the revision they pinned. Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { type: object, required: [workflow, changed], properties: { workflow: { $ref: '#/components/schemas/Workflow' }, changed: { type: boolean } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveWorkflow
      tags: [automation]
      description: Archive (schedules keep running their pinned revision; new schedules can't choose it). Audited.
      responses:
        '204': { description: Archived. }
        '404': { $ref: '#/components/responses/Problem' }
  /workflows/{id}/revisions/{rev}:
    get:
      operationId: getWorkflowRevision
      tags: [automation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rev, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: One immutable revision., content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRevision' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /workflows/{id}/run:
    post:
      operationId: runWorkflow
      tags: [automation]
      description: Runs a revision (default the latest) now as an ordinary job on the given targets. Needs jobs.execute and each step's own permissions. Repeating a request with the same `Idempotency-Key` returns the original job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                revision: { type: integer }
                targets: { $ref: '#/components/schemas/TargetSpec' }
                strategy: { $ref: '#/components/schemas/Strategy' }
                name: { type: string }
      responses:
        '201': { description: The job., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules:
    get:
      operationId: listSchedules
      tags: [automation]
      description: Schedules (jobs, workflows and recurring maintenance windows), the ones needing attention first. At most 1000.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [job, maintenance] } }
        - { name: archived, in: query, schema: { type: boolean } }
        - { name: owner, in: query, schema: { type: string, enum: [me] } }
      responses:
        '200': { description: Schedules., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Schedule' } } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSchedule
      tags: [automation]
      description: >-
        A job (inline steps, or a pinned workflow revision) on a recurrence, or a recurring maintenance window. The
        creator owns it; every run uses the owner's permissions, checked again before each occurrence. Needs
        schedules.manage plus what running it needs (jobs.execute and step permissions, or maintenance.manage). Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/preview:
    post:
      operationId: previewSchedule
      tags: [automation]
      description: What a schedule would do, without saving it — targets now, canary and batch waves, concurrency, threshold, steps, reboot and verification, the maintenance-window relationship, the next runs in its zone, and its missed-run and overlap behaviour.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleInput' } } } }
      responses:
        '200': { description: Preview., content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePreview' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/next-runs:
    post:
      operationId: scheduleNextRuns
      tags: [automation]
      description: The next occurrences of a recurrence in a time zone (with DST notes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recurrence, time_zone]
              properties:
                recurrence: { $ref: '#/components/schemas/Recurrence' }
                time_zone: { type: string }
                count: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Next runs.
          content: { application/json: { schema: { type: object, required: [when, runs], properties: { when: { type: string }, runs: { type: array, items: { $ref: '#/components/schemas/NextRun' } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSchedule
      tags: [automation]
      responses:
        '200': { description: The schedule., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateSchedule
      tags: [automation]
      description: >-
        A new revision, for future occurrences only (a running job, created occurrences and past jobs never change).
        Only the owner, or someone with schedules.admin, may edit; an editor who isn't the owner becomes the owner.
        Adopting a newer workflow revision is an edit. Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveSchedule
      tags: [automation]
      description: Archive (history and jobs are kept; a running job continues). Owner or schedules.admin. Audited.
      responses:
        '204': { description: Archived. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/enable:
    post:
      operationId: enableSchedule
      tags: [automation]
      description: Enable (owner or schedules.admin; the owner must be able to run it). Clears the attention flag; starts from the next occurrence after now. Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Enabled., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/disable:
    post:
      operationId: disableSchedule
      tags: [automation]
      description: Disable future occurrences. A job already running continues (cancel it on its page). Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Disabled., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/run-now:
    post:
      operationId: runScheduleNow
      tags: [automation]
      description: >-
        Run once now as the caller (with the caller's permissions; hosts in maintenance are not skipped — a deliberate
        action). Doesn't change the next run. 409 while the previous run is active. Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201':
          description: Started.
          content: { application/json: { schema: { type: object, required: [occurrence_id, status], properties: { occurrence_id: { type: string }, status: { type: string }, job_id: { type: string }, maintenance_id: { type: string } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/owner:
    post:
      operationId: reassignSchedule
      tags: [automation]
      description: Give a schedule a new owner (schedules.admin). The new owner must hold what running it needs. Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { type: string } } } } } }
      responses:
        '200': { description: Reassigned., content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/occurrences:
    get:
      operationId: scheduleOccurrences
      tags: [automation]
      description: The schedule's history, newest first (bounded; page with before/before_id).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer }, description: Scheduled time (unix ms) of the last item seen }
        - { name: before_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Occurrences., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Occurrence' } } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /jobs/simulate:
    post:
      operationId: simulateJob
      tags: [jobs]
      description: |
        Dry-run a package or system_update step on each target from the hosts' current package
        metadata. Nothing changes. Removals that would need `allow_removals` are listed in
        `extra_removals`. Requires `jobs.execute` (dnf simulation needs root).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets, step]
              properties:
                targets: { $ref: '#/components/schemas/TargetSpec' }
                step: { $ref: '#/components/schemas/Operation' }
      responses:
        '200':
          description: Per-host plans.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateResult' }
        '422': { $ref: '#/components/responses/Problem' }
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } }
        - { name: host, in: query, description: Host id, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Job' } }
                  next_cursor: { type: string }
    post:
      operationId: createJob
      tags: [jobs]
      description: 'Requires `jobs.execute`. Repeating a request with the same `Idempotency-Key` returns the original job (200).'
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSpec' }
      responses:
        '200':
          description: Existing job for this idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '201':
          description: Created and started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '422': { $ref: '#/components/responses/Problem' }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        '200':
          description: Job with per-state host counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Problem' }
  /jobs/{id}/hosts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listJobHosts
      tags: [jobs]
      responses:
        '200':
          description: Per-host state, in execution order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/JobHost' } }
  /jobs/{id}/hosts/{hostId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: hostId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJobHost
      tags: [jobs]
      responses:
        '200':
          description: Host state with steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobHostDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /jobs/{id}/hosts/{hostId}/output:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: hostId, in: path, required: true, schema: { type: string } }
      - { name: step, in: query, schema: { type: integer, default: 0 } }
      - { name: after, in: query, description: Return segments after this sequence number, schema: { type: integer, default: 0 } }
      - { name: stream, in: query, schema: { type: string, enum: [stdout, stderr] } }
      - { name: format, in: query, description: '`text` downloads raw output', schema: { type: string, enum: [json, text] } }
    get:
      operationId: getJobOutput
      tags: [jobs]
      responses:
        '200':
          description: Output segments (up to 500 per page).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOutput' }
            text/plain:
              schema: { type: string }
  /jobs/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: jobEvents
      tags: [jobs]
      description: |
        Server-sent events: `job` (status and counts), `host` (state changes), `output`
        (new output segments), `end` (job finished), and `reset` (events were missed; refetch
        state over REST). Send `Last-Event-ID` to resume after reconnecting.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelJob
      tags: [jobs]
      description: Running hosts' remote process groups are terminated; queued hosts are cancelled.
      responses:
        '202': { description: Cancellation requested. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /jobs/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeJob
      tags: [jobs]
      description: Continue a job paused by the circuit breaker.
      responses:
        '202': { description: Resumed. }
        '409': { $ref: '#/components/responses/Problem' }
  /jobs/{id}/rerun:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rerunJob
      tags: [jobs]
      description: Create a new job with the same steps for some of this job's hosts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hosts]
              properties:
                hosts:
                  oneOf:
                    - { type: string, enum: [failed, interrupted, all] }
                    - { type: array, items: { type: string } }
      responses:
        '201':
          description: New job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '422': { $ref: '#/components/responses/Problem' }

  /hosts/{id}/files:
    get:
      operationId: listFiles
      tags: [files]
      description: |
        List a directory on the host. With no `path`, the login user's home. The response's `path`
        is the real location (symlinked directories are resolved): changes always apply there.
        `elevated` lists as root and needs `files.elevate`.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: path, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Elevated' }
      responses:
        '200':
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileListing' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/stat:
    get:
      operationId: statFile
      tags: [files]
      description: One entry's metadata. Symlinks are not followed.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Elevated' }
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/content:
    get:
      operationId: downloadFile
      tags: [files]
      description: Stream a regular file (never a symlink). Elevated reads are audited.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Elevated' }
      responses:
        '200':
          description: The file's content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    put:
      operationId: uploadFile
      tags: [files]
      description: |
        Stream the request body to `path`. It goes to a private temporary file next to the
        destination and is installed (atomic rename) only once complete; an interrupted upload
        never leaves a truncated file. Without `overwrite=true` an existing file is not replaced.
        An existing file's owner, group and mode are kept. Requires `files.write`.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: overwrite, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Elevated' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWriteResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/text:
    get:
      operationId: readTextFile
      tags: [files]
      description: A UTF-8 text file of at most 1 MiB, with the SHA-256 to send back when saving.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Elevated' }
      responses:
        '200':
          description: Content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextFile' }
        '422': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveTextFile
      tags: [files]
      description: |
        Save text. `expect_sha256` is the version that was opened: if the file changed on the host
        since, the save is refused with 409 `file_changed` unless `force` is true. An empty
        `expect_sha256` creates a new file and refuses to replace an existing one.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              additionalProperties: false
              properties:
                path: { type: string }
                content: { type: string }
                elevated: { type: boolean }
                expect_sha256: { type: string }
                force: { type: boolean }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWriteResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/mkdir:
    post:
      operationId: fileMkdir
      tags: [files]
      description: Create a directory (`mode`, default 0755). Audited. Requires `files.write` (and `files.elevate` with `elevated`).
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileChangeRequest' }
      responses:
        '200':
          description: The entry afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/rename:
    post:
      operationId: fileRename
      tags: [files]
      description: Rename or move `path` to `to`. Never replaces an existing entry. Audited. Requires `files.write` (and `files.elevate` with `elevated`).
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileChangeRequest' }
      responses:
        '200':
          description: The entry afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/delete:
    post:
      operationId: fileDelete
      tags: [files]
      description: Delete a file, a symlink (never its target) or an empty directory; `recursive` deletes a directory tree (refused for top-level directories). Audited. Requires `files.write` (and `files.elevate` with `elevated`).
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileChangeRequest' }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/chmod:
    post:
      operationId: fileChmod
      tags: [files]
      description: Change permissions (`mode`, octal). Refused on symlinks; as root, refused in directories other users can modify. Audited. Requires `files.write` (and `files.elevate` with `elevated`).
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileChangeRequest' }
      responses:
        '200':
          description: The entry afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/files/chown:
    post:
      operationId: fileChown
      tags: [files]
      description: Change `owner` and/or `group` without following symlinks. Audited. Requires `files.write` (and `files.elevate` with `elevated`).
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileChangeRequest' }
      responses:
        '200':
          description: The entry afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/managed-files:
    get:
      operationId: listManagedFiles
      tags: [files]
      description: The latest deployment of every path DROOL has deployed to on this host.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
      responses:
        '200':
          description: Managed files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FileDeployment' } }
  /artifacts:
    post:
      operationId: uploadArtifact
      tags: [files]
      description: |
        Store a file on the controller for deployment (content-addressed; the same content is
        stored once, at most 1 GiB). Requires `files.deploy`.
      parameters:
        - { name: name, in: query, description: Original file name (informational), schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '413': { $ref: '#/components/responses/Problem' }
  /artifacts/{sha}:
    get:
      operationId: getArtifact
      tags: [files]
      parameters:
        - { name: sha, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '404': { $ref: '#/components/responses/Problem' }
  /artifacts/{sha}/content:
    get:
      operationId: downloadArtifact
      tags: [files]
      description: The stored content (e.g. a previous version kept for rollback). Requires `files.read`.
      parameters:
        - { name: sha, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /file-deployments/preview:
    post:
      operationId: previewFileDeployment
      tags: [files]
      description: |
        What a file deployment would do on each target, without changing anything: create,
        replace (with a text diff), identical, owner/group/mode change only, keep (create only)
        or an error such as "inaccessible". Audited (it reads files, as root when elevated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets, step]
              properties:
                targets: { $ref: '#/components/schemas/TargetSpec' }
                step: { $ref: '#/components/schemas/FileDeployOp' }
      responses:
        '200':
          description: Per-host preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDeployPreview' }
        '422': { $ref: '#/components/responses/Problem' }
  /file-deployments:
    get:
      operationId: listFileDeployments
      tags: [files]
      description: Deployment history (one row per host), newest first.
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: job, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FileDeployment' } }
  /file-deployments/{id}:
    get:
      operationId: getFileDeployment
      tags: [files]
      description: One host's deployment, with a text diff of before and after when both are kept and are text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDeployment' }
        '404': { $ref: '#/components/responses/Problem' }
  /file-deployments/{id}/rollback:
    post:
      operationId: rollbackFileDeployment
      tags: [files]
      description: |
        Start a job that restores what was there before this deployment: the previous content,
        owner, group and mode, or removes the file if it didn't exist. Applied only while the file
        still has the content this deployment installed. Audited. Requires `jobs.execute` and
        `files.deploy` (and `files.elevate` for an elevated deployment).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: The rollback job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Problem' }
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      description: Enrolled (non-revoked) agent identities.
      responses:
        '200':
          description: Identities.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentIdentity' } } } }
  /agents/pki:
    get:
      operationId: getAgentPKI
      tags: [agents]
      description: Agent PKI status. `root_key_online` true means the root private key is still on the controller (a persistent security warning).
      responses:
        '200':
          description: PKI status.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentPKI' } } }
  /agents/pki/root.crt:
    get:
      operationId: getAgentRootCert
      tags: [agents]
      description: The Agent Root CA certificate (PEM). Not the browser certificate.
      responses:
        '200': { description: PEM certificate., content: { application/x-pem-file: { schema: { type: string } } } }
  /agents/pki/export-root:
    post:
      operationId: exportAgentRoot
      tags: [agents]
      description: Returns the root private key for offline storage (session only, `agents.pki`, audited).
      responses:
        '200':
          description: Root certificate and key (PEM).
          content: { application/json: { schema: { type: object, required: [cert_pem, key_pem], properties: { cert_pem: { type: string }, key_pem: { type: string } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/pki/remove-root:
    post:
      operationId: removeAgentRoot
      tags: [agents]
      description: Removes the root private key from the controller (and from later backups). `confirm` must be the root fingerprint.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string } } } } }
      responses:
        '200': { description: PKI status., content: { application/json: { schema: { $ref: '#/components/schemas/AgentPKIStatus' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/pki/rotate:
    post:
      operationId: rotateAgentIntermediate
      tags: [agents]
      description: |
        New intermediate CA and trust manifest N+1. `revoke_old` after a compromise (agents switch over via certificate
        recovery, without re-enrolling). With the root offline, `root_key_pem` is used once and not stored.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { root_key_pem: { type: string }, revoke_old: { type: boolean } } } } }
      responses:
        '200': { description: PKI status., content: { application/json: { schema: { $ref: '#/components/schemas/AgentPKIStatus' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/pki/manifests:
    post:
      operationId: importTrustManifest
      tags: [agents]
      description: Import a trust manifest signed offline (`drool agent-ca sign-manifest`). It must verify against the root and be newer.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [payload, signature], properties: { payload: { type: string, format: byte }, signature: { type: string, format: byte } } } } }
      responses:
        '200': { description: PKI status., content: { application/json: { schema: { $ref: '#/components/schemas/AgentPKIStatus' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/unknown:
    get:
      operationId: listUnknownAgents
      tags: [agents]
      description: 'Shepherds that presented a certificate from this controller''s root with an identity it has no record of (enrolled after the backup it was restored from). They are refused; enroll them again. Requires `agents.read`.'
      responses:
        '200':
          description: Unknown Shepherds.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UnknownAgent' } } } } } }
  /agents/unknown/{id}/dismiss:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: dismissUnknownAgent
      tags: [agents]
      description: 'Hide an unknown Shepherd from the list (it is listed again if it still tries to connect a day later). Requires `agents.manage`.'
      responses:
        '204': { description: Dismissed. }
        '404': { $ref: '#/components/responses/Problem' }
  /agents/presets:
    get:
      operationId: listAgentPresets
      tags: [agents]
      description: Installer presets (DESIGN §6.7) with exactly what each allows and the agent.yaml it writes.
      responses:
        '200':
          description: Presets.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentPreset' } } } } } }
  /agents/tokens:
    get:
      operationId: listEnrollmentTokens
      tags: [agents]
      responses:
        '200':
          description: Tokens (never the secret).
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EnrollmentToken' } } } } } }
    post:
      operationId: createEnrollmentToken
      tags: [agents]
      description: Single-use, short-lived enrollment token. Bound to an existing host (`host_id`) or creating new hosts (optionally in `group_id`). The token is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                host_id: { type: string }
                group_id: { type: string }
                preset: { type: string, enum: [monitor, managed, full, ''] }
                ttl_minutes: { type: integer }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/CreatedEnrollmentToken' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/tokens/{id}/revoke:
    post:
      operationId: revokeEnrollmentToken
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Revoked. }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/{id}/revoke:
    post:
      operationId: revokeAgent
      tags: [agents]
      description: 'Revoke an agent identity immediately. Its sessions close; the host isn''t managed again until re-enrollment or an explicit switch to SSH. When the Shepherd is the host''s only management path (no SSH), refused (409 `last_management_path`) unless `leave_unmanaged` acknowledges it. Requires recent re-authentication.'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string }, leave_unmanaged: { type: boolean } } } } }
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/{id}/resolve-conflict:
    post:
      operationId: resolveAgentConflict
      tags: [agents]
      description: Release an identity-conflict quarantine. Refused while two machines are connected with the identity. Requires recent re-authentication.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Released. }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/updates/policy:
    get:
      operationId: getAgentUpdatePolicy
      tags: [agents]
      responses:
        '200': { description: Policy., content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpdatePolicy' } } } }
    put:
      operationId: setAgentUpdatePolicy
      tags: [agents]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpdatePolicy' } } }
      responses:
        '200': { description: Policy., content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpdatePolicy' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/release-keys:
    get:
      operationId: listReleaseKeys
      tags: [agents]
      description: Release-signing public keys known to the controller (display and early checks; agents trust their own local list).
      responses:
        '200': { description: Keys., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleaseKey' } } } } } } }
    post:
      operationId: addReleaseKey
      tags: [agents]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [public_key], properties: { public_key: { type: string } } } } }
      responses:
        '201': { description: Added., content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseKey' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/release-keys/{id}:
    delete:
      operationId: deleteReleaseKey
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
  /agents/releases:
    get:
      operationId: listAgentReleases
      tags: [agents]
      responses:
        '200': { description: Releases., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentRelease' } } } } } } }
    post:
      operationId: uploadAgentRelease
      tags: [agents]
      description: Body is the agent binary; the signed manifest (`.release.json` from `drool release sign`) goes base64-encoded in `X-DROOL-Release`. Verified here for early feedback and again by every agent.
      parameters: [{ name: X-DROOL-Release, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '201': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRelease' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/releases/{id}:
    delete:
      operationId: deleteAgentRelease
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
  /agents/rollouts:
    get:
      operationId: listAgentRollouts
      tags: [agents]
      responses:
        '200': { description: Rollouts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentRollout' } } } } } } }
    post:
      operationId: startAgentRollout
      tags: [agents]
      description: Update agents to an uploaded release with a canary, then bounded batches, pausing on failures (policy settings). Empty `host_ids` = every agent.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: string }, host_ids: { type: array, items: { type: string } } } } } }
      responses:
        '201': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRollout' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/rollouts/{id}:
    get:
      operationId: getAgentRollout
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Rollout with hosts., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRollout' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /agents/rollouts/{id}/pause:
    post:
      operationId: pauseAgentRollout
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Rollout., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRollout' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/rollouts/{id}/resume:
    post:
      operationId: resumeAgentRollout
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Rollout., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRollout' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/rollouts/{id}/cancel:
    post:
      operationId: cancelAgentRollout
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Rollout., content: { application/json: { schema: { $ref: '#/components/schemas/AgentRollout' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/endpoints:
    get:
      operationId: listEndpointMigrations
      tags: [agents]
      responses:
        '200': { description: Migrations., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EndpointMigration' } } } } } } }
    post:
      operationId: proposeEndpoint
      tags: [agents]
      description: Propose a new agent endpoint (host:port). Agents store and test it; nothing changes until commit, and only for agents that confirmed it.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } } } }
      responses:
        '201': { description: Proposed., content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/endpoints/{id}/commit:
    post:
      operationId: commitEndpoint
      tags: [agents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Committed., content: { application/json: { schema: { type: object, required: [committed_now], properties: { committed_now: { type: integer } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/agent:
    get:
      operationId: getHostAgent
      tags: [agents]
      description: The host's management model, agent identity, sessions, capabilities and state versions.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Agent view., content: { application/json: { schema: { $ref: '#/components/schemas/HostAgent' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/management:
    put:
      operationId: setHostManagement
      tags: [agents]
      description: Preferred management path and fallback (audited).
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [preferred, fallback], properties: { preferred: { type: string, enum: [ssh, agent] }, fallback: { type: string, enum: [none, ssh] } } } } }
      responses:
        '200': { description: Management., content: { application/json: { schema: { $ref: '#/components/schemas/Management' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/agent/caps:
    put:
      operationId: setAgentCaps
      tags: [agents]
      description: Narrow the agent's capability ceiling (never widen). `caps` null removes the narrowing.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [caps], properties: { caps: { oneOf: [{ $ref: '#/components/schemas/AgentCaps' }, { type: 'null' }] } } } } }
      responses:
        '204': { description: Stored and pushed to the agent. }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/agent/install:
    post:
      operationId: installAgent
      tags: [agents]
      description: Install and enroll the agent over the host's pinned SSH connection (synchronous, up to a few minutes).
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [preset], properties: { preset: { type: string, enum: [monitor, managed, full] }, release_key: { type: string } } } } }
      responses:
        '200': { description: Result., content: { application/json: { schema: { type: object, required: [ok, output], properties: { ok: { type: boolean }, output: { type: string }, error: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/state/{domain}/adopt:
    post:
      operationId: adoptHostState
      tags: [agents]
      description: For a domain where the host is ahead of the controller (e.g. after restoring an old backup), adopt the host's revision so new changes are newer. Full reconciliation comes with the Beta.
      parameters: [{ $ref: '#/components/parameters/HostId' }, { name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Adopted. }
        '409': { $ref: '#/components/responses/Problem' }
  /firewall/settings:
    get:
      operationId: getFirewallSettings
      tags: [firewall]
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/FwSettings' } } } }
    put:
      operationId: setFirewallSettings
      tags: [firewall]
      description: internal_ranges defines the semantic `internet` target (everything outside it). Requires firewall.write.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwSettings' } } } }
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/FwSettings' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/services:
    get:
      operationId: listFirewallServices
      tags: [firewall]
      responses:
        '200': { description: Built-in and custom services., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwService' } } } } } } }
    post:
      operationId: createFirewallService
      tags: [firewall]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwServiceInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/FwService' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/services/{id}:
    delete:
      operationId: deleteFirewallService
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted. }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/groups:
    get:
      operationId: listFirewallGroups
      tags: [firewall]
      responses:
        '200': { description: Groups and their rollback timeouts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwGroup' } } } } } } }
  /firewall/groups/{id}:
    put:
      operationId: setFirewallGroup
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rollback_timeout_s], properties: { rollback_timeout_s: { type: integer, description: '0 inherits the default' } } } } } }
      responses:
        '204': { description: Saved. }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/policies:
    get:
      operationId: listFirewallPolicies
      tags: [firewall]
      responses:
        '200': { description: Policies in evaluation order., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwPolicy' } } } } } } }
    post:
      operationId: createFirewallPolicy
      tags: [firewall]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwPolicyInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/FwPolicy' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/policies/preview:
    post:
      operationId: previewFirewallPolicy
      tags: [firewall]
      description: Which hosts a new, changed or deleted policy would change, and how (allowances added and removed, management-path conflicts). Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: The policy being changed or deleted. }
                delete: { type: boolean }
                policy: { $ref: '#/components/schemas/FwPolicyInput' }
      responses:
        '200': { description: Affected hosts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwPolicyImpact' } } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/policies/{id}:
    get:
      operationId: getFirewallPolicy
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Policy., content: { application/json: { schema: { $ref: '#/components/schemas/FwPolicy' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateFirewallPolicy
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwPolicyInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/FwPolicy' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteFirewallPolicy
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
  /firewall/hosts:
    get:
      operationId: listFirewallHosts
      tags: [firewall]
      responses:
        '200':
          description: Every host's firewall summary and the fleet's propagation state.
          content:
            application/json:
              schema:
                type: object
                required: [items, propagation]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FwHostSummary' } }
                  propagation: { $ref: '#/components/schemas/FwPropagation' }
  /firewall/hosts/{id}:
    get:
      operationId: getFirewallHost
      tags: [firewall]
      description: The host's plan, Explain Host, environment and what is committed. `override=true` previews the emergency override.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: override, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Plan., content: { application/json: { schema: { $ref: '#/components/schemas/FwPlan' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setFirewallHost
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwHostConfig' } } } }
      responses:
        '200': { description: Plan., content: { application/json: { schema: { $ref: '#/components/schemas/FwPlan' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/hosts/{id}/detect:
    post:
      operationId: detectFirewall
      tags: [firewall]
      description: Inspect the host's firewall environment (read-only on the host; works on unsupported hosts too).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Environment.
          content: { application/json: { schema: { type: object, required: [environment, eligibility], properties: { environment: { $ref: '#/components/schemas/FwEnv' }, eligibility: { $ref: '#/components/schemas/FwEligibility' } } } } }
        '502': { $ref: '#/components/responses/Problem' }
  /firewall/hosts/{id}/snapshot:
    post:
      operationId: firewallSnapshot
      tags: [firewall]
      description: Take a one-off connection snapshot (SSH hosts get only snapshots; agents learn continuously).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Flows recorded., content: { application/json: { schema: { type: object, required: [flows], properties: { flows: { type: integer } } } } } }
        '502': { $ref: '#/components/responses/Problem' }
  /firewall/hosts/{id}/observations:
    get:
      operationId: firewallObservations
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Aggregated flows., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwObservation' } } } } } } }
  /firewall/hosts/{id}/suggestions:
    get:
      operationId: firewallSuggestions
      tags: [firewall]
      description: Guided mode. Policies proposed from unclassified flows; an administrator approves them by creating the policy.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Suggestions., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwSuggestion' } } } } } } }
  /firewall/hosts/{id}/adopt:
    post:
      operationId: adoptFirewallState
      tags: [firewall]
      description: Reconciliation. Accept the host's committed firewall revision (host ahead of a restored controller).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Adopted. }
        '404': { $ref: '#/components/responses/Problem' }
  /firewall/apply:
    post:
      operationId: applyFirewall
      tags: [firewall]
      description: |
        Start a job with one dead-man firewall transaction per host (one host at a time, stopping at the first failure).
        Overrides need `firewall.override` and a reason; the emergency override still uses the dead-man rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_ids]
              properties:
                host_ids: { type: array, items: { type: string } }
                remove: { type: boolean, description: Take DROOL's policy off the hosts (still a transaction). }
                override_mgmt: { type: boolean, description: Emergency override of management-path protection. }
                override_timeout: { type: boolean, description: Accept a rollback timeout shorter than 3x the measured connection time. }
                allow_drift: { type: boolean, description: Replace DROOL rules changed outside DROOL. }
                expect_rules_hash: { type: string, description: Refuse if the policy changed since this preview. }
                reason: { type: string, description: Required with any override; audited. }
      responses:
        '201': { description: Job started., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/transactions:
    get:
      operationId: listFirewallTransactions
      tags: [firewall]
      parameters:
        - { name: host_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Transactions, newest first., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FwTransaction' } } } } } } }
  /firewall/transactions/{id}:
    get:
      operationId: getFirewallTransaction
      tags: [firewall]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Transaction with its timeline and candidate., content: { application/json: { schema: { $ref: '#/components/schemas/FwTransaction' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /firewall/simulate:
    post:
      operationId: simulateFirewall
      tags: [firewall]
      description: Can From reach To on Protocol/Port? Answers with the policy (or management path) that decides on each host.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwSimRequest' } } } }
      responses:
        '200': { description: Answer., content: { application/json: { schema: { $ref: '#/components/schemas/FwSimResult' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/document:
    get:
      operationId: getFirewallDocument
      tags: [firewall]
      description: The canonical firewall document (networks, groups, custom services, ordered policy) as JSON and canonical YAML. Topology, Rules and YAML in the Firewall Designer are views of it.
      responses:
        '200': { description: The stored document., content: { application/json: { schema: { $ref: '#/components/schemas/FwDocumentView' } } } }
    put:
      operationId: saveFirewallDocument
      tags: [firewall]
      description: >-
        Stores a draft (document or YAML) as the policy after the same validation as the check: networks, custom services and
        policies become exactly the document's; groups it lists get its members and descriptions (needs hosts.write), groups it
        omits are kept. Saving never applies anything to hosts. `revision` must be the stored revision the draft started from.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwDocumentSave' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/FwDocumentSaved' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/document/check:
    post:
      operationId: checkFirewallDocument
      tags: [firewall]
      description: 'Validates a draft and previews it with the real compiler: per-host changes, refused hosts, management paths and apply blockers. Nothing is stored.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwDocumentInput' } } } }
      responses:
        '200': { description: Check result (invalid drafts are a 200 with problems)., content: { application/json: { schema: { $ref: '#/components/schemas/FwDocumentCheck' } } } }
  /firewall/document/explain:
    post:
      operationId: explainFirewallDraft
      tags: [firewall]
      description: Explain Host under a draft (or the stored policy when no draft is given).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FwDraftExplainRequest' } } } }
      responses:
        '200': { description: Explanation., content: { application/json: { schema: { $ref: '#/components/schemas/FwDraftExplain' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/layout:
    get:
      operationId: getFirewallLayout
      tags: [firewall]
      description: "The designer's layout (node positions, expanded groups). Presentation only, never policy."
      responses:
        '200': { description: Layout., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    put:
      operationId: setFirewallLayout
      tags: [firewall]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '204': { description: Stored. }
        '422': { $ref: '#/components/responses/Problem' }
  /firewall/propagation:
    get:
      operationId: firewallPropagation
      tags: [firewall]
      responses:
        '200': { description: Set propagation across enforced hosts., content: { application/json: { schema: { $ref: '#/components/schemas/FwPropagation' } } } }
  /network/summary:
    get:
      operationId: networkSummary
      tags: [network]
      description: Fleet Network Activity header for the flows matching the filters (database filters only); how every host is observed.
      parameters: &netFilter
        - { name: host, in: query, description: Host ids (repeat for several)., schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: group, in: query, description: A group id; its members' flows., schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: scope, in: query, description: The remote address (external = public)., schema: { type: string, enum: [internal, external, public, special] } }
        - { name: protocol, in: query, schema: { type: string, enum: [tcp, udp] } }
        - { name: port, in: query, description: The service port, either direction., schema: { type: integer } }
        - { name: local_port, in: query, schema: { type: integer } }
        - { name: remote_port, in: query, schema: { type: integer } }
        - { name: process, in: query, description: Substring; "unknown" for flows without a process., schema: { type: string } }
        - { name: service, in: query, description: A named service., schema: { type: string } }
        - { name: country, in: query, description: ISO 3166-1 alpha-2., schema: { type: string } }
        - { name: asn, in: query, description: 15169 or AS15169., schema: { type: string } }
        - { name: org, in: query, description: Substring of the network organization., schema: { type: string } }
        - { name: peer, in: query, description: A remote address or CIDR., schema: { type: string } }
        - { name: policy, in: query, description: denied includes flows the desired policy would deny., schema: { type: string, enum: [management, covered, unclassified, denied] } }
        - { name: source, in: query, schema: { type: string, enum: [conntrack, sockets, snapshot] } }
        - { name: first_seen_after, in: query, description: Unix seconds, RFC 3339 or a duration back from now (24h, 7d)., schema: { type: string } }
        - { name: last_seen_after, in: query, schema: { type: string } }
        - { name: new, in: query, description: Public destinations first seen (within retention) by the host, or by the whole fleet, since `since`., schema: { type: string, enum: [host, fleet] } }
        - { name: since, in: query, description: For new; default 24h., schema: { type: string } }
        - { name: q, in: query, description: Free text (address, host, process, organization)., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [last_seen, first_seen, count] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/NetSummary' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /network/flows:
    get:
      operationId: listNetworkFlows
      tags: [network]
      description: >-
        Observed connections (aggregated flows), newest first, filtered and paginated on the server (keyset cursor; at most 500
        per page). Policy status comes from the firewall compiler. Country and network are local GeoIP/ASN enrichment of
        public addresses only. There is no unbounded "everything" endpoint.
      parameters: *netFilter
      responses:
        '200': { description: A page of flows., content: { application/json: { schema: { $ref: '#/components/schemas/NetFlowPage' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /network/flows/{id}:
    get:
      operationId: getNetworkFlow
      tags: [network]
      description: One flow with its firewall classification, collection fidelity, related flows and, when no policy covers it, a rule the Firewall Designer can add to a draft.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The flow., content: { application/json: { schema: { $ref: '#/components/schemas/NetFlowDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /network/filters:
    get:
      operationId: networkFilters
      tags: [network]
      description: Values the filters offer (hosts, groups, processes, ports, services, countries, networks), optionally for some hosts.
      parameters: [{ name: host, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }]
      responses:
        '200': { description: Facets., content: { application/json: { schema: { $ref: '#/components/schemas/NetFacets' } } } }
  /network/topology:
    get:
      operationId: networkTopology
      tags: [network]
      description: >-
        Observed connections as a graph for the Firewall Designer's Observed and Configured + Observed modes. Node keys are the
        designer's references; external addresses are grouped by network owner (asn:N), expandable to addresses.
      parameters:
        - { name: expand, in: query, description: 'Grouped nodes to show as addresses (asn:15169, internal, internet).', schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: max_external, in: query, description: External network nodes kept (default 25); 0 groups them all into one., schema: { type: integer, minimum: 0, maximum: 200 } }
        - { name: host, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: group, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: scope, in: query, schema: { type: string, enum: [internal, external, public, special] } }
        - { name: policy, in: query, schema: { type: string, enum: [management, covered, unclassified, denied] } }
        - { name: last_seen_after, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: asn, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: The observed graph., content: { application/json: { schema: { $ref: '#/components/schemas/NetTopology' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /network/settings:
    get:
      operationId: networkSettings
      tags: [network]
      responses:
        '200': { description: Settings and enrichment status., content: { application/json: { schema: { $ref: '#/components/schemas/NetSettingsView' } } } }
    put:
      operationId: setNetworkSettings
      tags: [network]
      description: Audited (network.settings.update). Requires network.settings.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NetSettings' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/NetSettingsView' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /network/enrichment:
    get:
      operationId: networkEnrichment
      tags: [network]
      description: The local GeoIP/ASN databases DROOL found, and the lookup cache.
      responses:
        '200': { description: Status., content: { application/json: { schema: { $ref: '#/components/schemas/NetEnrichment' } } } }
  /network/enrichment/reload:
    post:
      operationId: reloadNetworkEnrichment
      tags: [network]
      description: Reload the databases now (they are also reloaded automatically when the files change). Audited (network.enrichment.reload).
      responses:
        '200': { description: Status after reloading., content: { application/json: { schema: { $ref: '#/components/schemas/NetEnrichment' } } } }
  /hosts/{id}/network:
    get:
      operationId: hostNetwork
      tags: [network]
      description: "A host's Network summary: how it is observed, listening ports (from inventory) with observed inbound use, counts."
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/NetHost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/network/snapshot:
    post:
      operationId: hostNetworkSnapshot
      tags: [network]
      description: Take a one-off connection snapshot (ss) — the only observation SSH hosts get. Requires network.snapshot.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Flows recorded., content: { application/json: { schema: { type: object, required: [flows], properties: { flows: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /monitoring/summary:
    get:
      operationId: monitoringSummary
      tags: [monitoring]
      description: >-
        Fleet health: what needs attention across every host (unhealthy, stale, CPU/memory pressure, low disk, storage,
        services, interfaces, temperatures, reduced fidelity, missing helpers), with rows filtered, sorted and paged on the
        server.
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [all, unhealthy, stale, cpu, memory, disk, storage, services, network, temperature, fidelity, helpers, no_data] } }
        - { name: q, in: query, description: Host name substring., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [attention, name, cpu, memory, disk, temperature] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Fleet health., content: { application/json: { schema: { $ref: '#/components/schemas/MonFleet' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/issues:
    get:
      operationId: monitoringIssues
      tags: [monitoring]
      description: Health issues found by the evaluation (M12 alerting consumes their transitions), most severe and newest first; at most 500.
      parameters:
        - { name: host_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [active, resolved, all] } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, critical] } }
        - { name: check, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: before, in: query, description: Started before (ms), for paging., schema: { type: integer } }
      responses:
        '200':
          description: Issues.
          content: { application/json: { schema: { type: object, required: [issues], properties: { issues: { type: array, items: { $ref: '#/components/schemas/MonIssue' } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/settings:
    get:
      operationId: monitoringSettings
      tags: [monitoring]
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/MonSettingsView' } } } }
    put:
      operationId: setMonitoringSettings
      tags: [monitoring]
      description: Fleet monitoring settings (audited); re-sent to every connected agent. Requires `monitoring.settings`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonSettings' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/MonSettingsView' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/health/checks:
    get:
      operationId: healthChecks
      tags: [monitoring]
      description: The health checks and the fields each honestly supports (a SMART failure has no numeric threshold).
      responses:
        '200': { description: Checks., content: { application/json: { schema: { type: object, required: [checks], properties: { checks: { type: array, items: { $ref: '#/components/schemas/HealthCheckSpec' } } } } } } }
  /monitoring/health/global:
    get:
      operationId: healthGlobal
      tags: [monitoring]
      description: >-
        The fleet-wide health configuration: the Recommended profile plus global overrides, each field with its value, its
        source and what it would be without the global override. Health overrides decide what monitoring considers
        unhealthy; who is notified is the separate notification routing.
      responses:
        '200': { description: Configuration., content: { application/json: { schema: { $ref: '#/components/schemas/HealthView' } } } }
  /monitoring/health/groups:
    get:
      operationId: healthGroups
      tags: [monitoring]
      description: Every group with its monitoring override priority and how many fields it overrides.
      responses:
        '200': { description: Groups., content: { application/json: { schema: { type: object, required: [groups], properties: { groups: { type: array, items: { $ref: '#/components/schemas/HealthGroup' } } } } } } }
  /monitoring/health/groups/{id}:
    get:
      operationId: healthGroup
      tags: [monitoring]
      description: One group's view; `inherited` is what the group gets from global and Recommended.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Configuration., content: { application/json: { schema: { $ref: '#/components/schemas/HealthView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /monitoring/health/groups/{id}/priority:
    put:
      operationId: setHealthGroupPriority
      tags: [monitoring]
      description: >-
        A group's monitoring override priority (-1000–1000, default 0). When a host is in several groups that set the same
        field, the higher priority wins; equal priorities with different values are a conflict (shown, never resolved
        silently). Requires `monitoring.settings`; audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [priority], properties: { priority: { type: integer, minimum: -1000, maximum: 1000 } } } } } }
      responses:
        '200': { description: The group's view., content: { application/json: { schema: { $ref: '#/components/schemas/HealthView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/health/overrides:
    get:
      operationId: listHealthOverrides
      tags: [monitoring]
      description: Stored overrides, most general first (at most 1000).
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, group, host] } }
        - { name: group_id, in: query, schema: { type: string } }
        - { name: host_id, in: query, schema: { type: string } }
        - { name: check, in: query, schema: { type: string } }
      responses:
        '200': { description: Overrides., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/HealthOverride' } } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putHealthOverride
      tags: [monitoring]
      description: >-
        Sets one scope's complete sparse field set for a check (and, at host scope, optionally one subject). Fields left
        out are inherited; an empty `fields` removes the override ("Reset to inherited"). Takes effect at once: an
        active issue still failing under the new rule stays open (its severity follows the rule); one whose check is now
        off, or whose current value no longer qualifies, closes as `disabled` or `reconfigured` (never a recovery);
        pending durations restart from the change. Global and group scope require `monitoring.settings`; host and subject
        scope require `monitoring.manage`, or `monitoring.settings` when the change makes detection less sensitive
        (a check off, a higher threshold, a longer duration, a sooner clear). Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HealthOverrideInput' } } } }
      responses:
        '200':
          description: Saved (or removed).
          content: { application/json: { schema: { type: object, required: [removed], properties: { override: { $ref: '#/components/schemas/HealthOverride' }, removed: { type: boolean } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/health/overrides/{id}:
    delete:
      operationId: deleteHealthOverride
      tags: [monitoring]
      description: Reset to inherited (the same permissions as changing it). Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /monitoring/health/preview:
    post:
      operationId: previewHealthOverride
      tags: [monitoring]
      description: >-
        What a change would do, without making it: hosts whose rule changes, how many are above the previous and the new
        warning level now, and which active issues would close. With `priority`, previews a group priority change.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HealthPreviewInput' } } } }
      responses:
        '200': { description: Impact., content: { application/json: { schema: { $ref: '#/components/schemas/HealthPreview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/health:
    get:
      operationId: hostHealth
      tags: [monitoring]
      description: >-
        A host's effective health configuration with provenance (Recommended, hardware limit, global, group, host or
        subject), group conflicts, and the subjects that can be customized (including configured ones the host doesn't
        report now). With `subject`, that subject's checks; with `check`, one check.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: check, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
      responses:
        '200': { description: Configuration., content: { application/json: { schema: { $ref: '#/components/schemas/HealthView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/approvals:
    get:
      operationId: listHelperApprovals
      tags: [monitoring]
      responses:
        '200':
          description: Standing approvals and the helper allowlist.
          content:
            application/json:
              schema:
                type: object
                required: [approvals, allowlist]
                properties:
                  approvals: { type: array, items: { $ref: '#/components/schemas/MonApproval' } }
                  allowlist: { type: array, items: { type: string } }
    post:
      operationId: addHelperApproval
      tags: [monitoring]
      description: >-
        A standing approval: install an allowlisted monitoring helper wherever it would add capability, for one group or
        every host, through package jobs owned by the approver. Audited. Requires `monitoring.settings`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonApprovalInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/approvals/{id}:
    delete:
      operationId: deleteHelperApproval
      tags: [monitoring]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed (installed helpers stay installed). }
        '404': { $ref: '#/components/responses/Problem' }
  /monitoring/helpers/preview:
    post:
      operationId: previewHelpers
      tags: [monitoring]
      description: Which monitoring helpers each selected host needs, with the package manager's names. Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonHelpersRequest' } } } }
      responses:
        '200': { description: Preview., content: { application/json: { schema: { $ref: '#/components/schemas/MonHelperPreview' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /monitoring/helpers/install:
    post:
      operationId: installHelpers
      tags: [monitoring]
      description: >-
        Install the helpers the selected hosts need through ordinary package jobs (one per distinct package list), with
        the usual locking, capability checks and audit. Requires `jobs.execute`. GPU drivers are never installed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonHelpersRequest' } } } }
      responses:
        '202': { description: Jobs started., content: { application/json: { schema: { $ref: '#/components/schemas/MonInstallResult' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring:
    get:
      operationId: hostMonitoring
      tags: [monitoring]
      description: The host's monitoring overview (headline tiles, current state, issues, probes, helpers, agent budget). Unknown values are absent, never zero.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Overview., content: { application/json: { schema: { $ref: '#/components/schemas/MonHostOverview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/history:
    get:
      operationId: hostMonitoringHistory
      tags: [monitoring]
      description: >-
        Metric history for one range (1h and 6h from raw points, 24h five-minute, 7d and 30d hourly, average and maximum per
        window). `series` selects exact keys or prefixes ending in ':' (fs:, net.rx:, temp:); at most 32 series and 2000
        points each. Missing windows are gaps, not zeros.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: range, in: query, schema: { type: string, enum: ['1h', '6h', '24h', '7d', '30d'] } }
        - { name: series, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        '200': { description: History., content: { application/json: { schema: { $ref: '#/components/schemas/MonHistory' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/services:
    get:
      operationId: hostServices
      tags: [monitoring]
      description: Service inventory (systemd). The default view hides transient, static and other noise units unless failed; `all=true` shows everything.
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: filter, in: query, schema: { type: string, enum: [all, running, stopped, failed, enabled, disabled] } }
        - { name: all, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Services., content: { application/json: { schema: { $ref: '#/components/schemas/MonServicesView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/services/{unit}/history:
    get:
      operationId: hostServiceHistory
      tags: [monitoring]
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: unit, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Transitions, newest first., content: { application/json: { schema: { $ref: '#/components/schemas/MonServiceEvents' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/service-events:
    get:
      operationId: hostServiceEvents
      tags: [monitoring]
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Every unit's transitions, newest first., content: { application/json: { schema: { $ref: '#/components/schemas/MonServiceEvents' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/storage:
    get:
      operationId: hostStorage
      tags: [monitoring]
      description: Physical devices (with partitions, filesystems and stable ids), capability-aware health, probe results and recent kernel storage evidence.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Storage., content: { application/json: { schema: { $ref: '#/components/schemas/MonStorageView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/hardware:
    get:
      operationId: hostHardware
      tags: [monitoring]
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200':
          description: Temperature sensors and GPUs.
          content:
            application/json:
              schema:
                type: object
                required: [sensors, gpus, gpu_note]
                properties:
                  sensors: { type: array, items: { $ref: '#/components/schemas/MonSensor' } }
                  gpus: { type: array, items: { $ref: '#/components/schemas/MonGPU' } }
                  gpu_note: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/events:
    get:
      operationId: hostMonitoringEvents
      tags: [monitoring]
      parameters:
        - { $ref: '#/components/parameters/HostId' }
        - { name: kind, in: query, schema: { type: string, enum: [kernel, probe, fidelity, gap, reboot] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: before, in: query, description: Event id cursor., schema: { type: integer } }
      responses:
        '200':
          description: Events, newest first.
          content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: '#/components/schemas/MonEvent' } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/helpers:
    get:
      operationId: hostHelpers
      tags: [monitoring]
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: What this host would get., content: { application/json: { schema: { $ref: '#/components/schemas/MonHelperPreview' } } } }
  /hosts/{id}/monitoring/settings:
    put:
      operationId: setHostMonitoringSettings
      tags: [monitoring]
      description: >-
        Watched services and the flash probe (`monitoring.manage`); the agent's resource budget needs
        `monitoring.settings`. Audited; re-sent to the agent. A probe more often than hourly returns a wear warning.
        Turning a check off is a health override (`PUT /monitoring/health/overrides`); a non-empty `disabled_checks`
        (M11) is refused.
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonHostSettings' } } } }
      responses:
        '200':
          description: Saved.
          content: { application/json: { schema: { type: object, required: [settings], properties: { settings: { $ref: '#/components/schemas/MonHostSettings' }, warning: { type: string } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/monitoring/refresh:
    post:
      operationId: refreshHostMonitoring
      tags: [monitoring]
      description: Collect now (an agent immediately; an SSH host on its next poll).
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '202': { description: Requested., content: { application/json: { schema: { type: object, required: [agent], properties: { agent: { type: boolean } } } } } }
  /hosts/{id}/monitoring/diagnostics:
    get:
      operationId: hostDiagnostics
      tags: [monitoring]
      description: The agent's in-memory diagnostic ring as last delivered (routine diagnostics are never written to the host's disk).
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '200': { description: Entries., content: { application/json: { schema: { type: object, required: [entries], properties: { entries: { type: array, items: { $ref: '#/components/schemas/MonDiagEntry' } } } } } } }
    post:
      operationId: requestHostDiagnostics
      tags: [monitoring]
      parameters: [{ $ref: '#/components/parameters/HostId' }]
      responses:
        '202': { description: Requested from the agent. }
        '409': { $ref: '#/components/responses/Problem' }
  /agents/conversions/preview:
    post:
      operationId: previewAgentConversion
      tags: [agents]
      description: Classify SSH hosts for conversion to agent management (compatible, already agent-managed, unsupported, unreachable). Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversionRequest' } } } }
      responses:
        '200': { description: Preview., content: { application/json: { schema: { $ref: '#/components/schemas/ConversionPreview' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /agents/conversions:
    post:
      operationId: startAgentConversion
      tags: [agents]
      description: >-
        Install the agent on the compatible hosts as a rollout: a canary first, then bounded batches, pausing at the
        failure limit. Each host uses the single-host install over its pinned SSH connection; a failure leaves that host
        on SSH. Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversionRequest' } } } }
      responses:
        '201':
          description: Started.
          content: { application/json: { schema: { type: object, required: [rollout_id, preview], properties: { rollout_id: { type: string }, preview: { $ref: '#/components/schemas/ConversionPreview' } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      description: >-
        Alert occurrences. An alert opens when an M11 health issue becomes active with Warning or Critical severity and
        resolves only when that issue recovers. Open views (active, acknowledged, open) sort critical first, then newest;
        history views (resolved, all) newest first. Paged with `next_cursor`; at most 200 per page.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [active, acknowledged, open, resolved, all] }, description: 'active: open and unacknowledged (default); open: active or acknowledged.' }
        - { name: severity, in: query, schema: { type: string, enum: [warning, critical] } }
        - { name: host_id, in: query, schema: { type: string } }
        - { name: group_id, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [cpu, memory, disk, storage, services, network, temperature, gpu, stale, fidelity] } }
        - { name: check, in: query, schema: { type: string } }
        - { name: acknowledged, in: query, schema: { type: boolean } }
        - { name: suppressed, in: query, schema: { type: boolean }, description: 'Open views: suppressed by maintenance now. History: was suppressed.' }
        - { name: since, in: query, schema: { type: integer }, description: Opened at or after (unix ms). }
        - { name: until, in: query, schema: { type: integer }, description: Opened before (unix ms). }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of alerts.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Alert' } }, next_cursor: { type: string } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /alerts/summary:
    get:
      operationId: alertSummary
      tags: [alerts]
      description: Open alert counts for the fleet and per host, and hosts in maintenance. `destinations` only with `notifications.read`.
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/AlertSummary' } } } }
  /alerts/{id}:
    get:
      operationId: getAlert
      tags: [alerts]
      description: An alert with its timeline, source health issue, deliveries and other occurrences of the same condition. Delivery error details need `notifications.read`.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Alert., content: { application/json: { schema: { $ref: '#/components/schemas/AlertDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      description: >-
        Acknowledge an active alert (audited). It stays open until its condition recovers, stops reminders and changes
        nothing about the health issue. Requires `alerts.acknowledge`.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: Acknowledged., content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /events:
    get:
      operationId: listEvents
      tags: [alerts]
      description: The controller's event timeline (alerts opened, critical, acknowledged, recovered; maintenance started and ended; notification destinations failing and recovering), newest first, at most 200.
      parameters:
        - { name: host_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, description: 'Kind prefix, e.g. alert. or maintenance.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: before, in: query, schema: { type: integer }, description: Event id cursor. }
      responses:
        '200': { description: Events., content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } } } } } } }
  /maintenance:
    get:
      operationId: listMaintenance
      tags: [alerts]
      description: Maintenance, newest first, at most 200.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, ended, all] } }
        - { name: host_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: before, in: query, schema: { type: integer }, description: Started before (unix ms). }
      responses:
        '200': { description: Maintenance., content: { application/json: { schema: { type: object, required: [maintenance], properties: { maintenance: { type: array, items: { $ref: '#/components/schemas/Maintenance' } } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: startMaintenance
      tags: [alerts]
      description: >-
        Start maintenance now for hosts and/or groups, with exactly one of a duration, an end time or "until ended
        manually". It suppresses notifications only: monitoring, health evaluation, firewall rollback, agent recovery and
        host-key checks continue. Audited. Requires `maintenance.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceInput' } } } }
      responses:
        '201': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Maintenance' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /maintenance/{id}:
    get:
      operationId: getMaintenance
      tags: [alerts]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Maintenance., content: { application/json: { schema: { $ref: '#/components/schemas/Maintenance' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /maintenance/{id}/end:
    post:
      operationId: endMaintenance
      tags: [alerts]
      description: End maintenance now (audited). Alerts still active get one opening notification after a short grace period.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Ended., content: { application/json: { schema: { $ref: '#/components/schemas/Maintenance' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/destinations:
    get:
      operationId: listDestinations
      tags: [notifications]
      description: Notification destinations with their delivery health. Secrets are never returned, only whether each is set.
      responses:
        '200': { description: Destinations., content: { application/json: { schema: { type: object, required: [destinations], properties: { destinations: { type: array, items: { $ref: '#/components/schemas/Destination' } } } } } } }
    post:
      operationId: createDestination
      tags: [notifications]
      description: >-
        Add a destination (audited without secret values). With `notify_for: recommended` (the default) it joins the
        default route: Warning and Critical alerts plus recoveries. Requires `notifications.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DestinationInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Destination' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/destinations/{id}:
    get:
      operationId: getDestination
      tags: [notifications]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Destination., content: { application/json: { schema: { $ref: '#/components/schemas/Destination' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateDestination
      tags: [notifications]
      description: Change a destination. Omitted secrets keep their stored value. Audited.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DestinationInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Destination' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteDestination
      tags: [notifications]
      description: Delete a destination; its unsent notifications are cancelled. Alerts are unaffected. Audited.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
  /notifications/destinations/{id}/test:
    post:
      operationId: testDestination
      tags: [notifications]
      description: Send a test notification (no alert is created). Audited; at most 10 a minute per user. Requires `notifications.test`.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: The result (also for failures)., content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /notifications/test:
    post:
      operationId: testUnsavedDestination
      tags: [notifications]
      description: Send a test notification to a destination that isn't saved yet. Audited. Requires `notifications.manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind, config], properties: { kind: { type: string, enum: [email, webhook, discord, slack] }, config: { $ref: '#/components/schemas/DestinationConfig' }, secrets: { $ref: '#/components/schemas/DestinationSecrets' } } } } }
      responses:
        '200': { description: The result., content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /notifications/routes:
    get:
      operationId: listRoutes
      tags: [notifications]
      responses:
        '200':
          description: Routes (default first), with the category and check names filters accept.
          content: { application/json: { schema: { type: object, required: [routes, categories, checks], properties: { routes: { type: array, items: { $ref: '#/components/schemas/Route' } }, categories: { type: array, items: { type: string } }, checks: { type: array, items: { type: string } } } } } }
    post:
      operationId: createRoute
      tags: [notifications]
      description: >-
        Add a route. Empty filters match everything; filters combine with AND and values within one with OR. Every matching
        route contributes its destinations, and each destination is notified once per alert event. Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/routes/preview:
    post:
      operationId: previewRoute
      tags: [notifications]
      description: Which destinations an alert for this host, check and severity would go to.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [host_id, check, severity], properties: { host_id: { type: string }, check: { type: string }, severity: { type: string, enum: [warning, critical] } } } } } }
      responses:
        '200': { description: Destinations., content: { application/json: { schema: { $ref: '#/components/schemas/RoutePreview' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/routes/{id}:
    patch:
      operationId: updateRoute
      tags: [notifications]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteRoute
      tags: [notifications]
      description: Delete a route (not the default one, which can be disabled instead).
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /notifications/deliveries:
    get:
      operationId: listDeliveries
      tags: [notifications]
      description: Delivery history with attempts, newest first, at most 200 per page.
      parameters:
        - { name: destination_id, in: query, schema: { type: string } }
        - { name: alert_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, delivered, failed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Deliveries.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Delivery' } }, next_cursor: { type: string } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/settings:
    get:
      operationId: notificationSettings
      tags: [notifications]
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingsView' } } } }
    put:
      operationId: setNotificationSettings
      tags: [notifications]
      description: Link address, time zone and retention (audited). Requires `notifications.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingsView' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  # --- desired state (M14) ---
  /desired/summary:
    get:
      operationId: getDesiredSummary
      tags: [desired]
      description: The fleet's desired state at a glance, with the firewall's and agents' own drift for linking (not merged). Requires `desired.read`.
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredSummary' } } } }
  /desired/hosts:
    get:
      operationId: listDesiredHosts
      tags: [desired]
      description: Managed hosts with their overall status (problems first), at most 1000.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [attention, compliant, drift, conflict, unknown, reconciling, failed] } }
        - { name: q, in: query, schema: { type: string }, description: Host name contains }
        - { name: baseline, in: query, schema: { type: string } }
      responses:
        '200': { description: Hosts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DesiredHostRow' } } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    get:
      operationId: getDesiredHost
      tags: [desired]
      description: A host's effective desired state, where each value comes from (provenance, computed by the controller), and what differs.
      responses:
        '200': { description: The host., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredHost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}/resource:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    get:
      operationId: getDesiredResource
      tags: [desired]
      description: One managed resource on a host with its recent history (50 entries).
      parameters: [{ name: key, in: query, required: true, schema: { type: string }, description: 'service:<unit>, package:<name> or file:<path>' }]
      responses:
        '200':
          description: The resource.
          content: { application/json: { schema: { type: object, required: [resource, history], properties: { resource: { $ref: '#/components/schemas/DesiredResourceView' }, history: { type: array, items: { $ref: '#/components/schemas/DesiredHistoryEntry' } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}/review:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    get:
      operationId: reviewDesiredDifference
      tags: [desired]
      description: |
        Review difference (read-only; nothing on the host changes). Services and packages compare what DROOL observed; a managed file
        is inspected on the host (hashes and metadata) and, when the caller holds `files.read` (and `files.elevate` for files read
        as root), a unified diff of small text files is included (audited as `desired.review`). Binary and large files get hashes only.
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: The difference., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredReview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}/refresh:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    post:
      operationId: refreshDesiredHost
      tags: [desired]
      description: Check the host now (packages, files, fresh service data). Requires `desired.restore`. Audited.
      responses:
        '202': { description: Checking., content: { application/json: { schema: { type: object, required: [hosts], properties: { hosts: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}/accept:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    post:
      operationId: acceptDesiredCurrent
      tags: [desired]
      description: |
        Accept current state: the host is checked again, and what it has now becomes its own desired state (a host-specific
        declaration, the most specific scope). No baseline changes. A file's current content is copied into the artifact store
        (up to 64 MiB); a missing file means "not managed on this host"; symlinks can't be accepted. Unknown state can't be accepted.
        History records "resolved by configuration", never a restore. Requires `desired.manage`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [keys], properties: { keys: { type: array, items: { type: string }, maxItems: 200 }, note: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Accepted., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredAcceptResult' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/hosts/{id}/overrides:
    parameters: [{ $ref: '#/components/parameters/HostId' }]
    put:
      operationId: setDesiredOverride
      tags: [desired]
      description: Set a host-specific declaration (e.g. to settle a conflict for one host), or exclude a resource on this host (`key` with `excluded`). Requires `desired.manage`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource: { $ref: '#/components/schemas/DesiredResource' }
                key: { type: string }
                excluded: { type: boolean }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: The host., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredHost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: resetDesiredOverride
      tags: [desired]
      description: Remove a host-specific declaration ("reset to inherited"). Requires `desired.manage`. Audited.
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: The host., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredHost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/refresh:
    post:
      operationId: refreshDesired
      tags: [desired]
      description: Check hosts now (all managed hosts when none are named; at most 1000), spread over a few seconds. Requires `desired.restore`. Audited.
      requestBody: { content: { application/json: { schema: { type: object, properties: { host_ids: { type: array, items: { type: string } } } } } } }
      responses:
        '202': { description: Checking., content: { application/json: { schema: { type: object, required: [hosts], properties: { hosts: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/restore/preview:
    post:
      operationId: previewDesiredRestore
      tags: [desired]
      description: |
        Restore managed state, step 1: the selected hosts are checked again (when their observations are older than a minute) and
        the exact correction is planned — one ordinary job with a step per resource that differs somewhere, each host running only
        its own steps (installs, files, services, removals in that order), the rollout's waves, what is excluded and why (conflicts,
        unknown state, corrections in progress, symlinks, masked units, agent capability ceilings, hosts whose agent belongs to
        another controller epoch or whose file state is ahead), hosts in maintenance, and what removing a prohibited package would
        also remove. Nothing changes. Requires `desired.restore`; `missing_permissions` lists what else the caller would need.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DesiredRestoreRequest' } } } }
      responses:
        '200':
          description: The plan.
          content: { application/json: { schema: { type: object, required: [plan, missing_permissions], properties: { plan: { $ref: '#/components/schemas/DesiredPlan' }, missing_permissions: { type: array, items: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/restore:
    post:
      operationId: restoreDesired
      tags: [desired]
      description: |
        Restore managed state, step 2: submits exactly the previewed plan (`plan_hash`) as ordinary job(s); refused with
        `plan_changed` when what would be corrected changed since, and `nothing_to_restore` when nothing differs (no job is
        created). Resources in a correction can't get a second corrective job until it finishes. After the job each host is
        checked again and only proven compliance is recorded as restored. Requires `desired.restore`, `jobs.execute`, and for
        files `files.deploy` (+ `files.elevate`). Audited (`desired.restore`, `job.create`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DesiredRestoreRequest' } } } }
      responses:
        '201': { description: Submitted., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredRestoreResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/history:
    get:
      operationId: listDesiredHistory
      tags: [desired]
      description: Meaningful transitions, newest first (drift detected or changed, compliant again and why, conflicts, unknown, restores requested, restored and failed, current state accepted). Unchanged conditions are never recorded.
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: key, in: query, schema: { type: string } }
        - { name: baseline, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer }, description: An entry id (paging) }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: History., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DesiredHistoryEntry' } }, next_cursor: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/baselines:
    get:
      operationId: listBaselines
      tags: [desired]
      parameters: [{ name: archived, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: Baselines (at most 500)., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Baseline' } } } } } } }
    post:
      operationId: createBaseline
      tags: [desired]
      description: A named collection of typed desired resources and where it applies (revision 1). Requires `desired.manage`. Audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BaselineInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Baseline' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/baselines/preview:
    post:
      operationId: previewBaseline
      tags: [desired]
      description: What saving a baseline (new, or `id`) would do, judged against the latest observations. Nothing is saved. Requires `desired.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BaselineInput'
                - { type: object, properties: { id: { type: string } } }
      responses:
        '200': { description: Impact., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredImpact' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/baselines/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getBaseline
      tags: [desired]
      responses:
        '200': { description: The baseline with its revisions and compliance., content: { application/json: { schema: { $ref: '#/components/schemas/Baseline' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateBaseline
      tags: [desired]
      description: Save a changed baseline as a new immutable revision (nothing changes when nothing differs). Requires `desired.manage`. Audited with the resources added, removed and changed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BaselineInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Baseline' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveBaseline
      tags: [desired]
      description: Stop applying the baseline (revisions and history are kept). Requires `desired.manage`. Audited.
      responses:
        '204': { description: Archived. }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/baselines/{id}/revisions/{rev}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: rev, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getBaselineRevision
      tags: [desired]
      responses:
        '200':
          description: The revision exactly as saved.
          content: { application/json: { schema: { type: object, required: [revision, baseline], properties: { revision: { $ref: '#/components/schemas/BaselineRevisionInfo' }, baseline: { $ref: '#/components/schemas/BaselineInput' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /desired/baselines/{id}/auto:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: setBaselineAuto
      tags: [desired]
      description: |
        Automatic restore (off by default). Turning it on makes the caller the accountable owner — their account and permissions
        are checked before every automatic job — and clears a pause. Requires `desired.auto` (and `desired.restore`, `jobs.execute`
        to own it). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, strategy: { $ref: '#/components/schemas/Strategy' } } }
      responses:
        '200': { description: The baseline., content: { application/json: { schema: { $ref: '#/components/schemas/Baseline' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/groups:
    get:
      operationId: listDesiredGroups
      tags: [desired]
      description: Every group with its desired-state priority and the baselines assigned to it.
      responses:
        '200': { description: Groups., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DesiredGroupPriority' } } } } } } }
  /desired/groups/{id}/priority:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: setDesiredGroupPriority
      tags: [desired]
      description: A group's precedence (-1000 to 1000) when a host is in several groups whose baselines declare the same resource. Requires `desired.manage`. Audited.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [priority], properties: { priority: { type: integer, minimum: -1000, maximum: 1000 } } } } } }
      responses:
        '200': { description: Groups., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DesiredGroupPriority' } } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /desired/groups/{id}/priority/preview:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: previewDesiredGroupPriority
      tags: [desired]
      description: What changing a group's priority would do (conflicts resolved or created, hosts drifting). Nothing is saved.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [priority], properties: { priority: { type: integer } } } } } }
      responses:
        '200': { description: Impact., content: { application/json: { schema: { $ref: '#/components/schemas/DesiredImpact' } } } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: drool_session }
    bearer: { type: http, scheme: bearer }

  parameters:
    HostId: { name: id, in: path, required: true, schema: { type: string } }
    Elevated:
      name: elevated
      in: query
      description: Use administrator privileges (root via the host's sudo setting). Requires `files.elevate`.
      schema: { type: boolean }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Management:
      type: object
      description: How DROOL manages the host (DESIGN §8).
      required: [preferred, fallback, ssh_configured, active, agent_state, blocked]
      properties:
        preferred: { type: string, enum: [ssh, agent] }
        fallback: { type: string, enum: [none, ssh] }
        ssh_configured: { type: boolean }
        active: { type: string, enum: [agent, ssh, none], description: The path operations use right now. }
        agent_state: { type: string, description: 'connected, not_connected, not_enrolled, incompatible, epoch_mismatch, quarantined, revoked, disabled, or empty for SSH hosts' }
        reason: { type: string }
        blocked: { type: boolean, description: No path may be used until an administrator decides (revoked or quarantined identity). }
    AgentCaps:
      type: object
      required: [monitoring, shell, packages, services, reboot, files, firewall, users]
      properties:
        monitoring: { type: boolean }
        shell: { type: boolean }
        packages: { type: object, required: [enabled, configured_repositories_only], properties: { enabled: { type: boolean }, configured_repositories_only: { type: boolean } } }
        services: { type: object, required: [enabled], properties: { enabled: { type: boolean }, allowed: { type: array, items: { type: string } } } }
        reboot: { type: boolean }
        files:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            allowed_paths: { type: array, items: { type: string } }
            allowed_validation_commands: { type: array, items: { type: string } }
        firewall: { type: boolean }
        users: { type: boolean }
    AgentPreset:
      type: object
      required: [name, caps, root_equivalent, file]
      properties:
        name: { type: string }
        caps: { $ref: '#/components/schemas/AgentCaps' }
        root_equivalent: { type: array, items: { type: string } }
        file: { type: string }
    AgentPKIStatus:
      type: object
      required: [root_fingerprint, root_not_after, root_key_online, intermediate_fingerprint, intermediate_not_after, manifest_version, trusted_intermediates, revoked_intermediates]
      properties:
        root_fingerprint: { type: string }
        root_not_after: { type: string, format: date-time }
        root_key_online: { type: boolean }
        root_key_removed_at: { type: string, format: date-time }
        intermediate_fingerprint: { type: string }
        intermediate_not_after: { type: string, format: date-time }
        manifest_version: { type: integer }
        trusted_intermediates: { type: [array, 'null'], items: { type: string } }
        revoked_intermediates: { type: [array, 'null'], items: { type: string } }
    AgentPKI:
      allOf:
        - $ref: '#/components/schemas/AgentPKIStatus'
        - type: object
          required: [endpoint_port, controller_epoch, newest_agent_manifest]
          properties:
            endpoint_port: { type: string }
            controller_epoch: { type: string }
            newest_agent_manifest: { type: integer, description: 'The newest trust manifest version a Shepherd reported. Newer than manifest_version after a restore from a backup older than an intermediate rotation: rotate the intermediate (the next manifest is numbered to supersede it).' }
    EnrollmentToken:
      type: object
      required: [id, description, host_id, host_name, group_id, group_name, preset, created_at, expires_at, used_at, revoked_at, state]
      properties:
        id: { type: string }
        description: { type: string }
        host_id: { type: [string, 'null'] }
        host_name: { type: string }
        group_id: { type: [string, 'null'] }
        group_name: { type: string }
        preset: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [active, used, expired, revoked] }
    CreatedEnrollmentToken:
      type: object
      required: [id, token, expires_at, endpoints, install_command, root_fingerprint, pinned_web_key]
      properties:
        id: { type: string }
        token: { type: string, description: Shown once. Carries the controller endpoints and the pinned Agent Root CA fingerprint. }
        expires_at: { type: string, format: date-time }
        endpoints: { type: array, items: { type: string } }
        install_command: { type: string }
        root_fingerprint: { type: string }
        pinned_web_key: { type: string }
    AgentIdentity:
      type: object
      required: [id, host_id, status, key_fingerprint, enrolled_at, cert_not_after, cert_renew_after, recovered_at, revoked_at, agent_version,
                 protocol, protocol_min, protocol_max, compatible, hostname, os, arch, ceiling, effective, root_equivalent, manifest_version,
                 epoch_reported, epoch_matches, last_seen_at, last_address, connected, update_state, update_version, update_detail, update_at, compatibility]
      properties:
        id: { type: string }
        host_id: { type: string }
        status: { type: string, enum: [active, quarantined, revoked] }
        key_fingerprint: { type: string }
        enrolled_at: { type: string, format: date-time }
        cert_not_after: { type: string, format: date-time }
        cert_renew_after: { type: string }
        recovered_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoke_reason: { type: string }
        conflict:
          type: object
          properties:
            detected_at: { type: string }
            sessions:
              type: array
              items: { type: object, properties: { address: { type: string }, connected_at: { type: string }, hostname: { type: string }, machine_id: { type: string }, boot_id: { type: string }, agent_version: { type: string } } }
        agent_version: { type: string }
        protocol: { type: integer }
        protocol_min: { type: integer }
        protocol_max: { type: integer }
        compatible: { type: boolean }
        compat_reason: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        ceiling: { $ref: '#/components/schemas/AgentCaps' }
        effective: { $ref: '#/components/schemas/AgentCaps' }
        root_equivalent: { type: array, items: { type: string } }
        manifest_version: { type: integer }
        epoch_reported: { type: string }
        epoch_matches: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_address: { type: string }
        connected: { type: boolean }
        update_state: { type: string }
        update_version: { type: string }
        update_detail: { type: string }
        update_at: { type: [string, 'null'], format: date-time }
        compatibility: { $ref: '#/components/schemas/AgentCompatibility' }
    AgentSession:
      type: object
      required: [address, connected_at, last_seen, protocol, agent_version, quarantined]
      properties:
        address: { type: string }
        connected_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        protocol: { type: integer }
        agent_version: { type: string }
        quarantined: { type: boolean }
    StateVersion:
      type: object
      required: [domain, epoch, revision, reported_epoch, reported_revision, status]
      properties:
        domain: { type: string }
        epoch: { type: string }
        revision: { type: integer }
        reported_epoch: { type: string }
        reported_revision: { type: integer }
        status: { type: string, enum: [ok, host_ahead, epoch_mismatch] }
    HostAgent:
      type: object
      required: [management, identity, sessions, state_versions, requested_caps, ssh_bypasses_ceiling]
      properties:
        management: { $ref: '#/components/schemas/Management' }
        identity: { oneOf: [{ $ref: '#/components/schemas/AgentIdentity' }, { type: 'null' }] }
        sessions: { type: array, items: { $ref: '#/components/schemas/AgentSession' } }
        state_versions: { type: array, items: { $ref: '#/components/schemas/StateVersion' } }
        requested_caps: { oneOf: [{ $ref: '#/components/schemas/AgentCaps' }, { type: 'null' }] }
        ssh_bypasses_ceiling: { type: boolean, description: SSH fallback with root access exists; it is not limited by the agent's ceiling. }
        update_available: { type: string }
    AgentUpdatePolicy:
      type: object
      required: [policy, channel, version, canary, batch_size, max_failures, health_window_s]
      properties:
        policy: { type: string, enum: [manual, automatic] }
        channel: { type: string }
        version: { type: string }
        canary: { type: integer }
        batch_size: { type: integer }
        max_failures: { type: integer }
        health_window_s: { type: integer }
    ReleaseKey:
      type: object
      required: [id, name, public_key, added_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string }
        added_at: { type: string, format: date-time }
    AgentRelease:
      type: object
      required: [id, version, channel, os, arch, protocol_min, protocol_max, sha256, size, key_id, created_at]
      properties:
        id: { type: string }
        version: { type: string }
        channel: { type: string }
        os: { type: string }
        arch: { type: string }
        protocol_min: { type: integer }
        protocol_max: { type: integer }
        sha256: { type: string }
        size: { type: integer }
        key_id: { type: string }
        created_at: { type: string, format: date-time }
    AgentRollout:
      type: object
      required: [id, version, status, canary, batch_size, max_failures, health_window_s, failures, paused_reason, automatic, kind, preset, created_at, updated_at]
      properties:
        id: { type: string }
        version: { type: string }
        kind: { type: string, enum: [update, install], description: 'install: a bulk SSH → agent conversion (hosts get the agent over SSH).' }
        preset: { type: string }
        status: { type: string, enum: [running, paused, completed, cancelled] }
        canary: { type: integer }
        batch_size: { type: integer }
        max_failures: { type: integer }
        health_window_s: { type: integer }
        failures: { type: integer }
        paused_reason: { type: string }
        automatic: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        hosts:
          type: array
          items:
            type: object
            required: [host_id, host_name, wave, state, from_version, detail, offline, updated_at]
            properties:
              host_id: { type: string }
              host_name: { type: string }
              wave: { type: integer }
              state: { type: string, enum: [pending, offered, staged, updating, healthy, rolled_back, failed, skipped] }
              from_version: { type: string }
              detail: { type: string }
              offline: { type: boolean }
              updated_at: { type: string, format: date-time }
    EndpointMigration:
      type: object
      required: [id, endpoint, status, created_at, committed_at, confirmed, failed, committed, agents]
      properties:
        id: { type: string }
        endpoint: { type: string }
        status: { type: string, enum: [testing, committed, cancelled] }
        created_at: { type: string, format: date-time }
        committed_at: { type: [string, 'null'], format: date-time }
        confirmed: { type: integer }
        failed: { type: integer }
        committed: { type: integer }
        agents: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        error_class: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        problems: { type: array, items: { $ref: '#/components/schemas/FwDocProblem' }, description: Firewall document validation problems. }
        reauth:
          type: object
          description: 'Set on `reauth_required`: confirm with POST /auth/reauth, then repeat the request.'
          required: [mfa, window_s]
          properties:
            mfa: { type: boolean, description: Ask for an authenticator code too. }
            window_s: { type: integer }

    SetupStatus:
      type: object
      required: [setup_required, code_available]
      properties:
        setup_required: { type: boolean }
        code_available: { type: boolean, description: An unexpired setup code exists. }

    SetupClaimRequest:
      type: object
      required: [code, username, password]
      additionalProperties: false
      properties:
        code: { type: string }
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$' }
        password: { type: string, format: password, minLength: 12 }

    Role:
      type: string
      enum: [admin, operator, auditor, viewer]

    User:
      type: object
      required: [id, username, role, disabled, last_login_at]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        mfa_enabled: { type: boolean }

    Me:
      type: object
      required: [user, permissions, auth_kind, mfa_enabled, reauth_window_s]
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string } }
        auth_kind: { type: string, enum: [session, token] }
        csrf_token: { type: string, description: Present for session authentication. }
        mfa_enabled: { type: boolean }
        reauth_until: { type: string, format: date-time, description: 'Until when high-impact actions go through without confirming again (sessions only).' }
        reauth_window_s: { type: integer }

    MfaChallenge:
      type: object
      required: [mfa_required, challenge, methods]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge: { type: string }
        methods: { type: array, items: { type: string, enum: [totp, recovery_code] } }

    LoginMfaRequest:
      type: object
      required: [challenge]
      additionalProperties: false
      properties:
        challenge: { type: string }
        code: { type: string, description: Six digits from the authenticator. }
        recovery_code: { type: string }

    ReauthRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, format: password }
        code: { type: string }
        recovery_code: { type: string }

    ReauthResponse:
      type: object
      required: [reauth_until]
      properties:
        reauth_until: { type: string, format: date-time }

    MfaStatus:
      type: object
      required: [enabled, pending, enabled_at, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        pending: { type: boolean, description: An authenticator was set up but not confirmed. }
        enabled_at: { type: [string, 'null'], format: date-time }
        recovery_codes_remaining: { type: integer }

    MfaEnrollment:
      type: object
      required: [secret, otpauth_uri, issuer]
      properties:
        secret: { type: string, description: Base32, shown once. }
        otpauth_uri: { type: string }
        issuer: { type: string }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string }, description: Shown once. }

    AuditVerification:
      type: object
      required: [id, cause, started_at, finished_at, result, records, legacy_records, head_seq, sealed_through, checkpoints, checkpoints_unverifiable, problems, problem_count]
      properties:
        id: { type: string }
        cause: { type: string, enum: [startup, scheduled, manual, restore] }
        requested_by: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        result: { type: string, enum: [running, ok, failed, error] }
        records: { type: integer }
        legacy_records: { type: integer }
        head_seq: { type: integer }
        sealed_through: { type: integer, description: Newest record covered by a checkpoint whose MAC checked out. }
        checkpoints: { type: integer }
        checkpoints_unverifiable: { type: integer, description: Checkpoints made with a master key version that isn't available any more. }
        first_bad_seq: { type: integer }
        problem: { type: string }
        detail: { type: string }
        problems:
          type: array
          items:
            type: object
            required: [seq, kind, message, detail]
            properties:
              seq: { type: integer }
              kind: { type: string, enum: [missing, duplicate, link, changed, start, legacy, checkpoint, forged, unchained, truncated] }
              message: { type: string }
              detail: { type: string }
        problem_count: { type: integer }
        evidence_file: { type: string }

    AuditIntegrity:
      type: object
      required: [state, head_seq, legacy_records, running, last, last_ok, last_failed, acknowledgement]
      properties:
        state: { type: string, enum: [ok, failed, acknowledged, unverified, running] }
        head_seq: { type: integer }
        legacy_records: { type: integer, description: Records from before the chain started (covered by its first record's digest). }
        running: { oneOf: [{ $ref: '#/components/schemas/AuditVerification' }, { type: 'null' }] }
        last: { oneOf: [{ $ref: '#/components/schemas/AuditVerification' }, { type: 'null' }] }
        last_ok: { oneOf: [{ $ref: '#/components/schemas/AuditVerification' }, { type: 'null' }] }
        last_failed: { oneOf: [{ $ref: '#/components/schemas/AuditVerification' }, { type: 'null' }] }
        acknowledgement:
          oneOf:
            - type: 'null'
            - type: object
              required: [verification_id, problem, by, at, note]
              properties:
                verification_id: { type: string }
                problem: { type: string }
                by: { type: string }
                at: { type: string, format: date-time }
                note: { type: string }

    AuditSink:
      type: object
      required: [configured, enabled, header_set, custom_ca, cursor_seq, head_seq, backlog, failures, state]
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        url: { type: string }
        url_display: { type: string }
        header_name: { type: string }
        header_set: { type: boolean }
        custom_ca: { type: boolean }
        cursor_seq: { type: integer, description: Delivered through this record. }
        head_seq: { type: integer }
        backlog: { type: integer }
        oldest_unsent: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        failures: { type: integer }
        state: { type: string, enum: [off, ok, backlogged, failing] }

    AuditSinkRequest:
      type: object
      required: [enabled, url]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        url: { type: string, description: https only; no credentials in the URL. }
        ca_pem: { type: string, description: An extra CA certificate for the receiver (self-hosted receivers). }
        header_name: { type: string }
        header_value: { type: string, description: 'Stored encrypted; omit to keep, "" to remove.' }
        start_from: { type: string, enum: [all, now], description: For a new receiver - the whole history (default) or only new records. }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$' }
        password: { type: string, format: password, minLength: 12 }
        role: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        password: { type: string, format: password, minLength: 12 }

    APIToken:
      type: object
      required: [id, name, created_at, last_used_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: '#/components/schemas/APIToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown once. }

    CreateTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 3650 }

    AuditEvent:
      type: object
      required: [id, ts, actor, action, target, result, source_ip, request_id, details]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [user, token, system, anonymous] }
            id: { type: string }
            name: { type: string }
        action: { type: string }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
        seq: { type: [integer, 'null'], description: Place in the audit hash chain; null for records from before it existed. }
        hash: { type: string, description: The record's chain hash (hex). }

    ConfigValue:
      type: object
      required: [key, value, source, env_var]
      properties:
        key: { type: string }
        value: {}
        source: { type: string, enum: [default, file, env] }
        env_var: { type: string }

    SystemInfo:
      type: object
      required: [version, commit, build_date, go_version, schema_version, tls_mode, insecure_plaintext]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
        schema_version: { type: integer }
        tls_mode: { type: string, enum: [self_signed, provided, 'off'] }
        insecure_plaintext: { type: boolean }
        config_file: { type: string }
        config: { type: array, items: { $ref: '#/components/schemas/ConfigValue' } }

    CredentialKind:
      type: string
      enum: [ssh_private_key, password, sudo_password]

    HostRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Credential:
      type: object
      required: [id, name, kind, description, used_by, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        description: { type: string }
        public_key: { type: string, description: authorized_keys line for SSH keys }
        used_by: { type: array, items: { $ref: '#/components/schemas/HostRef' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCredentialRequest:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        description: { type: string }
        value: { type: string, format: password }
        passphrase: { type: string, format: password }
        generate: { type: boolean }

    UpdateCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        value: { type: string, format: password }
        passphrase: { type: string, format: password }
        generate: { type: boolean }
        replace_in_use: { type: boolean, description: 'Acknowledges that every host using the credential switches to the new value at once.' }

    ControllerKey:
      type: object
      required: [credential_id, public_key, install_command]
      properties:
        credential_id: { type: string }
        public_key: { type: string }
        install_command: { type: string }

    HostStatus:
      type: string
      enum: [pending_hostkey, untested, ready, unreachable, hostkey_mismatch, auth_failed, unsupported, disabled]

    HostKey:
      type: object
      required: [id, type, fingerprint, status, first_seen_at, last_seen_at, decided_at]
      properties:
        id: { type: string }
        type: { type: string }
        fingerprint: { type: string }
        status: { type: string, enum: [offered, pinned, retired] }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }

    Host:
      type: object
      required: [id, name, description, address, port, user, credential_id, become_method, become_credential_id,
                 needs_pty, jump_only, via_host_id, status, status_detail, last_probe_at, tags, group_ids,
                 pinned_key, facts, health, management, ssh_auth, ssh_principal, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        port: { type: integer }
        user: { type: string }
        credential_id: { type: string }
        become_method: { type: string, enum: [sudo, none] }
        become_credential_id: { type: [string, 'null'] }
        needs_pty: { type: boolean }
        jump_only: { type: boolean }
        via_host_id: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HostStatus' }
        status_detail: { type: string }
        last_probe_at: { type: [string, 'null'], format: date-time }
        tags: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        pinned_key:
          oneOf:
            - $ref: '#/components/schemas/HostKey'
            - type: 'null'
        facts:
          oneOf:
            - $ref: '#/components/schemas/FactsSummary'
            - type: 'null'
        health:
          description: Latest polled status (null before the first check).
          oneOf:
            - $ref: '#/components/schemas/Health'
            - type: 'null'
        management: { $ref: '#/components/schemas/Management' }
        ssh_auth: { type: string, enum: [credential, certificate], description: 'How DROOL signs in over SSH: the credential, or short-lived certificates from its SSH certificate authority (M16).' }
        ssh_principal: { type: string, description: The principal certificates name; empty means the SSH user. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HostRequest:
      type: object
      additionalProperties: false
      description: For create, name, address and user are required. For PATCH, omitted fields are unchanged.
      properties:
        name: { type: string }
        description: { type: string }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string }
        credential_id: { type: string }
        become_method: { type: string, enum: [sudo, none] }
        become_credential_id: { type: [string, 'null'], description: Empty or null means passwordless sudo }
        needs_pty: { type: boolean }
        jump_only: { type: boolean }
        via_host_id: { type: [string, 'null'], description: Jump host id; empty or null for direct }
        tags: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        ssh_auth: { type: string, enum: [credential, certificate], description: 'Create only: certificate for a host that already trusts DROOL''s SSH certificate authority (then no credential is needed). Existing hosts switch with PUT /hosts/{id}/ssh-auth.' }
        ssh_principal: { type: string, description: Create only. }

    ProbeStep:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, failed, skipped] }
        detail: { type: string }
        error_class: { type: string }
        hint: { type: string }

    ProbeResult:
      type: object
      required: [ok, steps, host]
      properties:
        ok: { type: boolean }
        steps: { type: array, items: { $ref: '#/components/schemas/ProbeStep' } }
        host: { $ref: '#/components/schemas/Host' }

    Group:
      type: object
      required: [id, name, description, host_ids, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        host_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        host_ids: { type: array, items: { type: string } }

    Operation:
      description: One typed step. Discriminated by `type`.
      oneOf:
        - $ref: '#/components/schemas/CommandOp'
        - $ref: '#/components/schemas/ScriptOp'
        - $ref: '#/components/schemas/PackageOp'
        - $ref: '#/components/schemas/SystemUpdateOp'
        - $ref: '#/components/schemas/ServiceOp'
        - $ref: '#/components/schemas/RebootOp'
        - $ref: '#/components/schemas/FileDeployOp'
        - $ref: '#/components/schemas/WaitOp'
        - $ref: '#/components/schemas/VerifyHostOp'
        - $ref: '#/components/schemas/VerifyServicesOp'
        - $ref: '#/components/schemas/VerifyHealthOp'
        - $ref: '#/components/schemas/SSHCATrustOp'
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandOp'
          script: '#/components/schemas/ScriptOp'
          package: '#/components/schemas/PackageOp'
          system_update: '#/components/schemas/SystemUpdateOp'
          service: '#/components/schemas/ServiceOp'
          reboot: '#/components/schemas/RebootOp'
          file_deploy: '#/components/schemas/FileDeployOp'
          wait: '#/components/schemas/WaitOp'
          verify_host: '#/components/schemas/VerifyHostOp'
          verify_services: '#/components/schemas/VerifyServicesOp'
          verify_health: '#/components/schemas/VerifyHealthOp'
          ssh_ca_trust: '#/components/schemas/SSHCATrustOp'

    SSHCATrustOp:
      type: object
      description: >-
        Controller-side step (M16): makes the host trust DROOL's SSH certificate authorities (every one that isn't retired)
        through TrustedUserCAKeys in an sshd_config.d file, checks it with sshd -t and sshd -T, reloads sshd when something
        changed, then proves each issuing authority with a brand-new connection that offers only a certificate. Refuses
        hosts that already trust another CA file. "remove" takes DROOL's files away (refused while the host signs in with
        certificates). Requires `credentials.manage`.
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ssh_ca_trust] }
        action: { type: string, enum: [install, remove], default: install }

    SSHCA:
      type: object
      required: [id, name, public_key, fingerprint, state, has_key, created_at, activated_at, retired_at, issued]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string, description: The authorized_keys line hosts trust. }
        fingerprint: { type: string }
        state: { type: string, enum: [active, next, previous, retired] }
        has_key: { type: boolean, description: False once retired, or after the key was discarded in a recovery. }
        created_at: { type: string, format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }
        issued: { type: integer, description: Certificates issued so far. }

    SSHCAState:
      type: object
      required: [authorities, certificate_hosts, certificate_only_hosts, ttl_s, clock_skew_s, unverified]
      properties:
        authorities: { type: array, items: { $ref: '#/components/schemas/SSHCA' } }
        certificate_hosts: { type: integer }
        certificate_only_hosts: { type: integer, description: Hosts in certificate mode with no credential left (the CA is their only way in). }
        ttl_s: { type: integer }
        clock_skew_s: { type: integer }
        unverified: { type: array, items: { type: string }, description: During a rotation, hosts in certificate mode that haven't accepted the new authority yet. }

    SSHCANameRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }

    AgentCompatibility:
      type: object
      description: 'How the Shepherd and this controller work together (M16). incompatible: the protocol; update_required: it lacks a capability this host''s configuration needs (operations needing it aren''t sent); reduced: it lacks optional capabilities; update_recommended: a newer release is stored; trust_failure: revoked, in conflict, or a certificate expired beyond renewal.'
      required: [status, summary, missing]
      properties:
        status: { type: string, enum: [compatible, reduced, update_recommended, update_required, incompatible, trust_failure] }
        summary: { type: string }
        missing: { type: array, items: { type: string } }
    RestoreStatus:
      type: object
      required: [restore, counts, hosts, schedules, baselines, agent_rollouts_paused, unknown_outcome]
      properties:
        restore:
          oneOf:
            - { $ref: '#/components/schemas/RestoreInfo' }
            - { type: 'null' }
        counts: { type: object, additionalProperties: { type: integer }, description: Hosts per reconciliation state. }
        hosts: { type: array, items: { $ref: '#/components/schemas/HostReconciliation' } }
        schedules: { type: array, items: { $ref: '#/components/schemas/RestoreHeldItem' }, description: Job schedules the restore held. }
        baselines: { type: array, items: { $ref: '#/components/schemas/RestoreHeldItem' }, description: Baselines whose automatic restore the restore paused. }
        agent_rollouts_paused: { type: integer }
        unknown_outcome:
          type: object
          description: What the restore closed without knowing how it ended (never repeated).
          required: [jobs, job_hosts, firewall_transactions, notifications, queued_runs]
          properties:
            jobs: { type: integer }
            job_hosts: { type: integer }
            firewall_transactions: { type: integer }
            notifications: { type: integer }
            queued_runs: { type: integer }
    RestoreInfo:
      type: object
      required: [id, restored_at, backup_created_at, backup_version, backup_host, previous_epoch, epoch, restored_by, status]
      properties:
        id: { type: string }
        restored_at: { type: string, format: date-time }
        backup_created_at: { type: string, format: date-time }
        backup_version: { type: string }
        backup_host: { type: string }
        previous_epoch: { type: string }
        epoch: { type: string }
        restored_by: { type: string }
        status: { type: string, enum: [reconciling, finished] }
        finished_at: { type: string, format: date-time }
        finished_by: { type: string }
    RestoreHeldItem:
      type: object
      required: [id, name, held]
      properties:
        id: { type: string }
        name: { type: string }
        held: { type: boolean, description: Still held (false once an administrator resumed it). }
    HostReconciliation:
      type: object
      required: [host_id, host_name, state, reason, domains, attempts, restore_id]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        state: { type: string, enum: [pending, recovered, reconciled, ahead, attention, incompatible, blocked, unreachable] }
        reason: { type: string }
        domains: { type: array, items: { $ref: '#/components/schemas/ReconciliationDomain' } }
        checked_at: { type: string, format: date-time }
        reconciled_at: { type: string, format: date-time }
        decided_by: { type: string, description: Who accepted the host's state. }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        restore_id: { type: string }
    ReconciliationDomain:
      type: object
      required: [domain, verdict, controller_revision, host_revision]
      properties:
        domain: { type: string }
        verdict: { type: string, enum: [same, controller_ahead, host_ahead, conflict, foreign_epoch, accepted] }
        controller_epoch: { type: string }
        controller_revision: { type: integer }
        controller_hash: { type: string }
        host_epoch: { type: string }
        host_revision: { type: integer }
        host_hash: { type: string }
    UnknownAgent:
      type: object
      required: [identity_id, hostname, machine_id, agent_version, address, key_fingerprint, first_seen_at, last_seen_at, attempts]
      properties:
        identity_id: { type: string }
        hostname: { type: string }
        machine_id: { type: string }
        agent_version: { type: string }
        address: { type: string }
        key_fingerprint: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        attempts: { type: integer }
    HostSSHAuth:
      type: object
      required: [mode, principal, credential_assigned, trust]
      properties:
        mode: { type: string, enum: [credential, certificate] }
        principal: { type: string }
        credential_assigned: { type: boolean }
        trust:
          type: array
          items:
            type: object
            required: [ca_id, ca_name, ca_state, installed_at, verified_at, failed_at]
            properties:
              ca_id: { type: string }
              ca_name: { type: string }
              ca_state: { type: string, enum: [active, next, previous, retired] }
              installed_at: { type: [string, 'null'], format: date-time }
              verified_at: { type: [string, 'null'], format: date-time }
              failed_at: { type: [string, 'null'], format: date-time }
              error: { type: string }

    WaitOp:
      type: object
      description: Controller-side workflow step (M13). Pauses the host's run; nothing runs on the host.
      required: [type, seconds]
      additionalProperties: false
      properties:
        type: { type: string, enum: [wait] }
        seconds: { type: integer, minimum: 1, maximum: 3600 }
    VerifyHostOp:
      type: object
      description: Controller-side workflow step (M13). Passes when the host answers on its management path (its agent is connected, or an SSH connection test passes), retrying until the timeout.
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [verify_host] }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 300 }
    VerifyServicesOp:
      type: object
      description: Controller-side workflow step (M13). Passes when every named systemd unit is active, from freshly collected monitoring data, retrying until the timeout; otherwise the host fails.
      required: [type, services]
      additionalProperties: false
      properties:
        type: { type: string, enum: [verify_services] }
        services: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
        timeout_s: { type: integer, minimum: 1, maximum: 3600, default: 120 }
    VerifyHealthOp:
      type: object
      description: Controller-side workflow step (M13). Passes when the host has no active health issue of the policy's severity (from fresh monitoring data), retrying until the timeout. Deliberately not an expression language.
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [verify_health] }
        policy: { type: string, enum: [no_critical, no_warning], default: no_critical }
        timeout_s: { type: integer, minimum: 1, maximum: 3600, default: 120 }

    CommandOp:
      type: object
      required: [type, command]
      additionalProperties: false
      properties:
        type: { type: string, enum: [command] }
        command: { type: string, maxLength: 65536 }
        become: { type: boolean, description: Run with sudo }
        read_only: { type: boolean, description: Allows running alongside other jobs on the same host }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 300 }
        when: { $ref: '#/components/schemas/When' }

    ScriptOp:
      type: object
      required: [type, body]
      additionalProperties: false
      properties:
        type: { type: string, enum: [script] }
        interpreter: { type: string, enum: [sh, bash], default: sh }
        body:
          description: One script, or per-OS variants keyed by OS family or distro id, with optional `default`.
          oneOf:
            - type: string
            - type: object
              additionalProperties: { type: string }
        when: { $ref: '#/components/schemas/When' }
        become: { type: boolean }
        read_only: { type: boolean }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 600 }

    TargetSpec:
      type: object
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        exclude_hosts: { type: array, items: { type: string } }

    JobSpec:
      type: object
      required: [steps, targets]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        steps: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Operation' } }
        targets: { $ref: '#/components/schemas/TargetSpec' }
        strategy: { $ref: '#/components/schemas/Strategy' }

    Strategy:
      type: object
      description: >-
        Rollout. Hosts run in waves fixed when the job is created (in the targets' name order): optional canaries
        first — if one fails, the job pauses before any other host starts — then batches of `batch_size` (0: all
        remaining at once); a wave starts only when the previous one has finished. `concurrency` limits hosts running
        at once inside a wave. Reaching `failure_threshold` failures stops starting hosts, lets running ones finish,
        and pauses the job (resume continues with a renewed allowance; failed hosts stay failed).
      additionalProperties: false
      properties:
        concurrency: { type: integer, minimum: 1, maximum: 100, default: 10 }
        failure_threshold: { type: [integer, 'null'], minimum: 1, description: Pause after this many failures }
        canary_count: { type: integer, minimum: 0, maximum: 10, description: The first N hosts by name are the canaries }
        canary_hosts: { type: array, maxItems: 10, items: { type: string }, description: Explicit canary hosts (instead of a count) }
        batch_size: { type: integer, minimum: 0, maximum: 1000, description: 'Hosts per wave after the canaries (0: all at once)' }

    JobStatus:
      type: string
      enum: [pending, running, paused, completed, cancelled, interrupted]

    JobHostState:
      type: string
      enum: [queued, waiting_lock, connecting, running, rebooting, waiting_host, verifying,
             succeeded, failed, timed_out, cancelled, skipped, interrupted]

    TargetHost:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/HostStatus' }
        warning: { type: string }
        skip: { type: boolean }

    JobPreview:
      type: object
      required: [hosts, warnings, waves, desired_warnings]
      properties:
        hosts: { type: array, items: { $ref: '#/components/schemas/TargetHost' } }
        warnings: { type: array, items: { type: string } }
        waves: { type: array, items: { $ref: '#/components/schemas/RolloutWave' } }
        desired_warnings:
          type: array
          description: Steps that would change something desired state manages the other way (M14). Warnings, not refusals. Empty without `desired.read`.
          items: { $ref: '#/components/schemas/DesiredJobWarning' }

    DesiredJobWarning:
      type: object
      required: [step, key, hosts, message, auto]
      properties:
        step: { type: integer, description: 0-based step index }
        key: { type: string, description: 'The resource, e.g. service:jellyfin.service' }
        hosts: { type: array, items: { type: string }, description: Host names }
        message: { type: string }
        auto: { type: boolean, description: Automatic restore would put it back after the job (the message then says so) }

    RolloutWave:
      type: object
      required: [index, canary, hosts]
      properties:
        index: { type: integer }
        canary: { type: boolean }
        hosts: { type: array, items: { type: string }, description: Host names }

    Job:
      type: object
      required: [id, name, status, pause_reason, spec, rerun_of, created_by, created_at, started_at, finished_at, counts, host_count]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        pause_reason: { type: string }
        spec: { $ref: '#/components/schemas/JobSpec' }
        rerun_of: { type: [string, 'null'] }
        created_by: { type: string, description: Username }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        counts: { type: object, additionalProperties: { type: integer }, description: Hosts per state }
        host_count: { type: integer }
        origin: { $ref: '#/components/schemas/JobOrigin' }

    JobOrigin:
      type: object
      description: The schedule occurrence or workflow revision that produced the job (M13).
      properties:
        schedule_id: { type: string }
        schedule_name: { type: string }
        occurrence_id: { type: string }
        scheduled_for: { type: integer, description: Nominal time (unix ms) }
        manual: { type: boolean, description: '"Run now" (by the job''s creator) rather than the schedule''s clock' }
        owner: { type: string, description: "The schedule's current owner (the job's created_by is who it ran as)" }
        workflow_id: { type: string }
        workflow_name: { type: string }
        workflow_revision: { type: integer }
        reconcile_id: { type: string, description: A desired-state correction (M14) }
        reconcile_kind: { type: string, enum: [manual, auto], description: 'Restore managed state, or a baseline''s automatic restore (run as its owner)' }
        baseline_id: { type: string }
        baseline_name: { type: string }

    JobHost:
      type: object
      required: [host_id, host_name, state, current_step, attempt, exit_code, error_class, error_message, error_hint, started_at, finished_at, transport, transport_note, wave]
      properties:
        transport: { type: string, description: 'Management path that ran it: agent, ssh, or empty.' }
        transport_note: { type: string, description: 'Why, e.g. "SSH fallback: the agent is not connected".' }
        host_id: { type: string }
        host_name: { type: string }
        state: { $ref: '#/components/schemas/JobHostState' }
        current_step: { type: integer }
        attempt: { type: integer }
        exit_code: { type: [integer, 'null'] }
        error_class: { type: string }
        error_message: { type: string }
        error_hint: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        wave: { type: integer, description: 'Rollout wave (0 is the canary wave of a canary rollout); -1: not part of the run (skipped up front, e.g. in maintenance)' }
        steps:
          type: [array, 'null']
          items: { type: integer }
          description: 'The step indexes this host runs when hosts run different subsets of the job''s steps (desired-state corrections: each host runs only its own corrections); null: every step.'

    JobStep:
      type: object
      required: [index, type, state, attempt, exit_code, stdout_bytes, stderr_bytes, truncated, started_at, finished_at]
      properties:
        index: { type: integer }
        type: { type: string }
        state: { type: string, enum: [running, succeeded, failed, timed_out, cancelled, interrupted] }
        attempt: { type: integer }
        exit_code: { type: [integer, 'null'] }
        stdout_bytes: { type: integer }
        stderr_bytes: { type: integer }
        truncated: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        changed: { type: [boolean, 'null'] }
        result:
          type: object
          additionalProperties: true
          description: Operation-specific result (package plan and version changes, service state before/after, reboot boot ids).

    JobHostDetail:
      allOf:
        - $ref: '#/components/schemas/JobHost'
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: '#/components/schemas/JobStep' } }

    JobOutput:
      type: object
      required: [segments, next_seq, more]
      properties:
        segments:
          type: array
          items:
            type: object
            required: [seq, stream, text, ts]
            properties:
              seq: { type: integer }
              stream: { type: string, enum: [stdout, stderr] }
              text: { type: string }
              ts: { type: string, format: date-time }
        next_seq: { type: integer }
        more: { type: boolean }

    When:
      type: object
      description: Run the step only on hosts whose discovered facts match. Unknown facts never match.
      additionalProperties: false
      properties:
        os_family: { type: array, items: { type: string, enum: [debian, redhat, suse, arch] } }
        distro: { type: array, items: { type: string }, description: 'os-release ID, e.g. ubuntu, rocky' }

    FactsSummary:
      type: object
      required: [collected_at, os_family, distro, distro_version, distro_name, kernel, arch, hostname,
                 cpu_count, mem_bytes, pkg_manager, init_system, container_runtimes]
      properties:
        collected_at: { type: string, format: date-time }
        os_family: { type: string }
        distro: { type: string }
        distro_version: { type: string }
        distro_name: { type: string }
        kernel: { type: string }
        arch: { type: string }
        hostname: { type: string }
        cpu_count: { type: [integer, 'null'] }
        mem_bytes: { type: [integer, 'null'] }
        pkg_manager: { type: string }
        init_system: { type: string }
        container_runtimes: { type: array, items: { type: string } }

    Health:
      type: object
      description: Unknown values are null, never zero.
      required: [checked_at, stale, reachable, uptime_s, load1, mem_used_pct, max_fs_used_pct, max_fs_mount,
                 failed_units, failed_unit_names, reboot_required, reboot_reason, updates_available,
                 security_updates, updates_checked_at, last_error, last_error_class]
      properties:
        checked_at: { type: string, format: date-time }
        stale: { type: boolean, description: The last check is older than three status intervals }
        reachable: { type: boolean }
        uptime_s: { type: [integer, 'null'] }
        load1: { type: [number, 'null'] }
        mem_used_pct: { type: [number, 'null'] }
        max_fs_used_pct: { type: [number, 'null'] }
        max_fs_mount: { type: string }
        failed_units: { type: [integer, 'null'], description: Null when systemd isn't running }
        failed_unit_names: { type: array, items: { type: string } }
        reboot_required: { type: [boolean, 'null'] }
        reboot_reason: { type: string }
        updates_available: { type: [integer, 'null'] }
        security_updates: { type: [integer, 'null'] }
        updates_checked_at: { type: [string, 'null'], format: date-time }
        last_error: { type: string }
        last_error_class: { type: string }

    HostFacts:
      type: object
      required: [collected_at, facts, addresses]
      properties:
        collected_at: { type: [string, 'null'], format: date-time }
        facts:
          description: Full discovery result (filesystems, interfaces, services, ports, warnings, ...).
          type: [object, 'null']
          additionalProperties: true
        addresses:
          type: array
          items:
            type: object
            required: [address, family, interface, source, first_seen_at, last_seen_at]
            properties:
              address: { type: string }
              family: { type: integer }
              interface: { type: string }
              source: { type: string, enum: [configured, discovered, dns] }
              first_seen_at: { type: string, format: date-time }
              last_seen_at: { type: string, format: date-time }

    PackageOp:
      type: object
      required: [type, action, names]
      additionalProperties: false
      properties:
        type: { type: string, enum: [package] }
        action: { type: string, enum: [install, remove, upgrade] }
        names: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
        allow_removals: { type: boolean, description: Allow removing packages other than the named ones }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 1800 }
        when: { $ref: '#/components/schemas/When' }

    SystemUpdateOp:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [system_update] }
        mode:
          type: string
          enum: [upgrade, full_upgrade, security]
          default: upgrade
          description: '`upgrade` never removes packages on APT; `full_upgrade` may; `security` is DNF only.'
        allow_removals: { type: boolean, description: Required to proceed when the simulation shows removals }
        refresh: { type: boolean, default: true, description: Refresh package metadata first }
        reboot: { type: string, enum: [never, if_required, always], default: never }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
        when: { $ref: '#/components/schemas/When' }

    ServiceOp:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type: { type: string, enum: [service] }
        name: { type: string, description: 'systemd unit; ".service" is added when no suffix is given' }
        state: { type: string, enum: [running, stopped, restarted, reloaded] }
        enabled: { type: [boolean, 'null'] }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 120 }
        when: { $ref: '#/components/schemas/When' }

    RebootOp:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [reboot] }
        wait: { type: boolean, default: true, description: Wait until the host is back with a new boot id }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 900 }
        when: { $ref: '#/components/schemas/When' }

    PackageChange:
      type: object
      required: [name]
      properties:
        name: { type: string }
        from: { type: string }
        to: { type: string }

    PackagePlan:
      type: object
      required: [install, upgrade, remove, downgrade]
      properties:
        install: { type: array, items: { $ref: '#/components/schemas/PackageChange' } }
        upgrade: { type: array, items: { $ref: '#/components/schemas/PackageChange' } }
        remove: { type: array, items: { $ref: '#/components/schemas/PackageChange' } }
        downgrade: { type: array, items: { $ref: '#/components/schemas/PackageChange' } }

    SimulateResult:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items:
            type: object
            required: [host_id, host_name, extra_removals]
            properties:
              host_id: { type: string }
              host_name: { type: string }
              skipped: { type: string }
              error:
                type: object
                required: [class, message]
                properties:
                  class: { type: string }
                  message: { type: string }
                  hint: { type: string }
              package_manager: { type: string }
              plan: { $ref: '#/components/schemas/PackagePlan' }
              extra_removals: { type: array, items: { $ref: '#/components/schemas/PackageChange' } }

    FileInfo:
      type: object
      required: [name, path, kind, size, mode, uid, gid, owner, group, mtime]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, dir, symlink, other] }
        size: { type: integer }
        mode: { type: integer, description: Permission bits including setuid/setgid/sticky (e.g. 420 = 0644) }
        uid: { type: integer }
        gid: { type: integer }
        owner: { type: string }
        group: { type: string }
        mtime: { type: string, format: date-time }
        target: { type: string, description: Symlink target as stored in the link }

    FileCaps:
      type: object
      required: [transport, elevated, allowed_paths, root_equivalent]
      properties:
        transport: { type: string, description: 'sftp (login user), ssh-sudo (elevated), later agent' }
        elevated: { type: boolean }
        allowed_paths: { type: [array, 'null'], items: { type: string }, description: 'null: unrestricted (bounded by the account)' }
        root_equivalent: { type: boolean, description: The session can write anywhere as root }

    FileListing:
      type: object
      required: [path, requested, parent, entries, caps]
      properties:
        path: { type: string, description: Real path of the directory }
        requested: { type: string }
        parent: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/FileInfo' } }
        caps: { $ref: '#/components/schemas/FileCaps' }

    FileWriteResult:
      type: object
      required: [path, sha256, info]
      properties:
        path: { type: string }
        sha256: { type: string }
        info: { $ref: '#/components/schemas/FileInfo' }

    TextFile:
      type: object
      required: [path, content, sha256, info]
      properties:
        path: { type: string }
        content: { type: string }
        sha256: { type: string }
        info: { $ref: '#/components/schemas/FileInfo' }

    FileChangeRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        to: { type: string, description: rename/move destination }
        mode: { type: string, description: 'octal, e.g. "0644" (mkdir, chmod)' }
        owner: { type: string }
        group: { type: string }
        recursive: { type: boolean, description: delete a directory tree }
        elevated: { type: boolean }

    Artifact:
      type: object
      required: [sha256, size, name, is_text, created_at]
      properties:
        sha256: { type: string }
        size: { type: integer }
        name: { type: string }
        is_text: { type: boolean }
        created_at: { type: string, format: date-time }

    FileDeployOp:
      type: object
      required: [type, path]
      additionalProperties: false
      description: |
        Deploy a stored artifact: stage, validate, keep the previous version, install atomically,
        verify, optionally reload/restart a service. Rollback fields are set by the controller.
      properties:
        type: { type: string, enum: [file_deploy] }
        artifact: { type: string, description: SHA-256 of an uploaded artifact }
        path: { type: string }
        overwrite: { type: string, enum: [replace, create_only], default: replace }
        owner: { type: string }
        group: { type: string }
        mode: { type: string, description: 'octal; empty keeps the current mode (0644 for new files)' }
        elevated: { type: boolean }
        validate: { type: string, description: 'Command run on the staged file before install; {path} is replaced by its path' }
        service:
          type: object
          required: [name, action]
          properties:
            name: { type: string }
            action: { type: string, enum: [reload, restart] }
        timeout_s: { type: integer, minimum: 1, maximum: 86400, default: 600 }
        when: { $ref: '#/components/schemas/When' }
        rollback_of: { type: string }
        remove: { type: boolean }
        expect_current: { type: string }

    FileMeta:
      type: object
      properties:
        owner: { type: string }
        group: { type: string }
        mode: { type: string }
        size: { type: integer }

    FileDeployPreview:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items:
            type: object
            required: [host_id, host_name]
            properties:
              host_id: { type: string }
              host_name: { type: string }
              skipped: { type: string }
              error:
                type: object
                required: [class, message]
                properties:
                  class: { type: string }
                  message: { type: string }
                  hint: { type: string }
              preview:
                type: object
                required: [state, desired]
                properties:
                  state: { type: string, enum: [create, identical, replace, metadata, keep, remove] }
                  current:
                    type: object
                    properties:
                      exists: { type: boolean }
                      sha256: { type: string }
                      owner: { type: string }
                      group: { type: string }
                      mode: { type: string }
                      size: { type: integer }
                  desired: { $ref: '#/components/schemas/FileMeta' }
                  diff: { type: string }
                  diff_note: { type: string }

    FileDeployment:
      type: object
      required: [id, host_id, host_name, path, kind, outcome, before, after, validation, service, created_at, can_rollback]
      properties:
        id: { type: string }
        job_id: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [deploy, rollback] }
        rollback_of: { type: string }
        outcome: { type: string, enum: [installed, unchanged, removed, validation_failed, failed] }
        before: { type: object, additionalProperties: true, description: 'exists, sha256, owner, group, mode, size, kept (content kept for rollback)' }
        after: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        service: { type: object, additionalProperties: true }
        error: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        can_rollback: { type: boolean }
        diff: { type: string }
        diff_note: { type: string }

    FwSettings:
      type: object
      required: [internal_ranges, default_timeout_s]
      properties:
        internal_ranges: { type: array, items: { type: string } }
        default_timeout_s: { type: integer }
    FwEntry:
      type: object
      required: [protocol]
      properties:
        protocol: { type: string, enum: [tcp, udp, icmp, icmpv6] }
        ports: { type: string, description: '"53", "8000-8010", "80,443"' }
        icmp_type: { type: string }
    FwServiceInput:
      type: object
      required: [name, entries]
      properties:
        name: { type: string }
        description: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/FwEntry' } }
    FwService:
      type: object
      required: [name, description, builtin, entries]
      properties:
        id: { type: string, description: Custom services only. }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
        entries: { type: array, items: { $ref: '#/components/schemas/FwEntry' } }
    FwGroup:
      type: object
      required: [id, name, rollback_timeout_s]
      properties:
        id: { type: string }
        name: { type: string }
        rollback_timeout_s: { type: integer }
    FwSelector:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [host, group, network, internet, internal, any, cidr] }
        id: { type: string }
        cidr: { type: string }
    FwPolicyInput:
      type: object
      required: [name, from, to, services]
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        action: { type: string, enum: [allow, deny] }
        from: { type: array, items: { $ref: '#/components/schemas/FwSelector' } }
        to: { type: array, items: { $ref: '#/components/schemas/FwSelector' } }
        services: { type: array, items: { type: string } }
        position: { type: integer, description: Evaluation order (0 appends). Denies win over allows regardless of order. }
    FwPolicy:
      type: object
      required: [id, name, description, enabled, action, from, to, services, position, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        action: { type: string, enum: [allow, deny] }
        from: { type: array, items: { $ref: '#/components/schemas/FwSelector' } }
        to: { type: array, items: { $ref: '#/components/schemas/FwSelector' } }
        services: { type: array, items: { type: string } }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FwHostConfig:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [off, monitor, guided, enforce] }
        outbound: { type: string, enum: [allow, restrict] }
        rollback_timeout_s: { type: integer, description: '0 inherits the group or default timeout' }
    FwHostSummary:
      type: object
      required: [host_id, host_name, mode, outbound, transport, learning, checked, supported, enforced, revision, in_sync, status, conflicts]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        mode: { type: string, enum: [off, monitor, guided, enforce] }
        outbound: { type: string }
        transport: { type: string, enum: [agent, ssh, blocked, none] }
        learning: { type: string, enum: [continuous, snapshot, 'off'] }
        checked: { type: boolean }
        supported: { type: [boolean, 'null'] }
        reason: { type: string }
        enforced: { type: boolean }
        revision: { type: integer }
        in_sync: { type: boolean }
        status: { type: string, enum: [not_enforced, in_sync, changes_pending, sets_pending, drift, pending_transaction, conflicts] }
        drift: { type: string }
        conflicts: { type: integer }
        pending_transaction_id: { type: string }
    FwPropagation:
      type: object
      required: [enforced, current, stale, rules_changed]
      properties:
        enforced: { type: integer }
        current: { type: integer }
        stale: { type: array, items: { type: string } }
        rules_changed: { type: array, items: { type: string } }
    FwReason:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [base, management, policy, default] }
        policy_id: { type: string }
        policy_name: { type: string }
        text: { type: string }
    FwAllowance:
      type: object
      required: [direction, verdict, service, peer, family, reason]
      properties:
        direction: { type: string, enum: [in, out] }
        verdict: { type: string, enum: [accept, drop] }
        service: { type: string }
        peer: { type: string }
        members: { type: array, items: { type: string } }
        family: { type: integer }
        reason: { $ref: '#/components/schemas/FwReason' }
    FwConflict:
      type: object
      required: [policy_id, policy_name, message]
      properties:
        policy_id: { type: string }
        policy_name: { type: string }
        message: { type: string }
    FwSet:
      type: object
      required: [name, family, dynamic, elements, label]
      properties:
        name: { type: string }
        family: { type: integer }
        dynamic: { type: boolean }
        elements: { type: array, items: { type: string } }
        label: { type: string }
        hosts: { type: array, items: { type: string } }
    FwHostPolicy:
      type: object
      required: [host_id, sets]
      properties:
        host_id: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true }
        sets: { type: array, items: { $ref: '#/components/schemas/FwSet' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/FwConflict' } }
        overrode: { type: array, items: { $ref: '#/components/schemas/FwConflict' } }
        warnings: { type: array, items: { type: string } }
    FwEnv:
      type: object
      properties:
        root: { type: boolean }
        systemd: { type: boolean }
        nft: { type: string }
        nft_version: { type: string }
        missing_tools: { type: array, items: { type: string } }
        services: { type: object, additionalProperties: { type: string } }
        ufw_status: { type: string }
        docker: { type: boolean }
        tailscale: { type: boolean }
        legacy_iptables_rules: { type: integer }
        distro_conf_flushes: { type: boolean }
        resolvers: { type: array, items: { type: string } }
        tool_version: { type: string }
        tables:
          type: array
          items:
            type: object
            properties:
              family: { type: string }
              name: { type: string }
              owner: { type: string }
              rules: { type: integer }
              sets: { type: integer }
              chains: { type: array, items: { type: object, additionalProperties: true } }
        drool_table: { type: boolean }
        ruleset_error: { type: string }
    FwEligibility:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        detected: { type: array, items: { type: string } }
    FwApplied:
      type: object
      required: [enforced, revision, rules_hash, sets_hash, override_mgmt, sets_generation, sets_generation_applied, rules_changed, sets_pending]
      properties:
        enforced: { type: boolean }
        revision: { type: integer }
        rules_hash: { type: string }
        sets_hash: { type: string }
        override_mgmt: { type: boolean }
        sets_generation: { type: integer }
        sets_generation_applied: { type: integer }
        sets_error: { type: string }
        drift: { type: string }
        status_at: { type: string, format: date-time }
        rules_changed: { type: boolean }
        sets_pending: { type: boolean }
    FwPlan:
      type: object
      required: [host_id, host_name, config, rollback_timeout_s, rollback_timeout_from, policy, rendered, applied, transport, learning, explain, changes_added, changes_removed, summary]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        config: { $ref: '#/components/schemas/FwHostConfig' }
        rollback_timeout_s: { type: integer }
        rollback_timeout_from: { type: string }
        policy: { $ref: '#/components/schemas/FwHostPolicy' }
        rendered:
          type: object
          required: [full, full_hash, rules_hash, sets_hash]
          description: The generated nftables policy (advanced diagnostics).
          properties:
            full: { type: string }
            full_hash: { type: string }
            rules_hash: { type: string }
            sets_hash: { type: string }
        management_warnings: { type: array, items: { type: string } }
        environment: { $ref: '#/components/schemas/FwEnv' }
        eligibility: { $ref: '#/components/schemas/FwEligibility' }
        environment_checked_at: { type: string, format: date-time }
        applied: { $ref: '#/components/schemas/FwApplied' }
        pending_transaction: { $ref: '#/components/schemas/FwTransaction' }
        transport: { type: string }
        learning: { type: string }
        explain: { type: array, items: { $ref: '#/components/schemas/FwAllowance' } }
        changes_added: { type: array, items: { type: string }, description: Allowances and denies the desired policy adds to what is committed. }
        changes_removed: { type: array, items: { type: string } }
        summary: { $ref: '#/components/schemas/FwHostSummary' }
    FwTransaction:
      type: object
      required: [id, host_id, kind, state, transport, epoch, revision, candidate_hash, timeout_s, measured_ms, override_mgmt, override_timeout, allow_drift, detail, steps, created_at, updated_at]
      properties:
        id: { type: string }
        host_id: { type: string }
        job_id: { type: string }
        kind: { type: string, enum: [apply, remove] }
        state: { type: string, enum: [preparing, pending, committed, rolled_back, failed, unknown] }
        transport: { type: string }
        epoch: { type: string }
        revision: { type: integer }
        previous_hash: { type: string }
        candidate_hash: { type: string }
        rules_hash: { type: string }
        timeout_s: { type: integer }
        deadline: { type: string, format: date-time }
        measured_ms: { type: integer }
        override_mgmt: { type: boolean }
        override_timeout: { type: boolean }
        allow_drift: { type: boolean }
        detail: { type: string }
        error_class: { type: string }
        steps: { type: array, items: { type: object, required: [at, text], properties: { at: { type: string }, text: { type: string } } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        candidate: { type: string }
    NetGeo:
      type: object
      description: Local GeoIP/ASN enrichment of a public address. Context, not a verdict; may be inaccurate or stale.
      properties:
        country_code: { type: string }
        country: { type: string }
        asn: { type: integer }
        org: { type: string }
    NetHostRef:
      type: object
      required: [id, name, groups]
      properties:
        id: { type: string }
        name: { type: string }
        groups: { type: array, items: { type: string } }
    NetCorrelation:
      type: object
      description: The firewall compiler's view of a flow, against the desired policy and, on enforced hosts with unapplied changes, the applied one.
      required: [status, verdict, would_deny, reason_kind, reason, enforcement, notes]
      properties:
        status: { type: string, enum: [management, covered, unclassified, denied] }
        verdict: { type: string }
        would_deny: { type: boolean }
        reason_kind: { type: string }
        reason: { type: string }
        policy_id: { type: string }
        policy_name: { type: string }
        rule: { type: string }
        enforcement: { type: string, enum: [unmanaged, monitor, guided, enforce_pending, enforced] }
        applied_verdict: { type: string }
        notes: { type: array, items: { type: string } }
    NetFlow:
      type: object
      required: [id, host, direction, protocol, local_ip, local_port, remote_ip, remote_port, port, service, process, source, count, first_seen, last_seen, scope, peer_host, geo, policy]
      properties:
        id: { type: integer }
        host: { $ref: '#/components/schemas/NetHostRef' }
        direction: { type: string, enum: [in, out] }
        protocol: { type: string, enum: [tcp, udp] }
        local_ip: { type: string }
        local_port: { type: integer }
        remote_ip: { type: string }
        remote_port: { type: integer }
        port: { type: integer, description: The service port. }
        service: { type: string }
        process: { type: string, description: Empty when unknown (never guessed). }
        pid: { type: integer }
        source: { type: string, enum: [conntrack, sockets, snapshot] }
        count: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        scope: { type: string, enum: [internal, public, special] }
        scope_range: { type: string }
        peer_host: { oneOf: [{ $ref: '#/components/schemas/NetHostRef' }, { type: 'null' }] }
        peer_network: { type: string }
        geo: { oneOf: [{ $ref: '#/components/schemas/NetGeo' }, { type: 'null' }] }
        peer_first_seen: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/NetCorrelation' }
    NetFlowPage:
      type: object
      required: [items, total, scanned, truncated]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NetFlow' } }
        next_cursor: { type: string }
        total: { type: [integer, 'null'], description: Known when every filter ran in the database. }
        scanned: { type: integer }
        truncated: { type: boolean }
    NetCollection:
      type: object
      required: [mode, source, label, detail, agent, enabled, events_lost, dropped, forwarded]
      properties:
        mode: { type: string, enum: [continuous, snapshot, none] }
        source: { type: string }
        label: { type: string }
        detail: { type: string }
        agent: { type: boolean }
        enabled: { type: boolean }
        sample_seconds: { type: integer }
        reported_at: { type: string, format: date-time }
        snapshot_at: { type: string, format: date-time }
        events_lost: { type: integer }
        dropped: { type: integer }
        forwarded: { type: integer }
    NetHostFirewall:
      type: object
      required: [mode, enforcement, outbound, rules_changed, sets_pending, drift]
      properties:
        mode: { type: string }
        enforcement: { type: string }
        outbound: { type: string }
        rules_changed: { type: boolean }
        sets_pending: { type: boolean }
        drift: { type: boolean }
    NetDraftSuggestion:
      type: object
      required: [title, rule]
      properties:
        title: { type: string }
        rule: { $ref: '#/components/schemas/FwRule' }
        new_service: { type: object, required: [name, description, entries], properties: { name: { type: string }, description: { type: string }, entries: { type: array, items: { $ref: '#/components/schemas/FwEntry' } } } }
    NetFlowDetail:
      allOf:
        - { $ref: '#/components/schemas/NetFlow' }
        - type: object
          required: [firewall, collection, suggestion, related]
          properties:
            fleet_first_seen: { type: string, format: date-time }
            firewall: { $ref: '#/components/schemas/NetHostFirewall' }
            collection: { $ref: '#/components/schemas/NetCollection' }
            suggestion: { oneOf: [{ $ref: '#/components/schemas/NetDraftSuggestion' }, { type: 'null' }] }
            related: { type: array, items: { $ref: '#/components/schemas/NetFlow' } }
    NetCounts:
      type: object
      required: [flows, inbound, outbound, internal, external, unclassified, denied, new_external_24h]
      properties:
        flows: { type: integer }
        inbound: { type: integer }
        outbound: { type: integer }
        internal: { type: integer }
        external: { type: integer }
        unclassified: { type: integer }
        denied: { type: integer }
        new_external_24h: { type: integer }
    NetListening:
      type: object
      required: [protocol, address, port, process, service, exposure, flows, peers]
      properties:
        protocol: { type: string }
        address: { type: string }
        port: { type: integer }
        process: { type: string }
        service: { type: string }
        exposure: { type: string }
        flows: { type: integer }
        peers: { type: integer }
    NetHost:
      type: object
      required: [host, collection, firewall, listening, counts, enrichment]
      properties:
        host: { $ref: '#/components/schemas/NetHostRef' }
        collection: { $ref: '#/components/schemas/NetCollection' }
        firewall: { $ref: '#/components/schemas/NetHostFirewall' }
        listening: { type: array, items: { $ref: '#/components/schemas/NetListening' } }
        listening_at: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/NetCounts' }
        enrichment: { type: boolean }
    NetSettings:
      type: object
      required: [collection, retention_days, max_flows_per_host, enrichment]
      properties:
        collection: { type: string, enum: [all, firewall, 'off'], description: Which agent hosts collect continuously. SSH hosts only get snapshots. }
        retention_days: { type: integer, minimum: 1, maximum: 365 }
        max_flows_per_host: { type: integer, minimum: 100, maximum: 100000 }
        enrichment: { type: boolean, description: Look public addresses up in the local GeoIP/ASN databases. Never online. }
    NetEnrichment:
      type: object
      required: [directory, country, asn, files, cache]
      properties:
        directory: { type: string }
        country: { type: boolean }
        asn: { type: boolean }
        files:
          type: array
          items:
            type: object
            required: [name, size, modified, provides, used]
            properties:
              name: { type: string }
              size: { type: integer }
              modified: { type: string, format: date-time }
              database_type: { type: string }
              build_date: { type: string }
              provides: { type: array, items: { type: string } }
              used: { type: array, items: { type: string } }
              error: { type: string }
        loaded_at: { type: string, format: date-time }
        error: { type: string }
        cache: { type: object, required: [entries, max, hits, misses], properties: { entries: { type: integer }, max: { type: integer }, hits: { type: integer }, misses: { type: integer } } }
    NetSettingsView:
      allOf:
        - { $ref: '#/components/schemas/NetSettings' }
        - type: object
          required: [enrichment_status]
          properties:
            enrichment_status: { $ref: '#/components/schemas/NetEnrichment' }
    NetPrune:
      type: object
      required: [expired, trimmed, rows]
      properties:
        at: { type: string, format: date-time }
        expired: { type: integer }
        trimmed: { type: integer }
        rows: { type: integer }
        error: { type: string }
    NetSummary:
      type: object
      required: [counts, hosts, enrichment, settings, last_prune]
      properties:
        counts: { $ref: '#/components/schemas/NetCounts' }
        hosts:
          type: object
          required: [total, conntrack, sockets, snapshot, no_snapshot, 'off']
          properties: { total: { type: integer }, conntrack: { type: integer }, sockets: { type: integer }, snapshot: { type: integer }, no_snapshot: { type: integer }, 'off': { type: integer } }
        enrichment: { type: boolean }
        settings: { $ref: '#/components/schemas/NetSettings' }
        last_prune: { $ref: '#/components/schemas/NetPrune' }
    NetFacet:
      type: object
      required: [value, label, count]
      properties: { value: { type: string }, label: { type: string }, count: { type: integer } }
    NetFacets:
      type: object
      required: [hosts, groups, processes, ports, countries, networks, services, partial]
      properties:
        hosts: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        groups: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        processes: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        ports: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        countries: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        networks: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        services: { type: array, items: { $ref: '#/components/schemas/NetFacet' } }
        partial: { type: boolean }
    NetTopoNode:
      type: object
      required: [key, kind, label, detail, members, member_total]
      properties:
        key: { type: string }
        kind: { type: string, enum: [asn, ip, more, internal, internet, special] }
        label: { type: string }
        detail: { type: string }
        members: { type: array, items: { type: object, required: [ip, flows], properties: { ip: { type: string }, country: { type: string }, flows: { type: integer } } } }
        member_total: { type: integer }
        parent: { type: string }
    NetTopoEdge:
      type: object
      required: [id, source, target, services, count, flows, status, worst, would_deny, processes, first_seen, last_seen, flow_ids]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        services: { type: array, items: { type: object, required: [protocol, port, service, count], properties: { protocol: { type: string }, port: { type: integer }, service: { type: string }, count: { type: integer } } } }
        count: { type: integer }
        flows: { type: integer }
        status: { type: object, additionalProperties: { type: integer } }
        worst: { type: string, enum: [management, covered, unclassified, denied] }
        would_deny: { type: integer }
        processes: { type: array, items: { type: string } }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        flow_ids: { type: array, items: { type: integer } }
    NetTopology:
      type: object
      required: [nodes, edges, considered, truncated, collapsed]
      properties:
        nodes: { type: array, items: { $ref: '#/components/schemas/NetTopoNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/NetTopoEdge' } }
        considered: { type: integer }
        truncated: { type: boolean }
        collapsed: { type: integer }
    FwObservation:
      type: object
      required: [direction, protocol, port, peer, source, count, first_seen, last_seen, classified, verdict, reason]
      properties:
        direction: { type: string, enum: [in, out] }
        protocol: { type: string }
        port: { type: integer }
        peer: { type: string }
        peer_host_id: { type: string }
        peer_host: { type: string }
        service: { type: string }
        process: { type: string }
        source: { type: string, enum: [conntrack, sockets, snapshot] }
        count: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        classified: { type: boolean }
        verdict: { type: string }
        reason: { type: string }
    FwSuggestion:
      type: object
      required: [title, policy, count, peers]
      properties:
        title: { type: string }
        policy: { $ref: '#/components/schemas/FwPolicyInput' }
        new_service: { $ref: '#/components/schemas/FwServiceInput' }
        count: { type: integer }
        peers: { type: array, items: { type: string } }
    FwSimRequest:
      type: object
      required: [protocol, port]
      properties:
        from_host: { type: string }
        from_address: { type: string }
        to_host: { type: string }
        to_address: { type: string }
        protocol: { type: string, enum: [tcp, udp] }
        port: { type: integer }
        document: { $ref: '#/components/schemas/FwDocument', description: 'A Firewall Designer draft to simulate instead of the stored policy.' }
        yaml: { type: string, description: A draft in YAML form. }
    FwDocument:
      type: object
      description: >-
        The canonical firewall model. References in from/to are host:NAME, group:NAME, network:NAME, cidr:PREFIX, internet,
        internal or any. Built-in services are implicit; services lists custom ones.
      required: [networks, groups, services, policy]
      properties:
        networks:
          type: array
          items: { type: object, required: [name, description, cidrs], properties: { name: { type: string }, description: { type: string }, cidrs: { type: array, items: { type: string } } } }
        groups:
          type: array
          items: { type: object, required: [name, description, members], properties: { name: { type: string }, description: { type: string }, members: { type: array, items: { type: string }, description: Host names. } } }
        services:
          type: array
          items: { type: object, required: [name, description, entries], properties: { name: { type: string }, description: { type: string }, entries: { type: array, items: { $ref: '#/components/schemas/FwEntry' } } } }
        policy:
          type: array
          items: { $ref: '#/components/schemas/FwRule' }
    FwRule:
      type: object
      required: [name, description, enabled, action, from, to, services]
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        action: { type: string, enum: [allow, deny] }
        from: { type: array, items: { type: string } }
        to: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
    FwDocumentView:
      type: object
      required: [document, yaml, revision]
      properties:
        document: { $ref: '#/components/schemas/FwDocument' }
        yaml: { type: string }
        revision: { type: string }
    FwDocumentInput:
      type: object
      description: A draft as a document or as YAML (exactly one).
      properties:
        document: { $ref: '#/components/schemas/FwDocument' }
        yaml: { type: string }
    FwDocumentSave:
      allOf:
        - { $ref: '#/components/schemas/FwDocumentInput' }
        - type: object
          required: [revision]
          properties:
            revision: { type: string }
    FwDocumentSaved:
      type: object
      required: [document, yaml, revision, summary]
      properties:
        document: { $ref: '#/components/schemas/FwDocument' }
        yaml: { type: string }
        revision: { type: string }
        summary:
          type: object
          required: [networks, groups, services, policies, notices]
          properties:
            networks: { type: array, items: { type: string }, description: '"+name" added, "~name" changed, "-name" removed' }
            groups: { type: array, items: { type: string } }
            services: { type: array, items: { type: string } }
            policies: { type: array, items: { type: string } }
            notices: { type: array, items: { type: string } }
    FwDocProblem:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        line: { type: integer }
        message: { type: string }
    FwHostImpact:
      type: object
      required: [host_id, host_name, mode, enforced, supported, added, new_denies, removed, conflicts]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        mode: { type: string }
        enforced: { type: boolean }
        supported: { type: [boolean, 'null'] }
        refused: { type: string }
        added: { type: array, items: { type: string } }
        new_denies: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
    FwMgmtHop:
      type: object
      required: [from, from_name, to, to_name, protocol, port, status, detail, blocked_by]
      properties:
        from: { type: string, description: Host id or "controller". }
        from_name: { type: string }
        to: { type: string }
        to_name: { type: string }
        protocol: { type: string }
        port: { type: integer }
        status: { type: string, enum: [protected, blocked, unverified] }
        detail: { type: string }
        blocked_by: { type: array, items: { type: string } }
    FwMgmtPath:
      type: object
      required: [host_id, host, kind, mode, hops, blocked, unverified]
      properties:
        host_id: { type: string }
        host: { type: string }
        kind: { type: string, enum: [ssh, agent] }
        mode: { type: string }
        hops: { type: array, items: { $ref: '#/components/schemas/FwMgmtHop' } }
        blocked: { type: boolean }
        unverified: { type: boolean }
    FwDocumentCheck:
      type: object
      required: [document, yaml, valid, problems, notices, changed, revision, impact, management, blockers]
      properties:
        document: { $ref: '#/components/schemas/FwDocument' }
