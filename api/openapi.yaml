    HealthEffectiveCheck:
      type: object
      required: [check, label, category, description, enabled, customized, conflicts, fields]
      properties:
        check: { type: string }
        label: { type: string }
        category: { type: string }
        description: { type: string }
        subject_kind: { type: string }
        info: { type: boolean }
        default_off: { type: boolean }
        enabled: { type: boolean }
        customized: { type: boolean, description: This scope overrides at least one field. }
        conflicts: { type: integer }
        override_id: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/HealthEffectiveField' } }
    HealthSubject:
      type: object
      required: [key, kind, label, identity, strength, present, checks, customized]
      properties:
        key: { type: string, description: 'Stable identity: fsuuid:, mount:, disk:, gpu:, sensor:, iface:, unit:.' }
        kind: { type: string }
        label: { type: string }
        identity: { type: string }
        strength: { type: string, enum: [stable, location, name, weak, ''], description: How stable the identity is (empty for subjects not reported now). }
        present: { type: boolean, description: 'Reported by the host now; false: configured but currently unavailable.' }
        checks: { type: array, items: { type: string } }
        customized: { type: boolean }
        issue_subject: { type: string, description: 'The subject as health issues name it (a mount, a unit, a sensor id, a GPU id).' }
        ref: { type: string, description: 'What the current report calls it (a mount, a sensor id, a disk key, an interface, a unit, gpu:<index>), to find the subject of a row.' }
    HealthSummary:
      type: object
      required: [text, global_fields, group_fields, host_fields, subject_fields, conflicts, using_recommended]
      properties:
        text: { type: string }
        global_fields: { type: integer }
        group_fields: { type: integer }
        host_fields: { type: integer }
        subject_fields: { type: integer }
        conflicts: { type: integer }
        using_recommended: { type: boolean }
    HealthGroup:
      type: object
      required: [group_id, name, priority, hosts, overrides]
      properties:
        group_id: { type: string }
        name: { type: string }
        priority: { type: integer }
        hosts: { type: integer }
        overrides: { type: integer }
    HealthView:
      type: object
      required: [scope, checks]
      properties:
        scope: { type: string, enum: [global, group, host] }
        group_id: { type: string }
        host_id: { type: string }
        subject: { $ref: '#/components/schemas/HealthSubject' }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthEffectiveCheck' } }
        summary: { $ref: '#/components/schemas/HealthSummary' }
        subjects: { type: array, items: { $ref: '#/components/schemas/HealthSubject' } }
        groups: { type: array, items: { $ref: '#/components/schemas/HealthGroup' } }
    HealthOverride:
      type: object
      required: [id, scope, check, fields, updated_at, created_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [global, group, host] }
        group_id: { type: string }
        group_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        check: { type: string }
        subject: { type: string }
        subject_label: { type: string }
        fields: { $ref: '#/components/schemas/HealthFields' }
        updated_by: { type: string }
        updated_at: { type: integer }
        created_at: { type: integer }
    HealthOverrideInput:
      type: object
      required: [scope, check, fields]
      properties:
        scope: { type: string, enum: [global, group, host] }
        group_id: { type: string }
        host_id: { type: string }
        check: { type: string }
        subject: { type: string, description: Host scope only. }
        subject_label: { type: string, description: What to call the subject while it is unavailable. }
        fields: { $ref: '#/components/schemas/HealthFields' }
    HealthPreviewInput:
      allOf:
        - { $ref: '#/components/schemas/HealthOverrideInput' }
        - type: object
          properties:
            priority: { type: integer, description: Preview a group priority change instead (with group_id). }
    HealthPreview:
      type: object
      required: [check, affected, in_scope, above_before, above_after, would_close, would_stay, disables, hosts, summary]
      properties:
        check: { type: string }
        affected: { type: integer }
        in_scope: { type: integer }
        above_before: { type: integer }
        above_after: { type: integer }
        would_close: { type: integer }
        would_stay: { type: integer }
        disables: { type: boolean }
        summary: { type: string }
        hosts:
          type: array
          items:
            type: object
            required: [host_id, name, effect]
            properties:
              host_id: { type: string }
              name: { type: string }
              effect: { type: string }
              closes: { type: array, items: { type: string } }
              changes: { type: array, items: { type: string } }
    MonPrune:
      type: object
      required: [at, points, events, service_events, issues, ms]
      properties: { at: { type: string }, points: { type: integer }, events: { type: integer }, service_events: { type: integer }, issues: { type: integer }, ms: { type: integer } }
    MonSettingsView:
      type: object
      required: [settings, checks, helpers, last_prune]
      properties:
        settings: { $ref: '#/components/schemas/MonSettings' }
        checks: { type: array, items: { type: string } }
        helpers: { type: array, items: { type: string } }
        last_prune: { $ref: '#/components/schemas/MonPrune' }
    MonFleetHost:
      type: object
      required: [host_id, name, source, mode, updated_at, stale, services, failed_services, storage, issues, worst, reduced, helpers, categories]
      properties:
        host_id: { type: string }
        name: { type: string }
        source: { type: string }
        mode: { type: string, enum: [continuous, polled, none] }
        updated_at: { type: integer }
        stale: { type: boolean }
        cpu: { type: number }
        memory: { type: number }
        disk: { type: number }
        disk_mount: { type: string }
        temperature: { type: number }
        services: { type: integer }
        failed_services: { type: integer }
        storage: { type: string }
        issues: { type: integer }
        worst: { type: string, enum: [ok, info, warning, critical] }
        reduced: { type: boolean }
        helpers: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
    MonFleet:
      type: object
      required: [hosts, monitored, agent, ssh, counts, rows, total, issues, generated_at]
      properties:
        hosts: { type: integer }
        monitored: { type: integer }
        agent: { type: integer }
        ssh: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        rows: { type: array, items: { $ref: '#/components/schemas/MonFleetHost' } }
        total: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/MonIssue' } }
        generated_at: { type: integer }
    MonHelpersRequest:
      type: object
      required: [host_ids]
      properties:
        host_ids: { type: array, items: { type: string }, maxItems: 500 }
        packages: { type: array, items: { type: string, enum: [smartmontools, nvme-cli, lm-sensors] } }
    MonHelperPlanHost:
      type: object
      required: [host_id, name, helpers, packages]
      properties:
        host_id: { type: string }
        name: { type: string }
        helpers: { type: array, items: { type: string } }
        packages: { type: array, items: { type: string } }
        manager: { type: string }
        skip: { type: string }
    MonHelperPreview:
      type: object
      required: [hosts, counts, plan, installs]
      properties:
        hosts: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        plan: { type: array, items: { $ref: '#/components/schemas/MonHelperPlanHost' } }
        installs: { type: integer }
    MonInstallResult:
      type: object
      required: [jobs, preview]
      properties: { jobs: { type: array, items: { type: string } }, preview: { $ref: '#/components/schemas/MonHelperPreview' } }
    MonApproval:
      type: object
      required: [id, scope, package, created_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [global, group] }
        group_id: { type: string }
        group_name: { type: string }
        package: { type: string }
        created_by: { type: string }
        created_at: { type: integer }
    MonApprovalInput:
      type: object
      required: [scope, package]
      properties:
        scope: { type: string, enum: [global, group] }
        group_id: { type: string }
        package: { type: string, enum: [smartmontools, nvme-cli, lm-sensors] }
    ConversionRequest:
      type: object
      required: [host_ids]
      properties:
        host_ids: { type: array, items: { type: string }, maxItems: 500 }
        preset: { type: string, enum: [monitor, managed, full] }
        canary: { type: integer, minimum: 1, maximum: 50 }
        batch_size: { type: integer, minimum: 1, maximum: 50 }
        max_failures: { type: integer, minimum: 1, maximum: 100 }
    ConversionHost:
      type: object
      required: [host_id, name, status]
      properties:
        host_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [compatible, agent, unsupported, unreachable] }
        reason: { type: string }
        arch: { type: string }
    ConversionPreview:
      type: object
      required: [selected, counts, hosts, binary]
      properties:
        selected: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        hosts: { type: array, items: { $ref: '#/components/schemas/ConversionHost' } }
        binary: { type: object, additionalProperties: { type: string } }
    Alert:
      type: object
      description: One alert occurrence (one activation of an M11 health issue).
      required: [id, host_id, host_name, issue_id, check, subject, category, severity, peak_severity, state, title, detail, issue_started_at, opened_at, duration_ms, suppressed, ever_suppressed, notification]
      properties:
        id: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        issue_id: { type: string }
        check: { type: string }
        subject: { type: string }
        category: { type: string }
        severity: { type: string, enum: [warning, critical] }
        peak_severity: { type: string, enum: [warning, critical] }
        state: { type: string, enum: [active, acknowledged, resolved] }
        title: { type: string }
        detail: { type: string }
        value: { type: number }
        value_text: { type: string }
        observed_at: { type: integer, description: When the condition was first observed, if monitoring knows. }
        issue_started_at: { type: integer }
        opened_at: { type: integer }
        acknowledgement: { $ref: '#/components/schemas/Acknowledgement' }
        resolved_at: { type: integer }
        duration_ms: { type: integer }
        suppressed: { type: boolean, description: Suppressed by maintenance now. }
        suppressed_by: { $ref: '#/components/schemas/MaintenanceRef' }
        ever_suppressed: { type: boolean }
        notify_after: { type: integer, description: Opening notification due (after maintenance ended). }
        notification: { $ref: '#/components/schemas/NotificationState' }
        resolution:
          type: string
          enum: [recovered, disabled, reconfigured, gone]
          description: >-
            Why a resolved alert closed. Only `recovered` is a recovery; `disabled` (its check was turned off),
            `reconfigured` (a threshold changed and the current state no longer qualifies) and `gone` (the subject
            disappeared) close it with a "cleared" notification, never "recovered".
        resolution_note: { type: string }
    Acknowledgement:
      type: object
      required: [by, at]
      properties:
        by: { type: string }
        at: { type: integer }
        note: { type: string }
    MaintenanceRef:
      type: object
      required: [id, reason]
      properties:
        id: { type: string }
        reason: { type: string }
        ends_at: { type: integer }
    NotificationState:
      type: object
      required: [status, delivered, pending, failed, cancelled, retrying]
      properties:
        status: { type: string, enum: [none, suppressed, pending, delivered, partial, failing, failed] }
        delivered: { type: integer }
        pending: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        retrying: { type: boolean }
    AlertSummary:
      type: object
      required: [active, active_critical, acknowledged, critical, warning, suppressed, hosts, maintenance]
      properties:
        active: { type: integer, description: Open and unacknowledged. }
        active_critical: { type: integer, description: Open, unacknowledged and critical. }
        acknowledged: { type: integer }
        critical: { type: integer }
        warning: { type: integer }
        suppressed: { type: integer }
        hosts:
          type: object
          additionalProperties:
            type: object
            required: [critical, warning, acknowledged, suppressed]
            properties: { critical: { type: integer }, warning: { type: integer }, acknowledged: { type: integer }, suppressed: { type: integer } }
        maintenance: { type: object, additionalProperties: { $ref: '#/components/schemas/MaintenanceRef' } }
        destinations: { type: object, required: [configured, failing], properties: { configured: { type: integer }, failing: { type: integer } } }
    AlertDetail:
      type: object
      required: [alert, timeline, deliveries, occurrences]
      properties:
        alert: { $ref: '#/components/schemas/Alert' }
        timeline: { type: array, items: { $ref: '#/components/schemas/AlertTimelineEntry' } }
        deliveries: { type: array, items: { $ref: '#/components/schemas/Delivery' } }
        issue: { $ref: '#/components/schemas/AlertSourceIssue' }
        occurrences:
          type: array
          items:
            type: object
            required: [id, state, severity, opened_at]
            properties: { id: { type: string }, state: { type: string }, severity: { type: string }, opened_at: { type: integer }, resolved_at: { type: integer } }
    AlertTimelineEntry:
      type: object
      required: [ts, kind, text]
      properties:
        ts: { type: integer }
        kind: { type: string }
        text: { type: string }
        actor: { type: string }
    AlertSourceIssue:
      type: object
      required: [id, state, severity, title, detail, started_at, updated_at]
      properties:
        id: { type: string }
        state: { type: string }
        severity: { type: string }
        title: { type: string }
        detail: { type: string }
        value: { type: number }
        started_at: { type: integer }
        updated_at: { type: integer }
        resolved_at: { type: integer }
    TimelineEvent:
      type: object
      required: [id, ts, kind, severity, title]
      properties:
        id: { type: integer }
        ts: { type: integer }
        kind: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        host_id: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        title: { type: string }
    WorkflowInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        steps: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Operation' } }
        strategy: { $ref: '#/components/schemas/Strategy' }
    Workflow:
      type: object
      required: [id, name, description, latest_revision, steps, strategy, archived, created_at, updated_at, schedules, outdated_schedules, summary]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        latest_revision: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        strategy: { $ref: '#/components/schemas/Strategy' }
        archived: { type: boolean }
        created_at: { type: integer }
        updated_at: { type: integer }
        schedules: { type: integer, description: Schedules using it }
        outdated_schedules: { type: integer, description: Schedules pinned to an older revision }
        summary: { type: array, items: { type: string } }
        revisions:
          type: array
          items: { type: object, required: [revision, steps, created_by, created_at], properties: { revision: { type: integer }, steps: { type: integer }, created_by: { type: string }, created_at: { type: integer } } }
    WorkflowRevision:
      type: object
      required: [revision, name, description, steps, strategy, created_by, created_at]
      properties:
        revision: { type: integer }
        name: { type: string }
        description: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        strategy: { $ref: '#/components/schemas/Strategy' }
        created_by: { type: string }
        created_at: { type: integer }
    WorkflowTemplate:
      type: object
      required: [key, name, description, steps, strategy]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        strategy: { $ref: '#/components/schemas/Strategy' }
        fill: { type: array, items: { type: string }, description: Fields to complete before saving }
    Recurrence:
      type: object
      description: >-
        When a schedule runs, in its time zone (no cron). Wall-clock kinds (once, daily, weekly, monthly) follow the
        local clock: a time that doesn't exist (spring forward) runs at the first valid time after the gap; a time
        that happens twice (fall back) runs once, at its first occurrence. Hourly counts elapsed hours.
      required: [kind]
      properties:
        kind: { type: string, enum: [once, hourly, daily, weekly, monthly] }
        at: { type: string, description: 'once, and hourly''s first run: local "YYYY-MM-DDTHH:MM"' }
        every_hours: { type: integer, minimum: 1, maximum: 168 }
        time: { type: string, description: 'daily, weekly, monthly: local "HH:MM"' }
        weekdays: { type: array, items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] } }
        day_of_month: { type: integer, minimum: 1, maximum: 31, description: Days a month doesn't have mean its last day }
    ScheduleConfig:
      type: object
      required: [recurrence, time_zone, targets]
      properties:
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        time_zone: { type: string, description: 'An explicit IANA zone, e.g. Europe/Berlin (never the controller''s own)' }
        workflow: { type: object, required: [id], properties: { id: { type: string }, revision: { type: integer, description: '0 or absent: the latest when saved' } } }
        steps: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Operation' }, description: An inline job (instead of a workflow) }
        targets: { $ref: '#/components/schemas/TargetSpec' }
        strategy: { $ref: '#/components/schemas/Strategy' }
        missed_policy: { type: string, enum: [skip, run_once], description: 'Recurring: skip what was missed while DROOL was down (default), or run the most recent missed occurrence once' }
        late_limit_minutes: { type: integer, minimum: 0, maximum: 10080, description: 'One-time: don''t start when DROOL returns more than this late (0: no limit)' }
        overlap_policy: { type: string, enum: [skip, queue_one], description: 'While the previous run is active: skip (default) or queue one' }
        window_id: { type: string, description: 'A recurring maintenance window this job runs inside (it runs only while that window is active, and may run on the hosts it covers)' }
        duration_minutes: { type: integer, minimum: 1, maximum: 10080, description: Maintenance windows }
        reason: { type: string, maxLength: 200, description: Maintenance windows }
    ScheduleInput:
      allOf:
        - { $ref: '#/components/schemas/ScheduleConfig' }
        - type: object
          required: [name]
          properties:
            kind: { type: string, enum: [job, maintenance], default: job }
            name: { type: string, maxLength: 100 }
            enabled: { type: boolean }
    Schedule:
      type: object
      required: [id, kind, name, enabled, archived, owner, revision, config, when, workflow_update_available, action, targets_text, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [job, maintenance] }
        name: { type: string }
        enabled: { type: boolean }
        archived: { type: boolean }
        owner: { oneOf: [{ type: 'null' }, { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }], description: 'null: the owner''s account was deleted' }
        revision: { type: integer }
        config: { $ref: '#/components/schemas/ScheduleConfig' }
        when: { type: string }
        next_run_at: { type: integer }
        next_run_local: { type: string }
        next_run_note: { type: string, description: A DST shift of the next run }
        attention: { type: string, description: 'Why it needs attention (empty when fine)' }
        attention_at: { type: integer }
        workflow_name: { type: string }
        workflow_latest: { type: integer }
        workflow_update_available: { type: boolean }
        workflow_archived: { type: boolean }
        window_name: { type: string }
        action: { type: string }
        targets_text: { type: string }
        last_occurrence: { $ref: '#/components/schemas/Occurrence' }
        active_job_id: { type: string }
        active_maintenance_id: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }
        updated_by: { type: string }
    Occurrence:
      type: object
      required: [id, schedule_id, schedule_revision, scheduled_for, manual, status, skipped_hosts, created_at, outcome]
      properties:
        id: { type: string }
        schedule_id: { type: string }
        schedule_revision: { type: integer, description: The schedule configuration that produced it }
        scheduled_for: { type: integer, description: Nominal time (unix ms) }
        manual: { type: boolean }
        status: { type: string, enum: [queued, dispatched, skipped, missed, expired, blocked, failed] }
        reason: { type: string }
        missed_count: { type: integer }
        missed_until: { type: integer }
        dispatched_at: { type: integer }
        job_id: { type: string }
        job_status: { type: string }
        job_counts: { type: object, additionalProperties: { type: integer } }
        job_pause_reason: { type: string }
        maintenance_id: { type: string }
        triggered_by: { type: string }
        skipped_hosts: { type: integer }
        created_at: { type: integer }
        outcome: { type: string }
    NextRun:
      type: object
      required: [at, local]
      properties:
        at: { type: integer }
        local: { type: string }
        note: { type: string }
    SchedulePreview:
      type: object
      required: [kind, when, time_zone, next_runs, targets, waves, concurrency, steps, reboot, verification, policies, notes, warnings]
      properties:
        kind: { type: string }
        when: { type: string }
        time_zone: { type: string }
        next_runs: { type: array, items: { $ref: '#/components/schemas/NextRun' } }
        targets:
          type: array
          items:
            type: object
            required: [id, name, status, wave]
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              warning: { type: string }
              maintenance: { type: string, description: In maintenance now (a scheduled run would skip it) }
              wave: { type: integer }
        waves: { type: array, items: { $ref: '#/components/schemas/RolloutWave' } }
        concurrency: { type: integer }
        failure_threshold: { type: integer }
        steps: { type: array, items: { type: string } }
        reboot: { type: string }
        verification: { type: array, items: { type: string } }
        window:
          type: object
          required: [id, name, inside, note]
          properties: { id: { type: string }, name: { type: string }, next_start: { type: integer }, next_end: { type: integer }, inside: { type: boolean }, note: { type: string } }
        duration: { type: string }
        policies: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    Maintenance:
      type: object
      required: [id, reason, created_by, started_at, active, targets, host_count, suppressing]
      properties:
        id: { type: string }
        reason: { type: string }
        created_by: { type: string }
        started_at: { type: integer }
        ends_at: { type: integer, description: Absent until ended manually. }
        ended_at: { type: integer }
        ended_by: { type: string }
        active: { type: boolean }
        targets:
          type: array
          items: { type: object, required: [kind, id, name], properties: { kind: { type: string, enum: [host, group] }, id: { type: string }, name: { type: string } } }
        host_count: { type: integer }
        suppressing: { type: integer, description: Open alerts it suppresses. }
        schedule_id: { type: string, description: The recurring window (M13 schedule) that started it. }
    MaintenanceInput:
      type: object
      properties:
        host_ids: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        reason: { type: string, maxLength: 200 }
        duration_minutes: { type: integer, minimum: 1, maximum: 43200 }
        until: { type: integer, description: End (unix ms). }
        indefinite: { type: boolean, description: Until ended manually. }
    DestinationConfig:
      type: object
      description: Non-secret settings; which apply depends on the kind.
      properties:
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        from: { type: string }
        to: { type: array, items: { type: string } }
        allow_plaintext: { type: boolean }
        header_name: { type: string }
        url_display: { type: string, readOnly: true }
        timeout_s: { type: integer, minimum: 1, maximum: 30 }
    DestinationSecrets:
      type: object
      description: Write-only secret values. Omitted keeps the stored value; an empty string clears an optional one.
      properties:
        url: { type: string, description: Webhook, Discord or Slack URL. }
        header_value: { type: string, description: Webhook authorization header value. }
        password: { type: string, description: SMTP password. }
    DestinationInput:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        kind: { type: string, enum: [email, webhook, discord, slack] }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/DestinationConfig' }
        secrets: { $ref: '#/components/schemas/DestinationSecrets' }
        notify_for: { type: string, enum: [recommended, custom], description: 'recommended: in the default route (Warning and Critical plus recoveries).' }
    Destination:
      type: object
      required: [id, name, kind, enabled, config, secrets_set, notify_for, routes, health, warnings, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [email, webhook, discord, slack] }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/DestinationConfig' }
        secrets_set: { type: object, required: [url, header_value, password], properties: { url: { type: boolean }, header_value: { type: boolean }, password: { type: boolean } } }
        notify_for: { type: string, enum: [recommended, custom] }
        routes: { type: array, items: { type: string } }
        health:
          type: object
          required: [status, consecutive_failures, queued]
          properties:
            status: { type: string, enum: [ok, failing, unused, disabled] }
            last_success_at: { type: integer }
            last_failure_at: { type: integer }
            last_error: { type: string }
            consecutive_failures: { type: integer }
            failing_since: { type: integer }
            queued: { type: integer }
        last_test: { type: object, required: [at, ok, result], properties: { at: { type: integer }, ok: { type: boolean }, result: { type: string } } }
        warnings: { type: array, items: { type: string } }
        created_at: { type: integer }
        updated_at: { type: integer }
    TestResult:
      type: object
      required: [outcome, category, message, duration_ms, warnings]
      properties:
        outcome: { type: string, enum: [delivered, transient, permanent] }
        category: { type: string, enum: [ok, timeout, tls, auth, rejected, rate_limited, server_error, network, config] }
        status_code: { type: integer }
        message: { type: string }
        ambiguous: { type: boolean }
        duration_ms: { type: integer }
        warnings: { type: array, items: { type: string } }
    Route:
      type: object
      required: [id, name, is_default, enabled, severities, host_ids, group_ids, categories, checks, recovery, reminder_minutes, destination_ids, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        is_default: { type: boolean }
        enabled: { type: boolean }
        severities: { type: array, items: { type: string, enum: [warning, critical] } }
        host_ids: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        checks: { type: array, items: { type: string } }
        recovery: { type: boolean }
        reminder_minutes: { type: integer, description: '0: no reminders (default); otherwise 60 to 10080.' }
        destination_ids: { type: array, items: { type: string } }
        created_at: { type: integer }
        updated_at: { type: integer }
    RouteInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        severities: { type: array, items: { type: string, enum: [warning, critical] } }
        host_ids: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        checks: { type: array, items: { type: string } }
        recovery: { type: boolean }
        reminder_minutes: { type: integer }
        destination_ids: { type: array, items: { type: string } }
    RoutePreview:
      type: object
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            type: object
            required: [id, name, kind, recovery, reminder_minutes]
            properties: { id: { type: string }, name: { type: string }, kind: { type: string }, recovery: { type: boolean }, reminder_minutes: { type: integer } }
    Delivery:
      type: object
      required: [id, destination, destination_kind, kind, status, attempts, created_at, ambiguous]
      properties:
        id: { type: string, description: Sent to webhooks as delivery_id / Idempotency-Key. }
        alert_id: { type: string }
        host_name: { type: string }
        alert_title: { type: string }
        destination_id: { type: string }
        destination: { type: string }
        destination_kind: { type: string }
        kind: { type: string, enum: [opening, escalation, reminder, recovery, cleared], description: '`cleared`: the closing notification of an alert closed by configuration (routed like a recovery).' }
        status: { type: string, enum: [queued, sending, delivered, failed, cancelled] }
        attempts: { type: integer }
        next_attempt_at: { type: integer }
        created_at: { type: integer }
        finished_at: { type: integer }
        last_error: { type: string }
        last_category: { type: string }
        last_status_code: { type: integer }
        ambiguous: { type: boolean, description: An attempt may have reached the receiver without DROOL seeing success; a retry may have delivered it twice. }
        attempt_log:
          type: array
          items:
            type: object
            required: [n, started_at, outcome]
            properties:
              n: { type: integer }
              started_at: { type: integer }
              finished_at: { type: integer }
              outcome: { type: string, enum: [delivered, transient, permanent, interrupted] }
              category: { type: string }
              status_code: { type: integer }
              error: { type: string }
    NotificationSettings:
      type: object
      required: [link_base_url, time_zone, alert_retention_days, delivery_retention_days]
      properties:
        link_base_url: { type: string, description: 'DROOL''s address for "Open in DROOL" links; empty: no links.' }
        time_zone: { type: string, description: IANA name for times in notifications; empty for the controller's. }
        alert_retention_days: { type: integer, minimum: 30, maximum: 730 }
        delivery_retention_days: { type: integer, minimum: 7, maximum: 365 }
    NotificationSettingsView:
      type: object
      required: [settings, kinds]
      properties:
        settings: { $ref: '#/components/schemas/NotificationSettings' }
        kinds: { type: array, items: { type: string } }

    # --- desired state (M14) ---
    DesiredStatus:
      type: string
      enum: [compliant, drift, conflict, unknown, reconciling, failed]
      description: 'drift: observed differs from desired; conflict: equally applicable declarations disagree (no desired value until resolved); unknown: DROOL can''t currently verify it (never "compliant"); reconciling: a corrective job is in progress; failed: the last correction didn''t make it comply.'
    DesiredResource:
      type: object
      description: |
        One typed desired resource — no expressions, nothing executes. service: `name` (a .service unit), `state`
        running|stopped and/or `enabled` (empty fields are not managed; restart/reload are actions, not states). package:
        `name`, `state` installed|absent (versions are not managed). file: `path`, `artifact` (SHA-256 of content in the
        artifact store), optional `owner`/`group`/`mode`, and how it is deployed (`elevated`, `validate` with {path},
        `service` reload/restart after a change), exactly as a file deployment (M6).
      required: [kind]
      properties:
        kind: { type: string, enum: [service, package, file] }
        name: { type: string }
        state: { type: string, enum: [running, stopped, installed, absent] }
        enabled: { type: boolean }
        path: { type: string }
        artifact: { type: string }
        artifact_name: { type: string, description: Display only }
        owner: { type: string }
        group: { type: string }
        mode: { type: string, description: 'Octal, e.g. 0644' }
        elevated: { type: boolean }
        validate: { type: string }
        service:
          type: object
          required: [name, action]
          properties:
            name: { type: string }
            action: { type: string, enum: [reload, restart] }
    DesiredAssignment:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [global, group, host] }
        group_id: { type: string }
        host_id: { type: string }
        name: { type: string, description: The group's or host's name (read-only) }
    BaselineInput:
      type: object
      required: [name, resources, assignments]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string }
        resources: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DesiredResource' } }
        assignments: { type: array, items: { $ref: '#/components/schemas/DesiredAssignment' } }
    DesiredPerson:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    DesiredAuto:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        strategy: { $ref: '#/components/schemas/Strategy' }
        owner: { $ref: '#/components/schemas/DesiredPerson' }
        attention: { type: string, description: Why automatic restore is paused and needs attention }
        attention_at: { type: integer }
    BaselineCounts:
      type: object
      required: [hosts, resources, compliant, drift, conflict, unknown, reconciling, failed, auto_paused]
      properties:
        hosts: { type: integer }
        resources: { type: integer }
        compliant: { type: integer }
        drift: { type: integer }
        conflict: { type: integer }
        unknown: { type: integer }
        reconciling: { type: integer }
        failed: { type: integer }
        auto_paused: { type: integer }
    BaselineRevisionInfo:
      type: object
      required: [revision, created_at, resources, hash]
      properties:
        revision: { type: integer }
        created_by: { type: string }
        created_at: { type: integer }
        resources: { type: integer }
        hash: { type: string }
    Baseline:
      type: object
      required: [id, name, description, revision, resources, assignments, auto, archived, counts, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        revision: { type: integer }
        resources: { type: array, items: { $ref: '#/components/schemas/DesiredResource' } }
        assignments: { type: array, items: { $ref: '#/components/schemas/DesiredAssignment' } }
        auto: { $ref: '#/components/schemas/DesiredAuto' }
        archived: { type: boolean }
        counts: { $ref: '#/components/schemas/BaselineCounts' }
        revisions: { type: array, items: { $ref: '#/components/schemas/BaselineRevisionInfo' } }
        created_at: { type: integer }
        updated_at: { type: integer }
        updated_by: { type: string }
    DesiredCounts:
      type: object
      required: [total, compliant, drift, conflict, unknown, reconciling, failed, auto_paused]
      properties:
        total: { type: integer }
        compliant: { type: integer }
        drift: { type: integer }
        conflict: { type: integer }
        unknown: { type: integer }
        reconciling: { type: integer }
        failed: { type: integer }
        auto_paused: { type: integer }
    DesiredSummary:
      type: object
      required: [hosts, unmanaged, resources, baselines, auto_baselines, auto_paused, reconciling, changed_at]
      properties:
        hosts: { $ref: '#/components/schemas/DesiredCounts' }
        unmanaged: { type: integer, description: Hosts no baseline applies to }
        resources: { $ref: '#/components/schemas/DesiredCounts' }
        baselines: { type: integer }
        auto_baselines: { type: integer, description: Baselines restoring automatically now (switched on and not paused; paused ones are in auto_paused) }
        auto_paused:
          type: array
          items: { type: object, required: [id, name, attention], properties: { id: { type: string }, name: { type: string }, attention: { type: string }, at: { type: integer } } }
        reconciling: { type: integer, description: Corrections in progress }
        changed_at: { type: integer }
        firewall:
          type: object
          description: The firewall's own desired state (managed by Firewall, linked, never merged). With `firewall.read`.
          required: [enforced, drift]
          properties: { enforced: { type: integer }, drift: { type: integer } }
        agents:
          type: object
          description: Hosts whose agent state versions are ahead of or foreign to this controller (resolved on the Agents page). With `agents.read`.
          required: [state_conflicts]
          properties: { state_conflicts: { type: integer } }
    DesiredBaselineRef:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
    DesiredGroupRef:
      type: object
      required: [id, name, priority]
      properties:
        id: { type: string }
        name: { type: string }
        priority: { type: integer }
    DesiredHostRow:
      type: object
      required: [host_id, name, status, counts, baselines, problems, changed_at, in_maintenance, reconciles]
      properties:
        host_id: { type: string }
        name: { type: string }
        status: { type: string, description: 'The most actionable of its resources'' statuses (failed, conflict, drift, reconciling, unknown, compliant)' }
        counts: { $ref: '#/components/schemas/DesiredCounts' }
        baselines: { type: array, items: { $ref: '#/components/schemas/DesiredBaselineRef' } }
        problems: { type: array, items: { type: string }, description: 'The first few resources that differ, in words' }
        unknown: { type: string }
        checked_at: { type: integer }
        changed_at: { type: integer }
        in_maintenance: { type: boolean }
        reconciles: { type: integer }
    DesiredDeclaration:
      type: object
      required: [label, want, level]
      properties:
        label: { type: string }
        want: { type: string }
        level: { type: string, enum: [host, assigned, group, global] }
        baseline: { $ref: '#/components/schemas/DesiredBaselineRef' }
        group: { $ref: '#/components/schemas/DesiredGroupRef' }
    DesiredSource:
      type: object
      description: Where an effective value comes from (computed by the controller; most specific wins; groups by priority; equal priorities that disagree are a conflict).
      required: [level, label, auto]
      properties:
        level: { type: string, enum: [host, assigned, group, global] }
        label: { type: string, description: '"Required by Global baseline Server Defaults", "Inherited from group: Media Servers (baseline …)", "Custom for this host", "Conflict between groups …"' }
        baselines: { type: array, items: { $ref: '#/components/schemas/DesiredBaselineRef' } }
        groups: { type: array, items: { $ref: '#/components/schemas/DesiredGroupRef' } }
        override:
          type: object
          required: [origin, version, updated_at]
          properties:
            origin: { type: string, enum: [accept, manual] }
            note: { type: string }
            version: { type: integer }
            updated_by: { type: string }
            updated_at: { type: integer }
            excluded: { type: boolean }
        competing: { type: array, items: { $ref: '#/components/schemas/DesiredDeclaration' }, description: A conflict's declarations }
        shadowed: { type: array, items: { $ref: '#/components/schemas/DesiredDeclaration' }, description: Less specific declarations this one replaces }
        auto: { type: boolean }
        auto_baseline: { $ref: '#/components/schemas/DesiredBaselineRef' }
    DesiredObservation:
      type: object
      required: [at]
      properties:
        service:
          type: object
          required: [found]
          properties: { found: { type: boolean }, load: { type: string }, active: { type: string }, sub: { type: string }, file_state: { type: string } }
        package:
          type: object
          required: [installed]
          properties: { installed: { type: boolean }, version: { type: string }, manager: { type: string } }
        file:
          type: object
          required: [exists]
          properties:
            exists: { type: boolean }
            type: { type: string, enum: [file, symlink, dir, other] }
            target: { type: string }
            sha256: { type: string }
            size: { type: integer }
            owner: { type: string }
            group: { type: string }
            uid: { type: integer }
            gid: { type: integer }
            mode: { type: string }
        error: { type: string, description: This resource couldn't be observed (never compliant) }
        source: { type: string, enum: [monitoring, check] }
        at: { type: integer }
    DesiredDiff:
      type: object
      required: [field, desired, current]
      properties:
        field: { type: string, enum: [state, enabled, installed, exists, type, content, owner, group, mode] }
        desired: { type: string }
        current: { type: string }
    DesiredResourceView:
      type: object
      required: [key, kind, name, status, since, want, current, diffs, source, restorable, acceptable, auto]
      properties:
        key: { type: string }
        kind: { type: string, enum: [service, package, file] }
        name: { type: string }
        status: { $ref: '#/components/schemas/DesiredStatus' }
        since: { type: integer }
        desired: { $ref: '#/components/schemas/DesiredResource' }
        want: { type: string }
        current: { type: string }
        observed: { $ref: '#/components/schemas/DesiredObservation' }
        observed_at: { type: integer }
        diffs: { type: array, items: { $ref: '#/components/schemas/DesiredDiff' } }
        note: { type: string, description: Why it is unknown, why a restore failed, or why it can't be restored }
        source: { $ref: '#/components/schemas/DesiredSource' }
        restorable: { type: boolean }
        blocker: { type: string }
        acceptable: { type: boolean }
        job_id: { type: string, description: A correction in progress }
        last_job_id: { type: string }
        auto:
          type: object
          required: [enabled, attempts]
          properties:
            enabled: { type: boolean }
            baseline: { $ref: '#/components/schemas/DesiredBaselineRef' }
            paused: { type: string }
            attempts: { type: integer }
            next_at: { type: integer }
    DesiredHost:
      type: object
      required: [host_id, name, status, counts, resources, excluded, groups, baselines, path, check_every_s]
      properties:
        host_id: { type: string }
        name: { type: string }
        status: { type: string }
        counts: { $ref: '#/components/schemas/DesiredCounts' }
        resources: { type: array, items: { $ref: '#/components/schemas/DesiredResourceView' } }
        excluded:
          type: array
          items: { type: object, required: [key, name, kind, source], properties: { key: { type: string }, name: { type: string }, kind: { type: string }, source: { $ref: '#/components/schemas/DesiredSource' } } }
        groups: { type: array, items: { $ref: '#/components/schemas/DesiredGroupRef' } }
        baselines:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DesiredBaselineRef'
              - { type: object, required: [via], properties: { via: { type: string } } }
        packages_at: { type: integer }
        packages_note: { type: string }
        files_at: { type: integer }
        files_note: { type: string }
        services_at: { type: integer }
        unknown_since: { type: integer }
        maintenance: { type: string, description: 'The maintenance reason when the host is in maintenance' }
        path:
          type: object
          required: [agent_connected, blocked]
          properties: { agent_connected: { type: boolean }, agent_state: { type: string }, blocked: { type: boolean }, reason: { type: string } }
        check_every_s: { type: integer }
        firewall:
          type: object
          description: The host's firewall policy is managed by the Firewall (designer and transactions), not by desired state; this is its state, for a link. Only for callers with firewall.read.
          required: [mode, enforced]
          properties:
            mode: { type: string, enum: ['off', monitor, guided, enforce] }
            enforced: { type: boolean }
            drift: { type: string }
    DesiredHistoryEntry:
      type: object
      required: [id, ts, host_id, host_name, kind, detail, diffs]
      properties:
        id: { type: integer }
        ts: { type: integer }
        host_id: { type: string }
        host_name: { type: string }
        key: { type: string }
        resource: { type: string }
        kind: { type: string, description: 'drift_detected, drift_changed, compliant, resolved_by_configuration, accepted, no_longer_managed, conflict_detected, conflict_resolved, unknown, observed, restore_requested, restored, restore_failed, restore_unverified' }
        status: { type: string }
        prev_status: { type: string }
        resolution: { type: string, enum: [restored, configuration, observed], description: 'How drift ended: a corrective job proven by a fresh check; a change of desired state (the host didn''t change); the host changed by other means' }
        detail: { type: string }
        desired: { $ref: '#/components/schemas/DesiredResource' }
        diffs: { type: array, items: { $ref: '#/components/schemas/DesiredDiff' } }
        baseline: { $ref: '#/components/schemas/DesiredBaselineRef' }
        source_label: { type: string }
        job_id: { type: string }
        actor: { type: string }
    DesiredReview:
      type: object
      required: [resource]
      properties:
        resource: { $ref: '#/components/schemas/DesiredResourceView' }
        content_allowed: { type: boolean }
        file_error: { type: string }
        file:
          type: object
          required: [state, desired, artifact, artifact_size, artifact_text]
          properties:
            state: { type: string, enum: [create, identical, replace, metadata] }
            current:
              type: object
              required: [exists, owner, group, mode, size, captured]
              properties: { exists: { type: boolean }, sha256: { type: string }, owner: { type: string }, group: { type: string }, mode: { type: string }, size: { type: integer }, captured: { type: boolean } }
            desired:
              type: object
              required: [owner, group, mode, size]
              properties: { owner: { type: string }, group: { type: string }, mode: { type: string }, size: { type: integer } }
            diff: { type: string }
            diff_note: { type: string }
            artifact: { type: string }
            artifact_size: { type: integer }
            artifact_text: { type: boolean }
    DesiredAcceptResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: array
          items:
            type: object
            required: [key, was, now]
            properties:
              key: { type: string }
              was: { type: string }
              now: { type: string }
              resource: { $ref: '#/components/schemas/DesiredResource' }
              excluded: { type: boolean }
    DesiredRestoreRequest:
      type: object
      properties:
        host_ids: { type: array, items: { type: string } }
        keys: { type: array, items: { type: string } }
        baseline_id: { type: string }
        strategy: { $ref: '#/components/schemas/Strategy' }
        allow_removals: { type: boolean, description: Let removing a prohibited package also remove packages that depend on it (off by default; then such a removal fails safely) }
        plan_hash: { type: string, description: 'Required to restore: the preview''s hash' }
    DesiredPlanItem:
      type: object
      required: [host_id, host_name, key, kind, want, current, diffs, job, step, source_label, desired]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        key: { type: string }
        kind: { type: string }
        want: { type: string }
        current: { type: string }
        diffs: { type: array, items: { $ref: '#/components/schemas/DesiredDiff' } }
        job: { type: integer }
        step: { type: integer }
        source_label: { type: string }
        baseline: { $ref: '#/components/schemas/DesiredBaselineRef' }
        desired: { $ref: '#/components/schemas/DesiredResource' }
    DesiredPlanJob:
      type: object
      required: [name, steps, step_text, step_hosts, hosts, waves, strategy]
      properties:
        name: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        step_text: { type: array, items: { type: string } }
        step_hosts: { type: array, items: { type: integer }, description: How many hosts run each step }
        hosts:
          type: array
          items: { type: object, required: [host_id, host_name, steps, wave], properties: { host_id: { type: string }, host_name: { type: string }, steps: { type: array, items: { type: integer } }, wave: { type: integer } } }
        waves: { type: array, items: { $ref: '#/components/schemas/RolloutWave' } }
        strategy: { $ref: '#/components/schemas/Strategy' }
        wave_note: { type: string }
    DesiredPlan:
      type: object
      required: [items, excluded, jobs, warnings, removals, options, hosts, hash, at, needs]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DesiredPlanItem' } }
        excluded:
          type: array
          items: { type: object, required: [host_id, host_name, key, status, reason], properties: { host_id: { type: string }, host_name: { type: string }, key: { type: string }, status: { type: string }, reason: { type: string } } }
        jobs: { type: array, items: { $ref: '#/components/schemas/DesiredPlanJob' } }
        warnings:
          type: array
          items: { type: object, required: [message], properties: { host_id: { type: string }, host_name: { type: string }, key: { type: string }, message: { type: string } } }
        removals:
          type: array
          items: { type: object, required: [host_id, host_name, package, also], properties: { host_id: { type: string }, host_name: { type: string }, package: { type: string }, also: { type: array, items: { type: string } }, error: { type: string } } }
        options:
          type: object
          properties: { strategy: { $ref: '#/components/schemas/Strategy' }, allow_removals: { type: boolean } }
        hosts: { type: integer }
        hash: { type: string }
        at: { type: integer }
        needs: { type: array, items: { type: string }, description: Permissions the corrections need beyond desired.restore and jobs.execute }
    DesiredRestoreResult:
      type: object
      required: [jobs, plan]
      properties:
        jobs: { type: array, items: { type: string } }
        plan: { $ref: '#/components/schemas/DesiredPlan' }
    DesiredResourceChange:
      type: object
      required: [key, name, kind]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string }
        from: { type: string }
        to: { type: string }
    DesiredHostImpact:
      type: object
      required: [host_id, host_name, now, after, detail]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        now: { type: string }
        after: { type: string }
        detail: { type: array, items: { type: string } }
    DesiredImpact:
      type: object
      required: [changed, added, removed, modified, assignments_added, assignments_removed, hosts_affected, become_drifted, become_compliant, new_conflicts, resolved_conflicts, to_check, counts, auto, warnings]
      properties:
        changed: { type: boolean }
        added: { type: array, items: { $ref: '#/components/schemas/DesiredResourceChange' } }
        removed: { type: array, items: { $ref: '#/components/schemas/DesiredResourceChange' } }
        modified: { type: array, items: { $ref: '#/components/schemas/DesiredResourceChange' } }
        assignments_added: { type: array, items: { $ref: '#/components/schemas/DesiredAssignment' } }
        assignments_removed: { type: array, items: { $ref: '#/components/schemas/DesiredAssignment' } }
        hosts_affected: { type: integer }
        become_drifted: { type: array, items: { $ref: '#/components/schemas/DesiredHostImpact' } }
        become_compliant: { type: array, items: { $ref: '#/components/schemas/DesiredHostImpact' } }
        new_conflicts: { type: array, items: { $ref: '#/components/schemas/DesiredHostImpact' } }
        resolved_conflicts: { type: array, items: { $ref: '#/components/schemas/DesiredHostImpact' } }
        to_check: { type: array, items: { $ref: '#/components/schemas/DesiredHostImpact' } }
        counts:
          type: object
          required: [become_drifted, become_compliant, new_conflicts, resolved_conflicts, to_check, unchanged]
          properties:
            become_drifted: { type: integer }
            become_compliant: { type: integer }
            new_conflicts: { type: integer }
            resolved_conflicts: { type: integer }
            to_check: { type: integer }
            unchanged: { type: integer }
        auto: { type: boolean }
        warnings: { type: array, items: { type: string } }
    DesiredGroupPriority:
      type: object
      required: [group_id, name, priority, hosts, baselines]
      properties:
        group_id: { type: string }
        name: { type: string }
        priority: { type: integer }
        hosts: { type: integer }
        baselines: { type: array, items: { type: string } }
