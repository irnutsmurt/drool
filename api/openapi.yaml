openapi: 3.1.0
info:
  title: DROOL API
  version: 0.1.0
  description: |
    Public REST API. The web UI uses this same API.

    Authentication: a browser session cookie (`drool_session`) or `Authorization: Bearer drool_tok_...`.
    State-changing requests made with a session cookie must send the `X-DROOL-CSRF` header,
    using the value of `csrf_token` from `/auth/me` or the login response.

    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /api/v1
security:
  - session: []
  - bearer: []

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      description: Whether the controller still needs its first administrator.
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
  /setup/claim:
    post:
      operationId: claimSetup
      tags: [setup]
      security: []
      description: |
        Create the first administrator using the one-time setup code shown in the controller's
        console output (or an operator-provided setup secret). Succeeds at most once; on success
        the new administrator is logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupClaimRequest' }
      responses:
        '201':
          description: Administrator created and logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      description: Change the current user's password. Requires an interactive session. Revokes the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      description: 'Requires `users.manage`.'
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      tags: [users]
      description: Disabling a user or setting their password revokes their sessions. The last enabled administrator cannot be demoted or disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      tags: [users]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      description: The current user's API tokens.
      responses:
        '200':
          description: Tokens (secrets are never returned).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/APIToken' } }
    post:
      operationId: createToken
      tags: [tokens]
      description: Requires an interactive session, so a leaked token cannot mint more tokens. The token secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIToken' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteToken
      tags: [tokens]
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      description: 'Requires `audit.read`. Newest first; cursor pagination.'
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: actor, in: query, description: Actor id, schema: { type: string } }
        - { name: action, in: query, description: Action prefix, e.g. "auth.", schema: { type: string } }
        - { name: target, in: query, description: Target id, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next_cursor: { type: string }
        '403': { $ref: '#/components/responses/Problem' }

  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      description: 'Configuration values and their sources are included only with `settings.read`.'
      responses:
        '200':
          description: System information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }

  /secrets:
    get:
      operationId: listSecrets
      tags: [credentials]
      description: 'Credential metadata (values are never returned). Requires `credentials.use`.'
      responses:
        '200':
          description: Credentials.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Credential' } }
    post:
      operationId: createSecret
      tags: [credentials]
      description: |
        Requires `credentials.manage`. For `ssh_private_key`, either paste a key in `value`
        (with `passphrase` if it is encrypted; the passphrase is not stored) or set `generate`
        to create a new ed25519 key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /secrets/controller-ssh-key:
    get:
      operationId: getControllerKey
      tags: [credentials]
      description: The controller's default SSH public key and a command to install it on a host.
      responses:
        '200':
          description: Controller key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControllerKey' }
  /secrets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSecret
      tags: [credentials]
      responses:
        '200':
          description: Credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSecret
      tags: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCredentialRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSecret
      tags: [credentials]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      parameters:
        - { name: q, in: query, description: Substring of name, address or description, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: group, in: query, description: Group id, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HostStatus' } }
      responses:
        '200':
          description: Hosts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Host' } }
    post:
      operationId: createHost
      tags: [hosts]
      description: |
        New hosts start in `pending_hostkey`. Scan and approve the host key, then run a
        connection test. `credential_id` defaults to the controller key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHost
      tags: [hosts]
      responses:
        '200':
          description: Host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateHost
      tags: [hosts]
      description: Changing the address or port retires the pinned host key; it must be approved again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteHost
      tags: [hosts]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/hostkeys:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listHostKeys
      tags: [hosts]
      responses:
        '200':
          description: Pinned, offered and retired keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HostKey' } }
  /hosts/{id}/hostkeys/scan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: scanHostKeys
      tags: [hosts]
      description: Connects without authenticating and records the offered host keys for review.
      responses:
        '200':
          description: All keys for the host after the scan.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HostKey' } }
        '502': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/hostkeys/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveHostKey
      tags: [hosts]
      description: 'Pin an offered key by id, or by an expected fingerprint obtained out of band. Requires `hostkeys.approve`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key_id: { type: string }
                fingerprint: { type: string, example: 'SHA256:...' }
      responses:
        '200':
          description: Pinned key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostKey' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /hosts/{id}/probe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: probeHost
      tags: [hosts]
      description: |
        Connection test over a fresh connection: reachability, host key, authentication,
        privilege escalation, Linux and systemd. Changes nothing on the host; updates the
        host's status. Requires `jobs.execute`.
      responses:
        '200':
          description: Probe result (also returned when checks fail).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
    post:
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGroup
      tags: [groups]
      responses:
        '200':
          description: Group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateGroup
      tags: [groups]
      description: '`host_ids`, when present, replaces the members.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteGroup
      tags: [groups]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: drool_session }
    bearer: { type: http, scheme: bearer }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        error_class: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        fields: { type: object, additionalProperties: { type: string } }

    SetupStatus:
      type: object
      required: [setup_required, code_available]
      properties:
        setup_required: { type: boolean }
        code_available: { type: boolean, description: An unexpired setup code exists. }

    SetupClaimRequest:
      type: object
      required: [code, username, password]
      additionalProperties: false
      properties:
        code: { type: string }
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$' }
        password: { type: string, format: password, minLength: 12 }

    Role:
      type: string
      enum: [admin, operator, auditor, viewer]

    User:
      type: object
      required: [id, username, role, disabled, last_login_at]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }

    Me:
      type: object
      required: [user, permissions, auth_kind]
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string } }
        auth_kind: { type: string, enum: [session, token] }
        csrf_token: { type: string, description: Present for session authentication. }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{1,64}$' }
        password: { type: string, format: password, minLength: 12 }
        role: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        password: { type: string, format: password, minLength: 12 }

    APIToken:
      type: object
      required: [id, name, created_at, last_used_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: '#/components/schemas/APIToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown once. }

    CreateTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 3650 }

    AuditEvent:
      type: object
      required: [id, ts, actor, action, target, result, source_ip, request_id, details]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [user, token, system, anonymous] }
            id: { type: string }
            name: { type: string }
        action: { type: string }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }

    ConfigValue:
      type: object
      required: [key, value, source, env_var]
      properties:
        key: { type: string }
        value: {}
        source: { type: string, enum: [default, file, env] }
        env_var: { type: string }

    SystemInfo:
      type: object
      required: [version, commit, build_date, go_version, schema_version, tls_mode, insecure_plaintext]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
        schema_version: { type: integer }
        tls_mode: { type: string, enum: [self_signed, provided, 'off'] }
        insecure_plaintext: { type: boolean }
        config_file: { type: string }
        config: { type: array, items: { $ref: '#/components/schemas/ConfigValue' } }

    CredentialKind:
      type: string
      enum: [ssh_private_key, password, sudo_password]

    HostRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Credential:
      type: object
      required: [id, name, kind, description, used_by, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        description: { type: string }
        public_key: { type: string, description: authorized_keys line for SSH keys }
        used_by: { type: array, items: { $ref: '#/components/schemas/HostRef' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCredentialRequest:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        description: { type: string }
        value: { type: string, format: password }
        passphrase: { type: string, format: password }
        generate: { type: boolean }

    UpdateCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        value: { type: string, format: password }
        passphrase: { type: string, format: password }
        generate: { type: boolean }

    ControllerKey:
      type: object
      required: [credential_id, public_key, install_command]
      properties:
        credential_id: { type: string }
        public_key: { type: string }
        install_command: { type: string }

    HostStatus:
      type: string
      enum: [pending_hostkey, untested, ready, unreachable, hostkey_mismatch, auth_failed, unsupported, disabled]

    HostKey:
      type: object
      required: [id, type, fingerprint, status, first_seen_at, last_seen_at, decided_at]
      properties:
        id: { type: string }
        type: { type: string }
        fingerprint: { type: string }
        status: { type: string, enum: [offered, pinned, retired] }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }

    Host:
      type: object
      required: [id, name, description, address, port, user, credential_id, become_method, become_credential_id,
                 needs_pty, jump_only, via_host_id, status, status_detail, last_probe_at, tags, group_ids,
                 pinned_key, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        port: { type: integer }
        user: { type: string }
        credential_id: { type: string }
        become_method: { type: string, enum: [sudo, none] }
        become_credential_id: { type: [string, 'null'] }
        needs_pty: { type: boolean }
        jump_only: { type: boolean }
        via_host_id: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HostStatus' }
        status_detail: { type: string }
        last_probe_at: { type: [string, 'null'], format: date-time }
        tags: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }
        pinned_key:
          oneOf:
            - $ref: '#/components/schemas/HostKey'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HostRequest:
      type: object
      additionalProperties: false
      description: For create, name, address and user are required. For PATCH, omitted fields are unchanged.
      properties:
        name: { type: string }
        description: { type: string }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string }
        credential_id: { type: string }
        become_method: { type: string, enum: [sudo, none] }
        become_credential_id: { type: [string, 'null'], description: Empty or null means passwordless sudo }
        needs_pty: { type: boolean }
        jump_only: { type: boolean }
        via_host_id: { type: [string, 'null'], description: Jump host id; empty or null for direct }
        tags: { type: array, items: { type: string } }
        group_ids: { type: array, items: { type: string } }

    ProbeStep:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, failed, skipped] }
        detail: { type: string }
        error_class: { type: string }
        hint: { type: string }

    ProbeResult:
      type: object
      required: [ok, steps, host]
      properties:
        ok: { type: boolean }
        steps: { type: array, items: { $ref: '#/components/schemas/ProbeStep' } }
        host: { $ref: '#/components/schemas/Host' }

    Group:
      type: object
      required: [id, name, description, host_ids, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        host_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        host_ids: { type: array, items: { type: string } }
