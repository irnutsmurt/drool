# Runs on GitHub Actions and Gitea/Forgejo Actions. RELEASING.md lists what
# each layer covers; the VM layers (hours of software emulation) run on a
# machine you control before a release.
name: ci
on:
  push:
  pull_request:

# Read-only; only the image job may write (packages).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the version of a development build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Web dependencies
        run: make web-deps
      - name: Generated code is current
        run: PATH="$PATH:$(go env GOPATH)/bin" make check-generated
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet && go vet -tags integration ./test/integration/
      - name: Web build (embedded in the binary)
        run: make web
      - name: Go tests with the race detector
        run: make test-race
      - name: Web typecheck and unit tests
        run: make test-web

  # Every release artifact from this commit, and the release tests that need
  # only Docker: what the artifacts contain, the container image with its
  # compose.yaml, the packages on every supported distribution, upgrades
  # from older versions and back, older Shepherds.
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, and the older versions the upgrade tests build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docker with the containerd image store (multi-platform images)
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: '{"features": {"containerd-snapshotter": true}}'
      - name: Build the release
        run: packaging/release/build.sh --out dist/release
      - name: Qualify the release artifacts
        run: >-
          go test -tags integration -count=1 -timeout 90m ./test/integration/ -release dist/release -v
          -run 'TestReleaseArtifacts|TestReleaseSigning|TestContainerImage|TestReleasePackages|TestReleaseUpgrade|TestMixedVersionShepherds'
      - uses: actions/upload-artifact@v4
        with:
          name: drool-${{ github.sha }}
          path: dist/release/

  # main's development image on GitHub Container Registry: the image the
  # release job built and qualified, pushed byte for byte (the index digest
  # in release.json) as ghcr.io/<owner>/drool:sha-<commit> and, while the
  # commit is still the newest on main, :main. Never a version tag or latest;
  # release images are published by hand (RELEASING.md).
  image:
    needs: release
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drool-${{ github.sha }}
          path: dist/release
      - name: The artifacts are this commit's, built from a clean tree
        working-directory: dist/release
        run: |
          set -euo pipefail
          sha256sum --check --quiet SHA256SUMS
          jq -e --arg c "$GITHUB_SHA" '.commit == $c' release.json
          v=$(jq -r .version release.json)
          tar -xzf "drool_${v#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/drool_${v#v}_linux_amd64/drool" version --json | tee "$RUNNER_TEMP/version.json"
          jq -e --arg c "$GITHUB_SHA" '.commit == $c and .modified == false' "$RUNNER_TEMP/version.json"
      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drool
          rel=dist/release/release.json
          v=$(jq -r .version "$rel") digest=$(jq -r .image.index_digest "$rel") tag=sha-${GITHUB_SHA::7}
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all --preserve-digests "oci-archive:dist/release/drool_${v#v}_image.oci.tar" "docker://$image:$tag"
          pushed=sha256:$(skopeo inspect --raw "docker://$image:$tag" | sha256sum | cut -d' ' -f1)
          [[ $pushed == "$digest" ]] || { echo "::error::$image:$tag is $pushed; the release built $digest"; exit 1; }
          tags=$tag
          if [[ $(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) == "$GITHUB_SHA" ]]; then
            skopeo copy --all --preserve-digests "docker://$image@$digest" "docker://$image:main"
            tags+=", main"
          else
            echo "::notice::main has moved on since $GITHUB_SHA; $image:main stays where it is"
          fi
          platforms=$(skopeo inspect --raw "docker://$image@$digest" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(", ")')
          printf '### %s\n\n%s (%s), %s\n\nTags: %s. Platforms: %s.\n' "$image" "$v" "$(jq -r .channel "$rel")" \
            "\`$digest\`" "$tags" "$platforms" | tee -a "$GITHUB_STEP_SUMMARY"
