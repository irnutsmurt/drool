# A release tag (vX.Y.Z, vX.Y.Z-rc.N): build every artifact and run the
# release qualification that needs only Docker and a browser on them. The
# artifacts are uploaded unsigned: the release manager checks them, runs the
# VM layers, signs SHA256SUMS offline and publishes (RELEASING.md). No key
# is ever available to this workflow.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Docker with the containerd image store (multi-platform images)
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: '{"features": {"containerd-snapshotter": true}}'
      - name: Build the release
        run: packaging/release/build.sh --commit "$GITHUB_REF_NAME" --out "dist/$GITHUB_REF_NAME"
      - name: Build it again without any cache (reproducibility)
        run: |
          packaging/release/build.sh --commit "$GITHUB_REF_NAME" --no-cache --out /tmp/again
          diff "dist/$GITHUB_REF_NAME/SHA256SUMS" /tmp/again/SHA256SUMS
      - name: Web dependencies (browser tests)
        run: make web-deps
      - name: Qualify the release artifacts, with the integration and browser tests
        env:
          CHROME: /usr/bin/google-chrome
        run: go test -tags integration -count=1 -timeout 300m ./test/integration/ -release "dist/$GITHUB_REF_NAME" -v
      - uses: actions/upload-artifact@v4
        with:
          name: drool-${{ github.ref_name }}-unsigned
          path: dist/${{ github.ref_name }}/
